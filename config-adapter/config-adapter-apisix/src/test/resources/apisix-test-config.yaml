apisix:
  node_listen:
    - 9080
  enable_http2: true
  enable_heartbeat: true
  enable_admin: true
  enable_debug: true
  enable_dev_mode: true
  enable_reuseport: true
  ssl:
    enable: true
    listen:
      - port: 9443

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    admin_key:
      - name: "admin"
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    enable_admin_cors: true
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      host: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
