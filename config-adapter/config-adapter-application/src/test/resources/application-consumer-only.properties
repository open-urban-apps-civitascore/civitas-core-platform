# Test configuration with consumer only (no publisher)
healthcheck.port=8088
adapters=dummylog
eventconsumer.name=kafka
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-test-group
dummylog.topics=de.civitascore.idm.user.created

# Use custom orchestrator in tests (Flowable requires JDBC)
# Flowable saga engine on in-memory H2 (no external DB needed for bootstrap tests)
flowable.jdbc.url=jdbc:h2:mem:application_consumer_only_;DB_CLOSE_DELAY=-1
flowable.jdbc.username=sa
flowable.jdbc.password=

# --- Saga command handler config (required by the Flowable orchestrator at bootstrap) ---
# Dummy but structurally valid values; these tests never reach out to APISIX/FROST.
apisix.admin.key=test-admin-key
apisix.api.host=api.test.local
apisix.api.public.url=http://api.test.local
frost.api.key=test-frost-key
apisix.plugin.config.id=test-plugin-config
apisix.service.id=test-service
apisix.frost.api.key=test-frost-upstream-key
