# Test configuration with separate consumer and publisher
healthcheck.port=8084
adapters=dummylog
eventconsumer.name=kafka
eventpublisher.name=kafka
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-test-group
dummylog.topics=de.civitascore.idm.user.created,de.civitascore.idm.user.updated

# Use custom orchestrator in tests (Flowable requires JDBC)
orchestrator.engine=custom
