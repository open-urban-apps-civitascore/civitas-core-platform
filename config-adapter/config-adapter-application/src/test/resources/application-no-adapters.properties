# Test configuration with no adapters configured
healthcheck.port=8082
eventhandler.name=kafka
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-test-group
# Use custom orchestrator in tests (Flowable requires JDBC)
# Flowable saga engine on in-memory H2 (no external DB needed for bootstrap tests)
flowable.jdbc.url=jdbc:h2:mem:application_no_adapters_;DB_CLOSE_DELAY=-1
flowable.jdbc.username=sa
flowable.jdbc.password=
