# Application Configuration
#
# Configuration powered by Apache Commons Configuration2
# Supports layered configuration with automatic environment variable override support.
#
# Environment Variable Override Support:
# All properties can be overridden by environment variables.
# Property keys are converted to environment variable names by:
# - Converting to uppercase
# - Replacing dots (.) with underscores (_)
# - Replacing dashes (-) with underscores (_)
#
# Resolution Order (highest priority first):
# 1. Environment variables (KAFKA_BOOTSTRAP_SERVERS, HEALTHCHECK_PORT, etc.)
# 2. Properties from this file
# 3. Default values (if specified in code)
#
# Examples:
#   kafka.bootstrap.servers -> KAFKA_BOOTSTRAP_SERVERS
#   healthcheck.port -> HEALTHCHECK_PORT
#   keycloak.client.id -> KEYCLOAK_CLIENT_ID

# Health Check Configuration
# Port for health check HTTP server (default: 8080)
# Endpoints: /health, /health/ready, /health/live
# Environment variable: HEALTHCHECK_PORT
healthcheck.port=8280

# Multiple adapters (comma-separated list)
# Each adapter subscribes to specific Kafka topics via getSubscribedTopics()
# Environment variable: ADAPTERS
adapters=keycloak,apisix,frost

# Event Handler Configuration
# Option 1: Combined handler (implements both EventConsumer and EventPublisher)
# Environment variable: EVENTHANDLER_CLASS
eventhandler.name=kafka

# Option 2: Separate consumer and publisher implementations
# Use this when you want to consume from one messaging system and publish to another
# NOTE: Cannot use both 'eventhandler.class' and 'eventconsumer.class'/'eventpublisher.class' simultaneously
# eventconsumer.class=com.civitas.event.handler.kafka.KafkaEventConsumer
# eventpublisher.class=com.civitas.event.handler.kafka.KafkaEventPublisher

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-group

# Kafka Retry & DLQ Configuration
# Maximum retry attempts for transient errors before sending to DLQ
kafka.retry.max.attempts=3
# Initial backoff delay in milliseconds (exponential backoff: delay * 2^attempt)
kafka.retry.initial.backoff.ms=1000
# Dead Letter Queue topic for failed events
kafka.dlq.topic=core.civitas.idm.dlq

# Keycloak Configuration
# Topics that the Keycloak adapter should subscribe to (comma-separated)
# Available topics: user.created, user.updated, user.deleted, user.locked, user.unlocked,
#                   user.password.changed, user.password.reset,
#                   realm.created, realm.updated, realm.deleted,
#                   client.created, client.updated, client.deleted,
#                   group.created, group.updated, group.deleted,
#                   role.created, role.updated, role.deleted
keycloak.topics=core.civitas.idm.user.created,core.civitas.idm.user.updated,core.civitas.idm.user.deleted,core.civitas.idm.user.locked,core.civitas.idm.user.unlocked,core.civitas.idm.user.password.changed,core.civitas.idm.user.password.reset,core.civitas.idm.realm.created,core.civitas.idm.realm.updated,core.civitas.idm.realm.deleted,core.civitas.idm.client.created,core.civitas.idm.client.updated,core.civitas.idm.client.deleted,core.civitas.idm.role.created,core.civitas.idm.role.updated,core.civitas.idm.role.deleted

keycloak.url=http://localhost:8080
keycloak.realm=master
keycloak.username=admin
keycloak.password=admin
keycloak.client.id=admin-cli

# APISIX Configuration
# Topics that the APISIX adapter should subscribe to (comma-separated)
# Available topics: core.civitas.api.backend.created,
#                   core.civitas.api.backend.updated
#                   core.civitas.api.backend.deleted
apisix.topics=core.civitas.api.backend.created,core.civitas.api.backend.updated,core.civitas.api.backend.deleted

apisix.admin.url=http://localhost:9080
apisix.admin.key=edd1c9f034335f136f87ad84b625c8f1

# DummyLogAdapter Configuration
# DummyLogAdapter is a simple example that just logs events
# Topics that the DummyLogAdapter should subscribe to (comma-separated)
dummylog.topics=core.civitas.idm.user.created,core.civitas.idm.user.updated,core.civitas.idm.user.deleted

# FROST-Server Adapter Configuration
# FROST adapter manages SensorThings API entities (Things, Locations, Sensors, ObservedProperties, Datastreams)
# Topics that the FROST adapter should subscribe to (comma-separated)
# Available topics: thing.created, thing.updated, thing.deleted,
#                   location.created, location.updated, location.deleted,
#                   sensor.created, sensor.updated, sensor.deleted,
#                   observedproperty.created, observedproperty.updated, observedproperty.deleted,
#                   datastream.created, datastream.updated, datastream.deleted
frost.topics=core.civitas.data.thing.created,core.civitas.data.thing.updated,core.civitas.data.thing.deleted,core.civitas.data.location.created,core.civitas.data.location.updated,core.civitas.data.location.deleted,core.civitas.data.sensor.created,core.civitas.data.sensor.updated,core.civitas.data.sensor.deleted,core.civitas.data.observedproperty.created,core.civitas.data.observedproperty.updated,core.civitas.data.observedproperty.deleted,core.civitas.data.datastream.created,core.civitas.data.datastream.updated,core.civitas.data.datastream.deleted

# FROST-Server URL (via APISIX gateway)
frost.url=http://localhost:9080/FROST-Server/v1.1

# API key for authentication (required)
# For local development with dev-environment/frost, use: dev-frost-api-key
frost.api.key=dev-frost-api-key

# HTTP header name for the API key (optional, defaults to X-API-Key)
frost.api.key.header=X-API-Key
