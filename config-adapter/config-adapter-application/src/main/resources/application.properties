# Application Configuration
#
# Configuration powered by Apache Commons Configuration2
# Supports layered configuration with automatic environment variable override support.
#
# Environment Variable Override Support:
# All properties can be overridden by environment variables.
# Property keys are converted to environment variable names by:
# - Converting to uppercase
# - Replacing dots (.) with underscores (_)
# - Replacing dashes (-) with underscores (_)
#
# Resolution Order (highest priority first):
# 1. Environment variables (KAFKA_BOOTSTRAP_SERVERS, HEALTHCHECK_PORT, etc.)
# 2. Properties from this file
# 3. Default values (if specified in code)
#
# Examples:
#   kafka.bootstrap.servers -> KAFKA_BOOTSTRAP_SERVERS
#   healthcheck.port -> HEALTHCHECK_PORT
#   keycloak.client.id -> KEYCLOAK_CLIENT_ID

# Health Check Configuration
# Port for health check HTTP server (default: 8080)
# Endpoints: /health, /health/ready, /health/live
# Environment variable: HEALTHCHECK_PORT
healthcheck.port=8280

# Multiple adapters (comma-separated list)
# Each adapter subscribes to specific Kafka topics via getSubscribedTopics()
# Environment variable: ADAPTERS
adapters=keycloak,apisix,frost

# Event Handler Configuration
# Option 1: Combined handler (implements both EventConsumer and EventPublisher)
# Environment variable: EVENTHANDLER_CLASS
eventhandler.name=kafka

# Option 2: Separate consumer and publisher implementations
# Use this when you want to consume from one messaging system and publish to another
# NOTE: Cannot use both 'eventhandler.class' and 'eventconsumer.class'/'eventpublisher.class' simultaneously
# eventconsumer.class=de.civitascore.event.handler.kafka.KafkaEventConsumer
# eventpublisher.class=de.civitascore.event.handler.kafka.KafkaEventPublisher

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-group

# Kafka Retry & DLQ Configuration
# Maximum retry attempts for transient errors before sending to DLQ
kafka.retry.max.attempts=3
# Initial backoff delay in milliseconds (exponential backoff: delay * 2^attempt)
kafka.retry.initial.backoff.ms=1000
# Dead Letter Queue topic for failed events
kafka.dlq.topic=de.civitascore.configadapter.dlq

# Keycloak Configuration
# Topics that the Keycloak adapter should subscribe to (comma-separated)
# Available topics: user.created, user.updated, user.deleted, user.locked, user.unlocked,
#                   user.password.changed, user.password.reset,
#                   realm.created, realm.updated, realm.deleted,
#                   client.created, client.updated, client.deleted,
#                   group.created, group.updated, group.deleted,
#                   role.created, role.updated, role.deleted
keycloak.topics=de.civitascore.idm.user.created,de.civitascore.idm.user.updated,de.civitascore.idm.user.deleted,de.civitascore.idm.user.locked,de.civitascore.idm.user.unlocked,de.civitascore.idm.user.password.changed,de.civitascore.idm.user.password.reset,de.civitascore.idm.realm.created,de.civitascore.idm.realm.updated,de.civitascore.idm.realm.deleted,de.civitascore.idm.client.created,de.civitascore.idm.client.updated,de.civitascore.idm.client.deleted,de.civitascore.idm.role.created,de.civitascore.idm.role.updated,de.civitascore.idm.role.deleted

# Credentials are NOT baked into the image (security guideline). Secret values below are
# supplied at runtime via environment variables — dev defaults live in run.sh and
# docker-compose.yml; in production supply ENC(...) values (see CredentialDecryptor).
keycloak.url=http://localhost:8080
keycloak.realm=master
keycloak.username=admin
# keycloak.password — secret; supply via KEYCLOAK_PASSWORD
keycloak.client.id=admin-cli

# Invitation email redirect configuration (optional, both must be set together or neither)
# When set, the actions email link redirects the user back to the portal
keycloak.invitation.client.id=portal-frontend
keycloak.invitation.redirect.uri=http://localhost:3000/

# APISIX Configuration
# Topics that the APISIX adapter should subscribe to (comma-separated)
# Available topics: de.civitascore.api.backend.created,
#                   de.civitascore.api.backend.updated
#                   de.civitascore.api.backend.deleted
apisix.topics=de.civitascore.api.backend.created,de.civitascore.api.backend.updated,de.civitascore.api.backend.deleted

apisix.admin.url=http://localhost:9180
# apisix.admin.key — secret; supply via APISIX_ADMIN_KEY
# Public API virtual host and public URL (issue #1368). REQUIRED, no defaults on purpose:
# a silent fall-through to a localhost value would create routes that no real client can
# reach in staging/production. Set these via APISIX_API_HOST / APISIX_API_PUBLIC_URL — the
# adapter throws IllegalArgumentException at startup if either is missing.
# Dev: set via dev-environment/start-portal-dev.sh or dev-environment/*/docker-compose.yml.
#
# apisix.plugin.config.id and apisix.service.id — both REQUIRED, no defaults (supply via
# APISIX_PLUGIN_CONFIG_ID / APISIX_SERVICE_ID). plugin.config.id attaches OIDC/OPA to every route;
# service.id is stamped on every route so OPA resolves the backend via with_service — without it OPA
# rejects every dataset route as unknown_backend. The adapter throws at startup if either is missing.
#
# Gateway-reachable GeoServer base for OWS (map services) named-API routes. The APISIX adapter
# parses host/port/scheme from this for the map-server upstream and rewrites OWS routes to
# {this path}/{workspace}/ows. Must be reachable FROM the gateway (e.g. the in-cluster service
# address), distinct from the consumer-facing public URL. Defaults to localhost for IDE runs;
# real deployments override via APISIX_GEOSERVER_URL.
apisix.geoserver.url=http://civitas-geoserver:8080/geoserver

# DummyLogAdapter Configuration
# DummyLogAdapter is a simple example that just logs events
# Topics that the DummyLogAdapter should subscribe to (comma-separated)
dummylog.topics=de.civitascore.idm.user.created,de.civitascore.idm.user.updated,de.civitascore.idm.user.deleted

# FROST-Server Adapter Configuration
# FROST adapter manages SensorThings API entities (Things, Locations, Sensors, ObservedProperties, Datastreams)
# Topics that the FROST adapter should subscribe to (comma-separated)
# Available topics: thing.created, thing.updated, thing.deleted,
#                   location.created, location.updated, location.deleted,
#                   sensor.created, sensor.updated, sensor.deleted,
#                   observedproperty.created, observedproperty.updated, observedproperty.deleted,
#                   datastream.created, datastream.updated, datastream.deleted
frost.topics=de.civitascore.data.thing.created,de.civitascore.data.thing.updated,de.civitascore.data.thing.deleted,de.civitascore.data.location.created,de.civitascore.data.location.updated,de.civitascore.data.location.deleted,de.civitascore.data.sensor.created,de.civitascore.data.sensor.updated,de.civitascore.data.sensor.deleted,de.civitascore.data.observedproperty.created,de.civitascore.data.observedproperty.updated,de.civitascore.data.observedproperty.deleted,de.civitascore.data.datastream.created,de.civitascore.data.datastream.updated,de.civitascore.data.datastream.deleted

# FROST-Server URL used by the FROST saga handler to talk to FROST directly
# (bypassing APISIX). For IDE runs on the host, this is localhost:8085; when the
# adapter runs inside Docker it is overridden via FROST_URL to civitas-frost:8080.
frost.url=http://localhost:8085/FROST-Server/v1.1
# Public FROST URL reported back to portal-backend inside saga results
# (baseUrl in `properties`). Falls back to frost.url when unset — only override
# this when the public-facing URL differs from the internal one (e.g. when the
# adapter talks to FROST via a Docker alias but portal-backend needs a reachable URL).
frost.public.url=http://civitas-frost:8080/FROST-Server/v1.1

# API key for authentication (required) — secret; supply via FROST_API_KEY
# (dev default: dev-frost-api-key, set in run.sh / docker-compose.yml)

# HTTP header name for the API key (optional, defaults to X-API-Key)
frost.api.key.header=X-API-Key

# Apache NiFi Configuration
# The NiFi saga handler transforms the engine-neutral pipeline graph into a curated NiFi flow
# and deploys it via the NiFi REST API. Invoked in-process by the Flowable orchestrator.
nifi.url=https://localhost:8443
# config-adapter authenticates to NiFi via the OIDC client-credentials grant. NiFi 2.x validates the
# Keycloak-issued access token against its configured OpenID Connect provider — single-user login is
# no longer used.
nifi.oidc.token-uri=http://localhost:8080/realms/civitas-core/protocol/openid-connect/token
nifi.oidc.client-id=nifi
# nifi.oidc.client-secret — secret; supply via environment variable NIFI_OIDC_CLIENT_SECRET
# nifi.oidc.scope — optional space-delimited scope to request (leave unset for none)
# Trust the self-signed dev certificate; MUST be false in non-dev environments.
nifi.tls.insecure=true
# FROST SensorThings base URL that FROST-sink pipelines post observations to (NIFI_FROST_URL)
nifi.frost.url=http://localhost:8080/FROST-Server/v1.1
# Platform-managed PostGIS sink connection (not a tenant credential)
# nifi.postgis.url / nifi.postgis.user / nifi.postgis.password — set via environment

# Credential encryption key (hex-encoded, set via environment variable)
# CIVITAS_MASTER_KEY — 256-bit master key (generate with: openssl rand -hex 32)

# Flowable Orchestrator Configuration
# The Flowable engine is the saga orchestrator (the legacy custom orchestrator has been removed;
# orchestrator.engine defaults to 'flowable' and only 'flowable' is supported).

# Flowable database connection — dedicated database and user, provisioned by
# docker/postgres/init-flowable.sql on first PostgreSQL container start.
# flowable.jdbc.url / username overridable via FLOWABLE_JDBC_URL / FLOWABLE_JDBC_USERNAME.
flowable.jdbc.url=jdbc:postgresql://localhost:5433/flowable
flowable.jdbc.username=flowable
# flowable.jdbc.password — secret; supply via FLOWABLE_JDBC_PASSWORD

# Flowable workflow approach: coded (Java builders, default) or bpmn (XML files)
# flowable.approach=coded

# GeoServer Configuration
# The GeoServer saga handler (adapter "geoserver") is invoked by the Flowable dataset sagas only
# when the trigger carries a POSTGIS data sink (hasGeoSink) — dormant until the backend emits that.
# GeoServer REST API URL (direct from host)
geoserver.url=http://localhost:8080/geoserver
# Public URL advertised in WFS/WMS endpoints (reachable from the Docker network)
geoserver.public.url=http://civitas-geoserver:8080/geoserver
# Admin password is a secret — supply via GEOSERVER_ADMIN_PASSWORD (dev default in run.sh /
# docker-compose.yml; in production an ENC(...) value encrypted with CIVITAS_MASTER_KEY).
geoserver.admin.user=admin
# PostGIS connection GeoServer uses for its datastore (Docker-internal host/port; match dev-environment)
geoserver.postgis.host=civitas-postgres
geoserver.postgis.port=5432
geoserver.postgis.database=civitas_geo
# Schema is not configured: the datastore reads from each DataSet's dedicated schema, derived from
# the datasetId (same WorkspaceNames rule as the workspace) — see GeoServerSagaHandler.
geoserver.postgis.user=geo
# geoserver.postgis.password — secret; supply via GEOSERVER_POSTGIS_PASSWORD
# PostGIS Configuration
# PostGIS adapter manages SQL tables (with optional geometry columns), schemas, and roles
# (incl. schema-level grants) via DDL.
# To enable, add 'postgis' to the 'adapters' list above.
# Topics that the PostGIS adapter should subscribe to (comma-separated)
# Role passwords may be encrypted ENC(...) values; decryption uses CIVITAS_MASTER_KEY (see above).
postgis.topics=de.civitascore.data.sql.table.created,de.civitascore.data.sql.table.deleted,de.civitascore.data.sql.schema.created,de.civitascore.data.sql.schema.updated,de.civitascore.data.sql.schema.deleted,de.civitascore.data.sql.role.created,de.civitascore.data.sql.role.updated,de.civitascore.data.sql.role.deleted

# JDBC connection settings
postgis.jdbc.url=jdbc:postgresql://localhost:5432/civitas
postgis.jdbc.user=civitas
# postgis.jdbc.password — secret; not stored here. Supply via POSTGIS_JDBC_PASSWORD
# (dev default in run.sh / dev-environment compose; production: secret store / env var —
# the value is passed to the JDBC pool as-is; ENC(...) is not supported for this property).

# Optional pool tuning (defaults shown)
postgis.jdbc.maxPoolSize=5
postgis.jdbc.connectionTimeoutMs=5000
