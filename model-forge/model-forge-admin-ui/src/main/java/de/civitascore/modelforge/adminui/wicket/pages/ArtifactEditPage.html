<html xmlns:wicket="http://wicket.apache.org">
<body>
<wicket:extend>
  <h2>Edit / create artifact</h2>

  <form wicket:id="editForm">
    <div class="field-row">
      <label>URN</label>
      <input type="text" wicket:id="urn" class="input-wide"/>
    </div>
    <div class="field-row">
      <label>Kind</label>
      <select wicket:id="kind"></select>
    </div>
    <div class="field-row">
      <label>XSD element</label>
      <input type="checkbox" wicket:id="xsd"/>
    </div>
    <div class="field-row">
      <label>Version bump</label>
      <select wicket:id="versionBump"></select>
    </div>
    <div class="field-row">
      <label>Content</label>
      <div wicket:id="content"></div>
    </div>
    <button type="submit">Save</button>
  </form>
</wicket:extend>
</body>
</html>
