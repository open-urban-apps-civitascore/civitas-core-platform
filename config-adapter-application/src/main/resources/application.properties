# Application Configuration

# Multiple adapters (comma-separated list)
# Each adapter subscribes to specific Kafka topics via getSubscribedTopics()
adapters=com.civitas.configadapter.keycloak.KeycloakAdapter,com.civitas.configadapter.examples.DummyLogAdapter

# Example: Multiple adapters running simultaneously
# Each adapter will get its own KafkaEventConsumer subscribed to its topics
#adapters=com.civitas.configadapter.keycloak.KeycloakAdapter,com.civitas.configadapter.examples.DummyLogAdapter

# Event Consumer Configuration
consumer.class=com.civitas.configadapter.kafka.KafkaEventConsumer

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.group.id=config-adapter-group

# Keycloak Configuration
keycloak.url=http://localhost:8080
keycloak.realm=master
keycloak.username=admin
keycloak.password=admin
keycloak.client.id=admin-cli

# DummyLogAdapter Configuration
# DummyLogAdapter is a simple example that just logs events
# Subscribes to: user.created, user.updated, user.deleted
# No additional configuration needed - it just logs everything
