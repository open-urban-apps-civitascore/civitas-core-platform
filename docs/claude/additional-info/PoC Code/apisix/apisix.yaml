# APISIX Declarative Routes Configuration
# M1.4: Full integration with OpenID Connect (JWT) and OPA authorization

routes:
  - id: backend-api
    name: "Demo Backend API Route"
    uri: /api/*
    upstream:
      type: roundrobin
      nodes:
        "civitas-portal:8081": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      # CORS must come before authentication
      cors:
        allow_origins: "http://localhost:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id"
        expose_headers: "X-Request-Id"
        allow_credential: true
        max_age: 3600
      # JWT validation via OpenID Connect (JWKS only, no introspection)
      openid-connect:
        client_id: "demo-app"
        client_secret: "demo-app-secret"
        discovery: "http://keycloak:8080/realms/civitas-poc/.well-known/openid-configuration"
        bearer_only: true
        realm: "civitas-poc"
        ssl_verify: false
        use_jwks: true
        # Sets X-Userinfo header with base64-encoded JWT claims for OPA
        set_userinfo_header: true
      # OPA Authorization - Validates user permissions against PostgreSQL via adapter service
      opa:
        host: "http://opa:8181"
        policy: "authz/decision"
        with_route: false
        with_service: false
        with_consumer: false
      request-id:
        include_in_response: true

  # Backend health check (public, no auth)
  - id: backend-health
    name: "Backend Health Check"
    uri: /actuator/health
    upstream:
      type: roundrobin
      nodes:
        "civitas-portal:8081": 1
    plugins: {}

  # APISIX health check route (for monitoring)
  - id: apisix-health
    name: "APISIX Health Check"
    uri: /apisix/health
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:9080": 1
    plugins: {}

  # Protected Backend - Public API (with OPA authorization)
  - id: protected-backend-api
    name: "Protected Backend API"
    uri: /protected/*
    upstream:
      type: roundrobin
      nodes:
        "protected-backend:8083": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://localhost:3002"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id"
        expose_headers: "X-Request-Id"
        allow_credential: true
        max_age: 3600
      openid-connect:
        client_id: "demo-app"
        client_secret: "demo-app-secret"
        discovery: "http://keycloak:8080/realms/civitas-poc/.well-known/openid-configuration"
        bearer_only: true
        realm: "civitas-poc"
        ssl_verify: false
        use_jwks: true
        set_userinfo_header: true
      opa:
        host: "http://opa:8181"
        policy: "authz/decision"
        with_route: false
        with_service: false
        with_consumer: false
      request-id:
        include_in_response: true
      # Rewrite /protected/* to /api/*
      proxy-rewrite:
        regex_uri: ["/protected/(.*)", "/api/$1"]

  # Protected Backend - Internal Sync API (NO authorization, internal only)
  - id: protected-backend-internal
    name: "Protected Backend Internal Sync"
    uri: /internal/*
    upstream:
      type: roundrobin
      nodes:
        "protected-backend:8083": 1
    plugins: {}

#END
