<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <!-- CIVITAS/CORE colors -->
    <linearGradient id="civitasGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#134E4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164E63;stop-opacity:1" />
    </linearGradient>
    <!-- Component colors (teal-based) -->
    <linearGradient id="apisixGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backendGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="authzGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
    <marker id="arrowheadTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#F0FDFA" />

  <!-- Header -->
  <rect x="0" y="0" width="900" height="65" fill="url(#headerGradient)" />

  <!-- CIVITAS/CORE Logo (simplified hexagon + cube) -->
  <g transform="translate(15, 8)">
    <!-- Hexagon outline -->
    <polygon points="25,5 45,15 45,35 25,45 5,35 5,15" fill="none" stroke="#14B8A6" stroke-width="2.5" />
    <!-- Inner cube (simplified) -->
    <polygon points="25,18 35,23 35,33 25,38 15,33 15,23" fill="#22D3D1" stroke="#0D9488" stroke-width="1" />
    <line x1="25" y1="18" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
    <line x1="15" y1="23" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
    <line x1="35" y1="23" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
  </g>

  <!-- Title -->
  <text x="60" y="30" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="1">CIVITAS</text>
  <text x="138" y="30" fill="#67E8F9" font-size="15">/</text>
  <text x="147" y="30" fill="#22D3EE" font-size="15" font-weight="500">CORE</text>
  <text x="60" y="48" fill="white" font-size="18" font-weight="600">M5.5 Collection Endpoint Filtering – Datenfluss</text>
  <text x="870" y="48" text-anchor="end" fill="#99F6E4" font-size="11">Authorization Scope Filtering Pattern</text>

  <!-- Client Box -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="120" height="60" rx="8" fill="#134E4A" stroke="#0D9488" stroke-width="2" />
    <text x="60" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="500">Client</text>
    <text x="60" y="45" text-anchor="middle" fill="#99F6E4" font-size="11">GET /v2/datasets</text>
  </g>

  <!-- Arrow 1: Client to APISIX -->
  <line x1="200" y1="130" x2="280" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="240" y="118" text-anchor="middle" fill="#6B7280" font-size="10">1. Anfrage</text>

  <!-- APISIX Box -->
  <g transform="translate(290, 85)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="url(#apisixGradient)" />
    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600">APISIX</text>
    <text x="80" y="45" text-anchor="middle" fill="#CFFAFE" font-size="10">1. proxy-rewrite</text>
    <text x="80" y="60" text-anchor="middle" fill="#CFFAFE" font-size="10">2. openid-connect</text>
    <text x="80" y="75" text-anchor="middle" fill="#CFFAFE" font-size="10">3. opa plugin</text>
  </g>

  <!-- Arrow 2: APISIX to OPA -->
  <path d="M 450 130 L 500 130 L 500 240 L 550 240" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="480" y="175" text-anchor="middle" fill="#6B7280" font-size="10" transform="rotate(90, 480, 175)">2. Authz-Prüfung</text>

  <!-- OPA Box -->
  <g transform="translate(560, 200)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#opaGradient)" />
    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600">OPA</text>
    <text x="80" y="45" text-anchor="middle" fill="#99F6E4" font-size="10">Policy-Entscheidung</text>
    <text x="80" y="60" text-anchor="middle" fill="#99F6E4" font-size="10">+ Scope Header</text>
  </g>

  <!-- Arrow 3: OPA to AuthZ Repo -->
  <path d="M 720 240 L 780 240 L 780 350 L 720 350" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="800" y="295" text-anchor="middle" fill="#6B7280" font-size="10" transform="rotate(90, 800, 295)">3. Kontext laden</text>

  <!-- AuthZ Repository Box -->
  <g transform="translate(560, 320)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="url(#authzGradient)" />
    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600">AuthZ Repository</text>
    <text x="80" y="45" text-anchor="middle" fill="#CFFAFE" font-size="10">Benutzerkontext + Scopes</text>
  </g>

  <!-- Arrow 4: OPA response to APISIX (with header) -->
  <path d="M 560 220 L 510 220 L 510 170 L 450 170" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#arrowheadTeal)" />
  <g transform="translate(460, 185)">
    <rect x="0" y="0" width="95" height="30" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="1" />
    <text x="47" y="13" text-anchor="middle" fill="#134E4A" font-size="9" font-weight="500">4. allow: true</text>
    <text x="47" y="24" text-anchor="middle" fill="#134E4A" font-size="8">X-Allowed-Scope-Ids</text>
  </g>

  <!-- Arrow 5: APISIX to Backend -->
  <line x1="370" y1="175" x2="370" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="340" y="255" text-anchor="end" fill="#6B7280" font-size="10">5. Weiterleitung</text>
  <text x="340" y="268" text-anchor="end" fill="#6B7280" font-size="10">+ Header</text>

  <!-- Backend Box -->
  <g transform="translate(290, 340)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#backendGradient)" />
    <text x="80" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="600">Portal Backend</text>
    <text x="80" y="45" text-anchor="middle" fill="#CCFBF1" font-size="10">AllowedScopesFilter</text>
    <text x="80" y="60" text-anchor="middle" fill="#CCFBF1" font-size="10">↓</text>
    <text x="80" y="75" text-anchor="middle" fill="#CCFBF1" font-size="10">preProcessQuery()</text>
    <text x="80" y="90" text-anchor="middle" fill="#CCFBF1" font-size="10">JPA Filtering</text>
  </g>

  <!-- Arrow 6: Backend to Client (response) -->
  <path d="M 290 390 L 200 390 L 200 160 L 140 160" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <text x="175" y="275" text-anchor="middle" fill="#0D9488" font-size="10" transform="rotate(-90, 175, 275)">6. Gefilterte Daten</text>

  <!-- Legend -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="740" height="140" rx="8" fill="white" stroke="#99F6E4" stroke-width="1" />
    <text x="20" y="25" fill="#134E4A" font-size="13" font-weight="600">Header-Werte</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="200" height="30" rx="4" fill="#CCFBF1" />
      <text x="10" y="20" fill="#134E4A" font-size="11" font-family="monospace">X-Allowed-Scope-Ids: *</text>
    </g>
    <text x="230" y="60" fill="#6B7280" font-size="11">TENANT Scope (Wildcard) → Keine Filterung</text>

    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="200" height="30" rx="4" fill="#CCFBF1" />
      <text x="10" y="20" fill="#134E4A" font-size="11" font-family="monospace">X-Allowed-Scope-Ids: a,b,c</text>
    </g>
    <text x="230" y="95" fill="#6B7280" font-size="11">Spezifische Scopes → Filter mit IN (a,b,c)</text>

    <g transform="translate(500, 40)">
      <text x="0" y="0" fill="#134E4A" font-size="12" font-weight="500">Kernprinzip:</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">OPA entscheidet über Scopes.</text>
      <text x="0" y="36" fill="#6B7280" font-size="11">Backend wendet Filter nur an.</text>
      <text x="0" y="52" fill="#6B7280" font-size="11">Keine Authz-Logik im Backend.</text>
    </g>

    <text x="20" y="125" fill="#0D9488" font-size="10" font-style="italic">Pattern: Authorization Scope Filtering / Policy-Enforced Query Filtering</text>
  </g>

  <!-- Footer -->
  <text x="450" y="660" text-anchor="middle" fill="#6B7280" font-size="10">Erstellt mit Claude Code • M5.5 Authorization Scope Filtering • 2026-02-05</text>
</svg>
