<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <!-- CIVITAS/CORE colors -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#134E4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#164E63;stop-opacity:1" />
    </linearGradient>
    <!-- Code block background -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#134E4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F3531;stop-opacity:1" />
    </linearGradient>
    <!-- Component colors (teal-based) -->
    <linearGradient id="filterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="specGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="820" fill="#F0FDFA" />

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="65" fill="url(#headerGradient)" />

  <!-- CIVITAS/CORE Logo (simplified hexagon + cube) -->
  <g transform="translate(15, 8)">
    <polygon points="25,5 45,15 45,35 25,45 5,35 5,15" fill="none" stroke="#14B8A6" stroke-width="2.5" />
    <polygon points="25,18 35,23 35,33 25,38 15,33 15,23" fill="#22D3D1" stroke="#0D9488" stroke-width="1" />
    <line x1="25" y1="18" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
    <line x1="15" y1="23" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
    <line x1="35" y1="23" x2="25" y2="28" stroke="#0D9488" stroke-width="1" />
  </g>

  <!-- Title -->
  <text x="60" y="30" fill="#5EEAD4" font-size="15" font-weight="700" letter-spacing="1">CIVITAS</text>
  <text x="138" y="30" fill="#67E8F9" font-size="15">/</text>
  <text x="147" y="30" fill="#22D3EE" font-size="15" font-weight="500">CORE</text>
  <text x="60" y="48" fill="white" font-size="18" font-weight="600">M5.5 Java-Implementierung – Komponentenarchitektur</text>
  <text x="970" y="48" text-anchor="end" fill="#99F6E4" font-size="11">Portal Backend</text>

  <!-- Component 1: AllowedScopesFilter -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="450" height="180" rx="8" fill="url(#filterGradient)" />
    <text x="15" y="25" fill="white" font-size="14" font-weight="600">1. AllowedScopesFilter</text>
    <text x="15" y="42" fill="#CFFAFE" font-size="10">Servlet Filter • Parst X-Allowed-Scope-Ids Header</text>

    <!-- Code block -->
    <rect x="10" y="55" width="430" height="115" rx="4" fill="url(#codeGradient)" />
    <text font-family="'SF Mono', 'Consolas', monospace" font-size="10">
      <tspan x="20" y="72" fill="#6EE7B7">// Header in AllowedScopes Bean speichern</tspan>
      <tspan x="20" y="88" fill="#67E8F9">String</tspan><tspan fill="#E2E8F0"> header = request.getHeader(</tspan><tspan fill="#5EEAD4">"X-Allowed-Scope-Ids"</tspan><tspan fill="#E2E8F0">);</tspan>
      <tspan x="20" y="104" fill="#A5F3FC">if</tspan><tspan fill="#E2E8F0"> (</tspan><tspan fill="#5EEAD4">"*"</tspan><tspan fill="#E2E8F0">.equals(header)) {</tspan>
      <tspan x="30" y="120" fill="#E2E8F0">  scopes.</tspan><tspan fill="#22D3EE">setWildcard</tspan><tspan fill="#E2E8F0">();  </tspan><tspan fill="#6EE7B7">// TENANT Scope</tspan>
      <tspan x="20" y="136" fill="#E2E8F0">} </tspan><tspan fill="#A5F3FC">else</tspan><tspan fill="#E2E8F0"> {</tspan>
      <tspan x="30" y="152" fill="#E2E8F0">  scopes.</tspan><tspan fill="#22D3EE">setScopeIds</tspan><tspan fill="#E2E8F0">(parseUuids(header));</tspan>
      <tspan x="20" y="162" fill="#E2E8F0">}</tspan>
    </text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="255" y1="265" x2="255" y2="295" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="285" fill="#6B7280" font-size="10">speichert in</text>

  <!-- Component 2: AllowedScopes Bean -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="450" height="150" rx="8" fill="url(#beanGradient)" />
    <text x="15" y="25" fill="white" font-size="14" font-weight="600">2. AllowedScopes</text>
    <text x="15" y="42" fill="#99F6E4" font-size="10">@RequestScope Bean • Hält geparste Scope-Daten</text>

    <!-- Code block -->
    <rect x="10" y="55" width="430" height="85" rx="4" fill="url(#codeGradient)" />
    <text font-family="'SF Mono', 'Consolas', monospace" font-size="10">
      <tspan x="20" y="72" fill="#5EEAD4">@Component</tspan><tspan fill="#E2E8F0"> </tspan><tspan fill="#5EEAD4">@RequestScope</tspan>
      <tspan x="20" y="88" fill="#A5F3FC">public class</tspan><tspan fill="#22D3EE"> AllowedScopes</tspan><tspan fill="#E2E8F0"> {</tspan>
      <tspan x="30" y="104" fill="#A5F3FC">  boolean</tspan><tspan fill="#E2E8F0"> active, wildcard;</tspan>
      <tspan x="30" y="120" fill="#67E8F9">  Set</tspan><tspan fill="#E2E8F0">&lt;</tspan><tspan fill="#67E8F9">UUID</tspan><tspan fill="#E2E8F0">&gt; scopeIds;</tspan>
      <tspan x="20" y="132" fill="#E2E8F0">}</tspan>
    </text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="255" y1="455" x2="255" y2="485" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="265" y="475" fill="#6B7280" font-size="10">injiziert in</text>

  <!-- Component 3: Service (preProcessQuery) -->
  <g transform="translate(30, 495)">
    <rect x="0" y="0" width="450" height="180" rx="8" fill="url(#serviceGradient)" />
    <text x="15" y="25" fill="white" font-size="14" font-weight="600">3. DataSetService.preProcessQuery()</text>
    <text x="15" y="42" fill="#CCFBF1" font-size="10">Service Hook • Kombiniert Benutzer-Spec + Scope-Filter</text>

    <!-- Code block -->
    <rect x="10" y="55" width="430" height="115" rx="4" fill="url(#codeGradient)" />
    <text font-family="'SF Mono', 'Consolas', monospace" font-size="10">
      <tspan x="20" y="72" fill="#5EEAD4">@Override</tspan>
      <tspan x="20" y="88" fill="#67E8F9">Specification</tspan><tspan fill="#E2E8F0">&lt;DataSet&gt; </tspan><tspan fill="#22D3EE">preProcessQuery</tspan><tspan fill="#E2E8F0">(...) {</tspan>
      <tspan x="30" y="104" fill="#A5F3FC">  if</tspan><tspan fill="#E2E8F0"> (!scopes.isActive() || scopes.isWildcard())</tspan>
      <tspan x="40" y="120" fill="#A5F3FC">    return</tspan><tspan fill="#E2E8F0"> spec;  </tspan><tspan fill="#6EE7B7">// Keine Filterung</tspan>
      <tspan x="30" y="136" fill="#67E8F9">  Specification</tspan><tspan fill="#E2E8F0"> scopeFilter = </tspan>
      <tspan x="40" y="152" fill="#22D3EE">    ScopeFilteringSpecification</tspan><tspan fill="#E2E8F0">.dataSetInDataSpaces(ids);</tspan>
      <tspan x="30" y="164" fill="#A5F3FC">  return</tspan><tspan fill="#E2E8F0"> spec.</tspan><tspan fill="#22D3EE">and</tspan><tspan fill="#E2E8F0">(scopeFilter);</tspan>
      <tspan x="20" y="172" fill="#E2E8F0">}</tspan>
    </text>
  </g>

  <!-- Component 4: ScopeFilteringSpecification (right side) -->
  <g transform="translate(520, 85)">
    <rect x="0" y="0" width="450" height="200" rx="8" fill="url(#specGradient)" />
    <text x="15" y="25" fill="white" font-size="14" font-weight="600">4. ScopeFilteringSpecification</text>
    <text x="15" y="42" fill="#CFFAFE" font-size="10">JPA Spec Factory • Generiert WHERE-Klauseln</text>

    <!-- Code block -->
    <rect x="10" y="55" width="430" height="135" rx="4" fill="url(#codeGradient)" />
    <text font-family="'SF Mono', 'Consolas', monospace" font-size="10">
      <tspan x="20" y="72" fill="#A5F3FC">public static</tspan><tspan fill="#67E8F9"> Specification</tspan><tspan fill="#E2E8F0">&lt;DataSet&gt;</tspan>
      <tspan x="30" y="88" fill="#22D3EE">  dataSetInDataSpaces</tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#67E8F9">Set</tspan><tspan fill="#E2E8F0">&lt;</tspan><tspan fill="#67E8F9">UUID</tspan><tspan fill="#E2E8F0">&gt; allowedIds) {</tspan>
      <tspan x="30" y="104" fill="#A5F3FC">  return</tspan><tspan fill="#E2E8F0"> (root, query, cb) -&gt; {</tspan>
      <tspan x="40" y="120" fill="#A5F3FC">    if</tspan><tspan fill="#E2E8F0"> (allowedIds.isEmpty())</tspan>
      <tspan x="50" y="136" fill="#A5F3FC">      return</tspan><tspan fill="#E2E8F0"> cb.</tspan><tspan fill="#22D3EE">disjunction</tspan><tspan fill="#E2E8F0">();  </tspan><tspan fill="#6EE7B7">// = FALSE</tspan>
      <tspan x="40" y="152" fill="#A5F3FC">    var</tspan><tspan fill="#E2E8F0"> join = root.join(</tspan><tspan fill="#5EEAD4">"dataSpaces"</tspan><tspan fill="#E2E8F0">);</tspan>
      <tspan x="40" y="168" fill="#A5F3FC">    return</tspan><tspan fill="#E2E8F0"> join.get(</tspan><tspan fill="#5EEAD4">"id"</tspan><tspan fill="#E2E8F0">).in(allowedIds);</tspan>
      <tspan x="30" y="180" fill="#E2E8F0">  };</tspan>
      <tspan x="20" y="188" fill="#E2E8F0">}</tspan>
    </text>
  </g>

  <!-- Arrow from service to spec -->
  <path d="M 480 585 L 520 585 L 520 285 L 520 285" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="530" y="435" fill="#6B7280" font-size="10" transform="rotate(-90, 530, 435)">ruft Factory-Methode auf</text>

  <!-- Generated SQL Box -->
  <g transform="translate(520, 305)">
    <rect x="0" y="0" width="450" height="120" rx="8" fill="#134E4A" stroke="#0D9488" stroke-width="2" />
    <text x="15" y="25" fill="#99F6E4" font-size="12" font-weight="500">Generiertes SQL (konzeptionell)</text>

    <rect x="10" y="40" width="430" height="70" rx="4" fill="#0F3531" />
    <text font-family="'SF Mono', 'Consolas', monospace" font-size="10">
      <tspan x="20" y="58" fill="#A5F3FC">SELECT DISTINCT</tspan><tspan fill="#E2E8F0"> d.* </tspan><tspan fill="#A5F3FC">FROM</tspan><tspan fill="#E2E8F0"> datasets d</tspan>
      <tspan x="20" y="74" fill="#A5F3FC">INNER JOIN</tspan><tspan fill="#E2E8F0"> dataset_dataspaces dd</tspan>
      <tspan x="30" y="90" fill="#A5F3FC">ON</tspan><tspan fill="#E2E8F0"> d.id = dd.dataset_id</tspan>
      <tspan x="20" y="106" fill="#A5F3FC">WHERE</tspan><tspan fill="#E2E8F0"> dd.dataspace_id </tspan><tspan fill="#A5F3FC">IN</tspan><tspan fill="#E2E8F0"> (</tspan><tspan fill="#5EEAD4">'uuid1'</tspan><tspan fill="#E2E8F0">,</tspan><tspan fill="#5EEAD4">'uuid2'</tspan><tspan fill="#E2E8F0">)</tspan>
    </text>
  </g>

  <!-- State diagram -->
  <g transform="translate(520, 445)">
    <rect x="0" y="0" width="450" height="140" rx="8" fill="white" stroke="#99F6E4" stroke-width="2" />
    <text x="15" y="25" fill="#134E4A" font-size="13" font-weight="600">AllowedScopes Zustandsautomat</text>

    <!-- States -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="90" height="35" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1" />
      <text x="45" y="15" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="500">active=false</text>
      <text x="45" y="28" text-anchor="middle" fill="#991B1B" font-size="9">Kein Header</text>
    </g>

    <g transform="translate(130, 45)">
      <rect x="0" y="0" width="90" height="35" rx="4" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1" />
      <text x="45" y="15" text-anchor="middle" fill="#134E4A" font-size="10" font-weight="500">wildcard=true</text>
      <text x="45" y="28" text-anchor="middle" fill="#134E4A" font-size="9">TENANT Scope</text>
    </g>

    <g transform="translate(240, 45)">
      <rect x="0" y="0" width="90" height="35" rx="4" fill="#CFFAFE" stroke="#0891B2" stroke-width="1" />
      <text x="45" y="15" text-anchor="middle" fill="#164E63" font-size="10" font-weight="500">scopeIds=[...]</text>
      <text x="45" y="28" text-anchor="middle" fill="#164E63" font-size="9">Filter nach IDs</text>
    </g>

    <g transform="translate(350, 45)">
      <rect x="0" y="0" width="80" height="35" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
      <text x="40" y="15" text-anchor="middle" fill="#92400E" font-size="10" font-weight="500">scopeIds=[]</text>
      <text x="40" y="28" text-anchor="middle" fill="#92400E" font-size="9">Leeres Ergebnis</text>
    </g>

    <!-- Result arrows -->
    <text x="65" y="105" text-anchor="middle" fill="#6B7280" font-size="9">↓</text>
    <text x="65" y="120" text-anchor="middle" fill="#6B7280" font-size="9">Kein Filter</text>

    <text x="175" y="105" text-anchor="middle" fill="#6B7280" font-size="9">↓</text>
    <text x="175" y="120" text-anchor="middle" fill="#6B7280" font-size="9">Kein Filter</text>

    <text x="285" y="105" text-anchor="middle" fill="#6B7280" font-size="9">↓</text>
    <text x="285" y="120" text-anchor="middle" fill="#6B7280" font-size="9">IN-Klausel</text>

    <text x="390" y="105" text-anchor="middle" fill="#6B7280" font-size="9">↓</text>
    <text x="390" y="120" text-anchor="middle" fill="#6B7280" font-size="9">WHERE FALSE</text>
  </g>

  <!-- Key insight box -->
  <g transform="translate(520, 605)">
    <rect x="0" y="0" width="450" height="70" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2" />
    <text x="20" y="25" fill="#134E4A" font-size="12" font-weight="600">Kernprinzip</text>
    <text x="20" y="45" fill="#0F766E" font-size="11">Backend wendet Filter mechanisch an. Keine Authz-Entscheidungen.</text>
    <text x="20" y="60" fill="#0F766E" font-size="11">OPA ist der einzige Policy Decision Point (PDP).</text>
  </g>

  <!-- Request flow summary -->
  <g transform="translate(30, 700)">
    <rect x="0" y="0" width="940" height="60" rx="8" fill="#134E4A" />
    <text x="20" y="22" fill="#99F6E4" font-size="11" font-weight="500">Request-Flow:</text>
    <text x="20" y="42" fill="#E2E8F0" font-size="10">HTTP Request → AllowedScopesFilter (Header parsen) → Controller → Service.preProcessQuery() → ScopeFilteringSpecification → JPA/SQL → Gefilterte Daten</text>
  </g>

  <!-- Footer -->
  <text x="500" y="800" text-anchor="middle" fill="#6B7280" font-size="10">Erstellt mit Claude Code • M5.5 Java-Implementierung • 2026-02-05</text>
</svg>
