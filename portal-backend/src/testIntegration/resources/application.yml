logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: WARN

server:
  servlet:
    context-path: /v2

spring:
  profiles:
    active: test-integration
  application:
    name: iot-schema-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak's JWK Set URI for token validation
          jwk-set-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid_connect/certs
          issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}


  jpa:
    properties:
      hibernate.format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true