# Local development seed data — loaded automatically when the "local-init" Spring profile is active.
# Requires the local Profile for the kafka topics sync to the config-adapter
# On startup, these groups and users are created in the DB (if they don't exist yet)
# The dev@civitas.local user is also pre-seeded in Keycloak via dev-environment/keycloak/realm-export.json
# Don't use in production

local:
  init:
    groups:
      - name: "Local Admins"
        roleName: "Tenant Admin"
        description: "Local development admin group"
    users:
      - firstName: Developer
        lastName: User
        email: dev@civitas.local
        externalId: "U0000000-0000-0000-0000-000000000001"
        title: OTHER
        groups:
          - "Local Admins"
