logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: INFO

app:
  url: http://localhost:8089

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  # Kafka local deployment settings
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      bootstrap-servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092

keycloak:
  realm: "civitas-core"
  auth-server-url: http://localhost:8080
  issuer-uri: http://localhost:8080
  target-realm: "civitas-core"

kafka:
  enabled: true
  bootstrap-servers: localhost:9092
  acks: all
  retries: 3
  async-publish: true  # true = async (callback), false = sync (blocking)

# Local seed data — only active with the "local" Spring profile.
# On startup, these groups and users are created in the DB (if they don't exist yet)
# and synced to Keycloak via the config adapter.
local:
  init:
    groups:
      - name: "Local Admins"
        roleName: "Tenant Admin"
        description: "Local development admin group"
    users:
      - firstName: Jonas
        lastName: Muster456mann
        email: jonas.fritz@frachtwerk.de
        title: OTHER
        groups:
          - "Local Admins"
