logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: INFO

app:
  url: http://localhost:8089

civitas:
  master-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

server:
  error:
    include-message: always
    include-exception: true
    include-stacktrace: on_param

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portal_backend?sslmode=disable&gssEncMode=disable
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  # Kafka local deployment settings
  kafka:
    bootstrap-servers: localhost:9092

keycloak:
  realm: "civitas-core"
  auth-server-url: http://localhost:8080
  issuer-uri: http://localhost:8080
  target-realm: "civitas-core"

kafka:
  enabled: true
  bootstrap-servers: localhost:9092
  acks: all
  retries: 3

# Security: add Swagger/API docs paths for local development
security:
  permit-paths:
    - /api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /swagger-resources/**
    - /webjars/**
    - /actuator/health/**
    - /actuator/info

model-atlas:
  baseUrl: "http://localhost:8086"
  scope: civitas
  stage: draft
