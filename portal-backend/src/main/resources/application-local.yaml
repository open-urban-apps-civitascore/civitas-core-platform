logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: INFO

app:
  url: http://localhost:8089
  encryption:
    key: ${CIVITAS_MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    salt: ${CIVITAS_MASTER_SALT:00112233445566778899aabbccddeeff}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  # Kafka local deployment settings
  kafka:
    bootstrap-servers: localhost:9092

keycloak:
  realm: "civitas-core"
  auth-server-url: http://localhost:8080
  issuer-uri: http://localhost:8080
  target-realm: "civitas-core"

kafka:
  enabled: true
  bootstrap-servers: localhost:9092
  acks: all
  retries: 3
