logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.flywaydb: INFO

app:
  url: http://localhost:8089

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  # Kafka local deployment settings
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      bootstrap-servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092

# Backend running on HOST, Keycloak in Docker with port mapping.
# Uses civitas-keycloak hostname so the JWT issuer claim matches across
# all services (APISIX, OPA, frontend). Requires /etc/hosts entry:
#   127.0.0.1 civitas-keycloak
keycloak:
  realm: "civitas-core"
  auth-server-url: http://civitas-keycloak:8080
  issuer-uri: http://civitas-keycloak:8080
  target-realm: "civitas-core"

kafka:
  enabled: true
  bootstrap-servers: localhost:9092
  acks: all
  retries: 3
  async-publish: true  # true = async (callback), false = sync (blocking)
