variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  key: ${CI_COMMIT_REF_SLUG}-mvn
  paths:
    - $CI_PROJECT_DIR/.m2/repository

stages:
  - validate
  - test
  - build

# Code formatting validation
spotless-check:
  stage: validate
  image: maven:3-eclipse-temurin-21
  script:
    - mvn ${MAVEN_CLI_OPTS} spotless:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Compile and prepare for tests
compile:
  stage: validate
  image: maven:3-eclipse-temurin-21
  script:
    - mvn ${MAVEN_CLI_OPTS} clean compile test-compile
  artifacts:
    paths:
      - target/
      - .m2/repository/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}-mvn
    paths:
      - $CI_PROJECT_DIR/.m2/repository
    policy: push

# Unit tests
unit-tests:
  stage: test
  image: maven:3-eclipse-temurin-21
  needs:
    - compile
  dependencies:
    - compile
  script:
    - mvn ${MAVEN_CLI_OPTS} jacoco:prepare-agent surefire:test jacoco:report
  artifacts:
    name: "unit-test-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    expire_in: 1 day
  coverage: '/Total.*?([0-9]{1,3})%/'

# Integration tests
integration-tests:
  stage: test
  image: maven:3-eclipse-temurin-21
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - compile
  dependencies:
    - compile
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
  script:
    - mvn ${MAVEN_CLI_OPTS} jacoco:prepare-agent-integration failsafe:integration-test failsafe:verify jacoco:report-integration
  artifacts:
    name: "integration-test-reports-$CI_COMMIT_SHORT_SHA"
    when: always
    reports:
      junit: target/failsafe-reports/TEST-*.xml
    paths:
      - target/failsafe-reports/
      - target/site/jacoco-it/
    expire_in: 1 day
  timeout: 15 minutes

# Merge test coverage reports
merge-coverage:
  stage: test
  image: maven:3-eclipse-temurin-21
  needs:
    - unit-tests
    - integration-tests
  dependencies:
    - unit-tests
    - integration-tests
  script:
    - mvn ${MAVEN_CLI_OPTS} jacoco:merge jacoco:report
  artifacts:
    name: "merged-coverage-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/site/jacoco/
    expire_in: 1 day

# Build application
build:
  stage: build
  image: maven:3-eclipse-temurin-21
  needs:
    - compile
    - unit-tests
    - integration-tests
  dependencies:
    - compile
  script:
    - mvn ${MAVEN_CLI_OPTS} package -DskipTests
  artifacts:
    name: "build-artifacts-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/*.jar
      - target/classes/
    expire_in: 1 day

# Security scanning
# Quality gate