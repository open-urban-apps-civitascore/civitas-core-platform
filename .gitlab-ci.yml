# Gitlab pipeline for portal frontend & backend.
# Integrates custom jobs (blow) and Gitlab templates.
# Publishes results in Gitlab that are shown inside Merge Requests

# Local testing:
# gitlab-ci-local <jobName>

# Change to retrigger all pipeline for a new commit

include:
  - .gitlab/ci/frontend.yml
  - .gitlab/ci/backend.yml
  - .gitlab/ci/config-adapter.yml
  - .gitlab/ci/portal-model.yml
  - .gitlab/ci/renovate.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: qa
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Setup job to determine version from git for all jobs
setup-version:
  image: alpine:latest
  stage: .pre
  variables:
    GIT_DEPTH: 0 # Full clone required for git describe to find tags in history
  before_script:
    - apk add --no-cache git
  script:
    - REVISION=$(git describe --tags --always)
    - echo "REVISION=$REVISION" > version.env
    - echo "Setting REVISION=$REVISION"
  artifacts:
    reports:
      # Pass to other jobs
      # https://docs.gitlab.com/ci/yaml/artifacts_reports/#artifactsreportsdotenv
      dotenv: version.env

workflow:
  rules:
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on merge request branches
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on tag events
    - if: $CI_COMMIT_TAG

stages: [
    lint, # Lints all code
    qa, # License scanning, SAST, Secret detection for all code
    test-package, # Test only config adapter
    build-package, # Build config adapter and portal-model
    deploy-package, # Deploy config adapter and portal-model (which is required for backend test/build)
    test, # Test backend & frontend
    build, # Build backend & frontend
    container-qa, # Container scanning for built images
    deploy, # Deploy built images
    report, # Generate reports (SBOM etc)
  ]

variables:
  GITLAB_ADVANCED_SAST_ENABLED: 'true'
  AST_ENABLE_MR_PIPELINES: 'true' # Enable secret detection in MR pipelines
  SAST_EXCLUDED_ANALYZERS: 'semgrep' # Disable fall bock sast scanner (only use advanced sast)
  DS_ENFORCE_NEW_ANALYZER: 'true'
  DS_MAX_DEPTH: 3

# ============================================
# Security & QA Jobs
# Required for all changes
# ============================================

secret_detection:
  stage: qa
  needs: []

gitlab-advanced-sast:
  stage: qa
  needs: []
