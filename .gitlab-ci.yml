include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    # Run on push to main branch
    - if: $CI_COMMIT_BRANCH == "main"
    # Run on merge request branches
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on tag events
    - if: $CI_COMMIT_TAG

stages: [lint, test, qa, build, deploy]

variables:
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  DS_ENFORCE_NEW_ANALYZER: "true"

eslint-frontend:
  image: node:22
  stage: lint
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - echo "[]" > eslint-report.json

    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile

    - |
      pnpm eslint . \
        --max-warnings=0 \
        --format gitlab | tee eslint-report.json
  artifacts:
    when: always
    paths: [portal-frontend/eslint-report.json]
    expire_in: 1 month
    reports:
      codequality: portal-frontend/eslint-report.json

test-frontend:
  image: node:22
  stage: test
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - mkdir -p reports/junit coverage

    # TODO: Remove file at the end as soon all tests are working!!!
    - |
      pnpm vitest --run --coverage \
        --reporter=default --reporter=junit \
        --outputFile=reports/junit/junit.xml \
        --coverage.reporter=cobertura --coverage.reporter=lcov \
        --coverage.dir=coverage \
        src/lib/utils.test.ts
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/reports/junit/
      - portal-frontend/coverage/
    reports:
      junit: portal-frontend/reports/junit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: portal-frontend/coverage/cobertura-coverage.xml

build-frontend:
  image: node:22
  stage: build
  needs:
    [
      "eslint-frontend",
      "test-frontend",
      "secret_detection",
      "gitlab-advanced-sast",
      "dependency-scanning",
    ]
  variables:
    NODE_ENV: production
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    when: on_success
    paths:
      - portal-frontend/.next/
    expire_in: 1 month

deploy-frontend:
  image: docker:27-dind
  stage: deploy
  needs: ["build-frontend"]
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-frontend
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag registry.gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/frontend-portal:$IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true
