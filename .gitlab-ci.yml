stages: [lint, test, build, cd]

eslint-frontend:
  image: node:20
  stage: lint
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - echo "[]" > eslint-report.json

    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile

    - |
      pnpm eslint . \
        --max-warnings=0 \
        --format gitlab | tee eslint-report.json
  artifacts:
    when: always
    paths: [portal-frontend/eslint-report.json]
    expire_in: 1 month
    reports:
      codequality: portal-frontend/eslint-report.json

gitleaks-frontend:
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  stage: lint
  script:
    - cd portal-frontend
    - set -euo pipefail
    - echo "{}" > gitleaks.sarif

    - |
      gitleaks detect --source . --redact --no-banner \
        --report-format sarif -v

  artifacts:
    when: always
    paths: [portal-frontend/gitleaks.sarif]
    expire_in: 1 month
    reports:
      sast: portal-frontend/gitleaks.sarif

test-frontend:
  image: node:20
  stage: test
  needs: ["eslint-frontend", "gitleaks-frontend"]
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - mkdir -p reports/junit coverage
    - |
      pnpm vitest --run --coverage \
        --reporter=default --reporter=junit \
        --outputFile=reports/junit/junit.xml \
        --coverage.reporter=cobertura --coverage.reporter=lcov \
        --coverage.dir=coverage \
        src/lib/utils.test.ts
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/reports/junit/
      - portal-frontend/coverage/
    reports:
      junit: portal-frontend/reports/junit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: portal-frontend/coverage/cobertura-coverage.xml

build-frontend:
  image: node:20
  stage: build
  needs: ["test-frontend"]
  variables:
    NODE_ENV: production
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    when: on_success
    paths:
      - portal-frontend/.next/
    expire_in: 1 month
