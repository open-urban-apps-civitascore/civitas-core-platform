packages:
  - .

# next@15.5.25 hard-pins postcss@8.4.31 (exact, no range) even in its latest
# 15.x patch, which carries CVE-2026-45623 and CVE-2026-73646 (fixed in
# 8.5.18). Override until Next.js bumps its own pin upstream.
overrides:
  next>postcss: '>=8.5.18'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
