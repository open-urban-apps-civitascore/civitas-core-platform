# Hidden job that defines rules for config-adapter changes
# All config-adapter jobs should extend this
.only-config-adapter-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main branch
    - if: $CI_COMMIT_BRANCH == "main"
    # Run on MR only when backend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/config-adapter.yml

lint-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn spotless:check

test-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21
  stage: test
  needs: []
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS clean test
    # Aggregate coverage from all modules
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/*/target/surefire-reports/
      - config-adapter/*/target/site/jacoco/
    reports:
      junit: config-adapter/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: config-adapter/*/target/site/jacoco/jacoco.xml

build-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build
  needs: ['lint-config-adapter', 'test-config-adapter', 'secret_detection', 'gitlab-advanced-sast', 'dependency-scanning']
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn package -DskipTests
  artifacts:
    when: on_success
    paths:
      - config-adapter/config-adapter-application/target/*.jar
    expire_in: 1 month

build-config-adapter-image:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: build
  needs: ['build-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-config-adapter:
  extends: .only-config-adapter-changes
  image:
    name: registry.gitlab.com/gitlab-org/security-products/analyzers/container-scanning:6
    entrypoint: [""]
  stage: container-qa
  needs: ['build-config-adapter-image']
  variables:
    CS_REGISTRY_USER: $CI_REGISTRY_USER
    CS_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - export IMAGE_TAG=$(git describe --tags --always)
    - export CS_IMAGE=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
    - /analyzer run
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-config-adapter:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: deploy
  needs: ['container-scan-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export IMAGE_TAG=$(git describe --tags --always)
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/config-adapter:$IMAGE_TAG
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
