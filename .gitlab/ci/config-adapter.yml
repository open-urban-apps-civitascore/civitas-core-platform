# Hidden job that defines rules for config-adapter changes
# All config-adapter jobs should extend this
.only-config-adapter-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when backend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/config-adapter.yml

lint-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn spotless:check

dependency-prune-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS -B dependency:analyze -DfailOnWarning=true -DignoreNonCompile=false
  allow_failure:
    exit_codes:
      - 1

test-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21
  stage: test
  needs: []
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS clean test
    # Aggregate coverage from all modules
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/*/target/surefire-reports/
      - config-adapter/*/target/site/jacoco/
    reports:
      junit: config-adapter/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: config-adapter/*/target/site/jacoco/jacoco.xml

sbom-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: qa
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS -B cyclonedx:makeAggregateBom -DskipTests
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/target/config-adapter.cdx.json
    reports:
      cyclonedx: config-adapter/target/config-adapter.cdx.json

build-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build
  needs:
    - job: 'lint-config-adapter'
    - job: 'dependency-prune-config-adapter'
    - job: 'test-config-adapter'
    - job: 'secret_detection'
      optional: true
    - job: 'gitlab-advanced-sast'
      optional: true
    # - job: 'dependency-scanning'
    #   optional: true
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn package -DskipTests
  artifacts:
    when: on_success
    paths:
      - config-adapter/config-adapter-application/target/*.jar
    expire_in: 1 month

# Publish config-adapter artifacts to GitLab Maven repository
# This makes the artifacts available to portal-backend and other projects
# Runs in QA stage so backend tests can use the published artifacts
publish-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: qa
  needs: ['lint-config-adapter', 'test-config-adapter']
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    # Deploy to GitLab Maven repository
    - |
      mvn deploy -DskipTests \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml

build-config-adapter-image:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: build
  needs: ['build-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-config-adapter:
  extends: .only-config-adapter-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs: ['build-config-adapter-image']
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export IMAGE_TAG=$(git describe --tags --always)
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-config-adapter:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: deploy
  needs: ['container-scan-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export IMAGE_TAG=$(git describe --tags --always)
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${IMAGE_TAG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/config-adapter:$IMAGE_TAG
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true

sbom-config-adapter-image:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: report
  needs: ['deploy-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - mkdir -p target
    - export IMAGE_TAG=$(git describe --tags --always)
    - syft registry:$CI_REGISTRY_IMAGE/config-adapter:$IMAGE_TAG -o cyclonedx-json > target/config-adapter-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/target/config-adapter-image.cdx.json
    reports:
      cyclonedx: config-adapter/target/config-adapter-image.cdx.json
