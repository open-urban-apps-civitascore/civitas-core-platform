# Hidden job that defines rules for config-adapter changes
# All config-adapter jobs should extend this
.only-config-adapter-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when config-adapter files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/config-adapter.yml

# Setup version for config-adapter from pom.xml with branch-based suffixes
# - main/tags: release version (e.g., 1.0.2)
# - develop: snapshot version (e.g., 1.0.2-SNAPSHOT)
# - MR: merge request version (e.g., 1.0.2-MR-123)
setup-version-config-adapter:
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: .pre
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    # Extract base version from pom.xml
    - BASE_VERSION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout)
    - echo "Base version from pom.xml - $BASE_VERSION"
    # Apply branch-based suffix
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ -n "$CI_COMMIT_TAG" ]; then
        CONFIG_ADAPTER_VERSION="$BASE_VERSION"
      elif [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        CONFIG_ADAPTER_VERSION="${BASE_VERSION}-SNAPSHOT"
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CONFIG_ADAPTER_VERSION="${BASE_VERSION}-MR-${CI_MERGE_REQUEST_IID}"
      else
        CONFIG_ADAPTER_VERSION="${BASE_VERSION}-${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "CONFIG_ADAPTER_VERSION=$CONFIG_ADAPTER_VERSION" > ../config-adapter-version.env
    - echo "Setting CONFIG_ADAPTER_VERSION=$CONFIG_ADAPTER_VERSION"
  artifacts:
    reports:
      dotenv: config-adapter-version.env

# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-config-adapter:
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs:
    - job: setup-version-config-adapter
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Always run on MR pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    # Only generate dependency tree, no compilation needed
    - mvn -B dependency:tree -Drevision=$CONFIG_ADAPTER_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - config-adapter/maven.graph.json

lint-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs:
    - job: setup-version-config-adapter
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn spotless:check -Drevision=$CONFIG_ADAPTER_VERSION

dependency-prune-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs:
    - job: setup-version-config-adapter
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS -B dependency:analyze -Drevision=$CONFIG_ADAPTER_VERSION -DfailOnWarning=true -DignoreNonCompile=false
  allow_failure:
    exit_codes:
      - 1

test-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21
  stage: build-package
  needs:
    - job: setup-version-config-adapter
    - job: build-config-adapter
      artifacts: true
  services:
    - name: docker:27-dind
      alias: docker
      command: ['--registry-mirror', 'https://docker-mirror01.extern.frachtwerk.de']
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS jacoco:prepare-agent surefire:test jacoco:report -Drevision=$CONFIG_ADAPTER_VERSION
    # Aggregate coverage from all modules
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/*/target/surefire-reports/
      - config-adapter/*/target/site/jacoco/
    reports:
      junit: config-adapter/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: config-adapter/*/target/site/jacoco/jacoco.xml

build-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build-package
  needs:
    - job: setup-version-config-adapter
    - job: lint-config-adapter
    - job: dependency-prune-config-adapter
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn package -DskipTests -Drevision=$CONFIG_ADAPTER_VERSION
  artifacts:
    when: on_success
    paths:
      - config-adapter/*/target/
    expire_in: 1 month

# Publish config-adapter artifacts to GitLab Maven repository
# This makes the artifacts available to portal-backend and other projects
# Runs in QA stage so backend tests can use the published artifacts
publish-config-adapter:
  extends: .only-config-adapter-changes # overridden by rules: below, kept for documentation
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: deploy-package
  rules:
    # Same conditions as .only-config-adapter-changes, but with per-rule needs:
    # Tags/main/develop: publish only after tests pass
    - if: $CI_COMMIT_TAG
      needs:
        - job: setup-version-config-adapter
        - job: build-config-adapter
          optional: true
        - job: test-config-adapter
    - if: $CI_COMMIT_BRANCH == "main"
      needs:
        - job: setup-version-config-adapter
        - job: build-config-adapter
          optional: true
        - job: test-config-adapter
    - if: $CI_COMMIT_BRANCH == "develop"
      needs:
        - job: setup-version-config-adapter
        - job: build-config-adapter
          optional: true
        - job: test-config-adapter
    # MR: publish immediately after build (test runs in parallel)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/config-adapter.yml
      needs:
        - job: setup-version-config-adapter
        - job: build-config-adapter
          optional: true
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    # Deploy to GitLab Maven repository
    # Version suffix (SNAPSHOT, MR-xxx) is already applied by setup-version-config-adapter
    - |
      mvn deploy -DskipTests -Drevision=$CONFIG_ADAPTER_VERSION \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml

build-config-adapter-image:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: publish
  needs:
    - job: setup-version-config-adapter
    - job: publish-config-adapter
    - job: build-config-adapter
    - job: test-config-adapter
  services:
    - name: docker:27-dind
      command: ['--registry-mirror', 'https://docker-mirror01.extern.frachtwerk.de']
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - |
      cat > /tmp/buildkitd.toml <<'EOF'
      [registry."docker.io"]
        mirrors = ["docker-mirror01.extern.frachtwerk.de"]
      EOF
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch --config /tmp/buildkitd.toml buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${CI_COMMIT_REF_SLUG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-config-adapter:
  extends: .only-config-adapter-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: setup-version-config-adapter
    - job: build-config-adapter-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${CI_COMMIT_REF_SLUG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-config-adapter:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: deploy
  needs:
    - job: setup-version-config-adapter
    - job: container-scan-config-adapter
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${CI_COMMIT_REF_SLUG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/config-adapter:$CONFIG_ADAPTER_VERSION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "staging" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker buildx imagetools create $CI_REGISTRY_IMAGE/config-adapter:$CONFIG_ADAPTER_VERSION --tag $CI_REGISTRY_IMAGE/config-adapter:$CI_COMMIT_BRANCH
      fi

sbom-config-adapter-image:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: report
  needs:
    - job: setup-version-config-adapter
    - job: deploy-config-adapter
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - mkdir -p target
    - syft registry:$CI_REGISTRY_IMAGE/config-adapter:$CONFIG_ADAPTER_VERSION -o cyclonedx-json > target/config-adapter-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/target/config-adapter-image.cdx.json
    # TODO: https://gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/-/issues/728
    # Fix license name resolution
    # reports:
    #   cyclonedx: config-adapter/target/config-adapter-image.cdx.json
