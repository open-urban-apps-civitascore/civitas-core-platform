# Hidden job that defines rules for config-adapter changes
# All config-adapter jobs should extend this
.only-config-adapter-changes:
  rules:
    - !reference [.rules-protected, rules]
    # Run on MR only when config-adapter files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/config-adapter.yml


# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-config-adapter:
  extends: .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: lint
  needs:
    - job: setup-version
      artifacts: true
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd config-adapter
    # Only generate dependency tree, no compilation needed
    - mvn $MAVEN_CLI_OPTS dependency:tree -Drevision=$CONFIG_ADAPTER_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - config-adapter/maven.graph.json

# Surefire unit tests only. Container-based tests are named *IT.java and run under failsafe, so
# this job requires no Docker.
test-config-adapter:
  extends:
    - .only-config-adapter-changes
    - .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter
      artifacts: true
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS test -Drevision=$CONFIG_ADAPTER_VERSION -T 2
    # Coverage is unit-only: failsafe runs as a bare CLI goal, which does not trigger jacoco's
    # prepare-agent-integration, so there is no integration execution data to merge.
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/*/target/surefire-reports/
      - config-adapter/*/target/site/jacoco/
    reports:
      junit:
        - config-adapter/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: config-adapter/*/target/site/jacoco/jacoco.xml

# Failsafe integration tests (*IT.java), all Testcontainers-backed. Sharded across parallel jobs
# because the suite cannot be parallelised inside one JVM: modules share a static container per JVM,
# and the NiFi containers bind fixed host ports.
#
# Shards are grouped by runtime; rebalance when one shard becomes the longest job. The NiFi IT
# classes start a NiFi each and cannot share one, so they are split by class (times from pipeline
# 2993848429: FrostMapping 216 s, Deployment 35 s, Probe 17 s | Sql, DataFlow | HttpDataFlow 108 s |
# FrostFindOrCreate 201 s, Postgis 106 s). The last NiFi shard runs every IT class the others do not
# name, so a new IT class always runs in one shard.
#
# -pl is used without -am: config-adapter-application depends on every adapter, so -am pulls the
# whole reactor into a shard, and failsafe runs in every reactor module — that shard would re-run the
# full IT suite. build-config-adapter installs the modules so a restricted reactor resolves.
# A job that needs integration-test-config-adapter waits for every shard of the matrix.
# The FROST and HTTP/REST ITs need the NARs from build-nifi-nars; they find them in the sibling build tree.
integration-test-config-adapter:
  extends:
    - .only-config-adapter-changes
    - .dind
    - .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25
  stage: build-package
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter
      artifacts: true
    - job: build-nifi-nars
      artifacts: true
  parallel:
    matrix:
      - MODULES: config-adapter-nifi
        IT_FILTER:
          - 'NifiFrostMappingIT,NifiDeploymentIT,JdbcSqlSourceProbeIT'
          - 'NifiSqlDataFlowIT,NifiDataFlowIT'
          - 'NifiHttpDataFlowIT'
          - '*IT,!NifiFrostMappingIT,!NifiDeploymentIT,!JdbcSqlSourceProbeIT,!NifiSqlDataFlowIT,!NifiDataFlowIT,!NifiHttpDataFlowIT'
      - MODULES: config-adapter-apisix,config-adapter-keycloak
      - MODULES: config-adapter-frost,config-adapter-geoserver,config-adapter-postgis,config-adapter-flowable,event-handler-kafka,config-adapter-application,config-adapter-connection-test
  script:
    - cd config-adapter
    # Explicit goals keep package, spotless and spotbugs out of this job.
    - mvn $MAVEN_CLI_OPTS -pl $MODULES test-compile failsafe:integration-test failsafe:verify -Drevision=$CONFIG_ADAPTER_VERSION ${IT_FILTER:+"-Dit.test=$IT_FILTER"}
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - config-adapter/*/target/failsafe-reports/
    reports:
      junit:
        - config-adapter/*/target/failsafe-reports/TEST-*.xml

# portal-backend compiles against the artifact of this job, so the job runs wherever the backend
# jobs run, and wherever the API test stack runs.
.build-config-adapter-changes:
  rules:
    - !reference [.api-test-stack-changes, rules]
    - !reference [.only-backend-changes, rules]

# Format check is in static-analysis-config-adapter. This job does not wait for it: the build, the
# tests and the analysis run side by side, and publish and the image wait for all of them.
build-config-adapter:
  extends:
    - .build-config-adapter-changes
    - .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  cache:
    # pull-push: this job installs into the local repo, so it is the one that has to write the
    # cache back. The read-only jobs pull, or each would re-upload the whole repository under the
    # shared key.
    policy: pull-push
  before_script:
    # Keeps the cache from carrying every version ever built; the modules are reinstalled below
    - rm -rf $CI_PROJECT_DIR/.m2/repository/de/civitas-core
  script:
    - cd config-adapter
    # The artifacts must land in the local repo, because the integration shards resolve inter-module
    # dependencies from it with a restricted reactor. install:install is invoked as a goal so the
    # verify-phase checks (pmd, spotbugs, spotless) stay out of this job.
    - mvn $MAVEN_CLI_OPTS package install:install -DskipTests -Drevision=$CONFIG_ADAPTER_VERSION -Pdist
    # Unused or undeclared dependencies fail the job (this was the job dependency-prune-config-adapter)
    # (without -Pdist, as that job ran it)
    - mvn $MAVEN_CLI_OPTS dependency:analyze -Drevision=$CONFIG_ADAPTER_VERSION -DfailOnWarning=true -DignoreNonCompile=false
  artifacts:
    when: on_success
    paths:
      - config-adapter/*/target/classes/
      - config-adapter/*/target/test-classes/
      - config-adapter/*/target/*.jar
      # The integration shards resolve inter-module dependencies from here. The cache this job
      # restores is keyed on config-adapter/pom.xml alone, so it carries every version any MR has
      # ever installed; only the version built here is needed downstream.
      - .m2/repository/de/civitas-core/*/$CONFIG_ADAPTER_VERSION/
    exclude:
      # Already uploaded from config-adapter-application/target/, and the shade plugin makes it the
      # largest single file in the archive.
      - .m2/repository/de/civitas-core/config-adapter-application/*/*.jar
    expire_in: 1 month

# Spotless, PMD, CPD and SpotBugs are bound to verify. They run here, beside the tests, and not inside
# the mvn deploy of publish-config-adapter. (The format check was the job lint-config-adapter.)
static-analysis-config-adapter:
  extends:
    - .only-config-adapter-changes
    - .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter
      artifacts: true
  script:
    - cd config-adapter
    - mvn $MAVEN_CLI_OPTS verify -DskipTests -DskipITs -Drevision=$CONFIG_ADAPTER_VERSION -Djacoco.skip=true

# Publish config-adapter artifacts to the GitLab Maven repository. This is the release gate: only a
# commit on a protected branch whose tests and static analysis passed is published. Merge requests
# do not publish; portal-backend uses the artifact of build-config-adapter there, in every pipeline.
publish-config-adapter:
  extends:
    - .rules-protected
    - .maven-config-adapter
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: deploy-package
  interruptible: false
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter
      artifacts: false
    - job: test-config-adapter
      artifacts: false
    - job: integration-test-config-adapter
      artifacts: false
    - job: static-analysis-config-adapter
      artifacts: false
  script:
    - cd config-adapter
    # Version suffix (SNAPSHOT) is already applied by setup-version
    - |
      mvn $MAVEN_CLI_OPTS deploy -DskipTests -DskipITs -Drevision=$CONFIG_ADAPTER_VERSION \
        -Dspotless.check.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotbugs.skip=true -Djacoco.skip=true \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml

build-config-adapter-image:
  extends:
    - .only-config-adapter-changes
    - .docker-build
  stage: publish
  interruptible: false
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter
    - job: test-config-adapter
    - job: integration-test-config-adapter
      artifacts: false
    - job: static-analysis-config-adapter
  script:
    - cd config-adapter
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/config-adapter:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        .

container-scan-config-adapter:
  extends:
    - .only-config-adapter-changes
    - .container-scan
  needs:
    - job: setup-version
      artifacts: true
    - job: build-config-adapter-image
  variables:
    IMAGE_NAME: config-adapter
    SBOM_PATH: config-adapter/target/config-adapter-image.cdx.json

deploy-config-adapter:
  extends:
    - .only-config-adapter-changes
    - .deploy-image
  resource_group: deploy-config-adapter-$CI_COMMIT_REF_SLUG
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-config-adapter
    - job: api-test-backend
      optional: true
      artifacts: false
  variables:
    IMAGE_NAME: config-adapter
