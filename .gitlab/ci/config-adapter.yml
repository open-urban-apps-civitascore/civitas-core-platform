# Hidden job that defines rules for config-adapter changes
# All config-adapter jobs should extend this
.only-config-adapter-changes:
  rules:
    - changes:
        - config-adapter/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/config-adapter.yml

lint-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - portal-config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-config-adapter
    - mvn spotless:check

test-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: test
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - portal-config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-config-adapter
    - mvn $MAVEN_CLI_OPTS clean org.jacoco:jacoco-maven-plugin:prepare-agent test jacoco:report
    # To print coverage, picked up by coverage regex
    - cat target/site/jacoco/index.html| grep -o '<tfoot>.*</tfoot>'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-config-adapter/target/surefire-reports/
      - portal-config-adapter/target/site/jacoco/
    reports:
      junit: portal-config-adapter/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: portal-config-adapter/target/site/jacoco/jacoco.xml

build-config-adapter:
  extends: .only-config-adapter-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build
  needs: ['lint-config-adapter', 'test-config-adapter', 'secret_detection', 'gitlab-advanced-sast', 'dependency-scanning']
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: config-adapter-maven
      files:
        - config-adapter/pom.xml
    paths:
      - .m2/repository
  script:
    - cd config-adapter
    - mvn package -DskipTests
  artifacts:
    when: on_success
    paths:
      - config-adapter/target/*.jar
    expire_in: 1 month

deploy-config-adapter:
  extends: .only-config-adapter-changes
  image: docker:27-dind
  stage: deploy
  needs: ['build-config-adapter']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd config-adapter
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $CI_REGISTRY_IMAGE/config-adapter:$IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true
