# GitLab CI jobs for AuthZ (OPA Rego policies)
# Runs linting, type checking, unit tests, and bundle builds

# Hidden job that defines rules for authz changes
# All authz jobs should extend this
.only-authz-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when authz files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - authz/**/*
        - portal-model/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/authz.yml

# Common OPA configuration for CI jobs (lint, test, qa, bundle)
# which GitLab CI requires to execute script commands.
.opa-common:
  image: registry.gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-deployment/opa:2153c0f

# =============================================================================
# Lint Stage
# =============================================================================

# Check Rego formatting
lint-authz-rego:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: lint
  needs: []
  script:
    - cd authz/rego
    - opa fmt --fail --diff policy lib providers

# =============================================================================
# QA Stage
# =============================================================================

# Check Rego types (strict mode)
check-authz-rego:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: qa
  needs: []
  script:
    - cd authz/rego
    - opa check --strict policy lib providers

# =============================================================================
# Test Stage
# =============================================================================

# Run Rego unit tests
# backends data lives under data/backends/ so OPA resolves data.backends.* directly
test-authz-rego:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: test
  needs: []
  script:
    - cd authz/rego
    - opa test policy lib providers test data -v

# =============================================================================
# Build Stage
# =============================================================================

# Build OPA bundle
bundle-authz-rego:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: build
  needs:
    - job: check-authz-rego
      optional: true
    - job: setup-version
      optional: true
  script:
    - cd authz/rego
    - echo "Building OPA bundle (revision ${REVISION:-$CI_COMMIT_SHORT_SHA})..."
    # Create bundle directory structure at /bundle (not /tmp/bundle) so that
    # opa build embeds "bundle/" as prefix — matching the Dockerfile COPY paths.
    # Note: backends go at /bundle/backends/ (not data/backends/) because
    # OPA bundles treat data/ as a special prefix that conflicts with manifest roots
    - mkdir -p /bundle/backends
    - cp -r policy lib providers /bundle/
    - cp -r data/backends/* /bundle/backends/
    # Create manifest with revision
    - |
      cat > /bundle/.manifest << EOF
      {
        "revision": "${REVISION:-$CI_COMMIT_SHORT_SHA}",
        "roots": ["civitas", "backends", "system"]
      }
      EOF
    # Build bundle
    - chmod -R 0755 /bundle
    - opa build -b /bundle -o bundle.tar.gz
    - echo "Bundle built successfully"
    - tar -tzf bundle.tar.gz | head -20
  artifacts:
    expire_in: 1 week
    paths:
      - authz/rego/bundle.tar.gz

# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-authz:
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Always run on MR pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/pom.xml
    paths:
      - .m2/repository
  script:
    - cd authz/repository
    # Only generate dependency tree, no compilation needed
    - mvn -B dependency:tree -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - authz/repository/maven.graph.json

lint-authz:
  extends: .only-authz-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/repository/pom.xml

    paths:
      - .m2/repository
  script:
    - cd authz/repository
    - mvn spotless:check

dependency-prune-authz:
  extends: .only-authz-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/repository/pom.xml
    paths:
      - .m2/repository
  script:
    - cd authz/repository
    - mvn $MAVEN_CLI_OPTS -B dependency:analyze -DfailOnWarning=true -DignoreNonCompile=false -DignoredDependencies=org.springframework.boot:*,org.springframework.security:*,org.springframework:*,jakarta.*,org.springdoc:*,org.slf4j:*
  allow_failure:
    exit_codes:
      - 1

test-authz:
  extends: .only-authz-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: test
  needs:
    - job: build-authz
      artifacts: true
    - job: setup-version
      artifacts: true
    - job: setup-version-portal-model
      artifacts: true
    - job: publish-portal-model
      optional: true
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/repository/pom.xml
    paths:
      - .m2/repository
  script:
    - cd authz/repository
    # Run tests using published portal-model from GitLab Maven repository
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent surefire:test jacoco:report -Dportal-model.version=$PORTAL_MODEL_VERSION -s ci_settings.xml
    # To print coverage, picked up by coverage regex
    - cat target/site/jacoco/index.html| grep -o '<tfoot>.*</tfoot>'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - authz/repository/target/surefire-reports/
      - authz/repository/target/site/jacoco/
    reports:
      junit: authz/repository/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: authz/repository/target/site/jacoco/jacoco.xml

build-authz:
  extends: .only-authz-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build
  needs:
    - job: setup-version
      artifacts: true
    - job: setup-version-portal-model
      artifacts: true
    - lint-authz
    - dependency-prune-authz
    - job: publish-portal-model
      optional: true
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/repository/pom.xml
    paths:
      - .m2/repository
  script:
    - cd authz/repository
    # Use GitLab Maven repository for config-adapter and portal-model dependencies
    - |
      mvn package -DskipTests -Dportal-model.version=$PORTAL_MODEL_VERSION -s ci_settings.xml
  artifacts:
    when: on_success
    paths:
      - authz/repository/target/
    expire_in: 1 month

build-opa-image:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: publish
  needs:
    - job: setup-version
      artifacts: true
    - job: bundle-authz-rego
      artifacts: true
    - job: test-authz
    - job: test-authz-rego
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  artifacts:
    when: on_success
    paths:
      - authz/rego/bundle.tar.gz
    expire_in: 1 month
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/opa:${CI_COMMIT_REF_SLUG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        --target opa \
        --file authz/Dockerfile .
  after_script:
    - docker buildx rm multiarch || true
    - echo "Cleanup done" || true

build-authz-image:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: publish
  needs:
    - job: setup-version
      artifacts: true
    - job: build-authz
      artifacts: true
    - job: test-authz
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  cache:
    key:
      prefix: authz-maven
      files:
        - authz/repository/pom.xml
    paths:
      - .m2/repository
  artifacts:
    when: on_success
    paths:
      - authz/repository/target/*.jar
    expire_in: 1 month
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/authz-repo-service:${CI_COMMIT_REF_SLUG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        --target authz-repo-service \
        --file authz/Dockerfile .
  after_script:
    - docker buildx rm multiarch || true
    - echo "Cleanup done" || true

container-scan-opa:
  extends: .only-authz-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: setup-version
      artifacts: true
    - job: build-opa-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/opa:${CI_COMMIT_REF_SLUG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

container-scan-authz:
  extends: .only-authz-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: setup-version
      artifacts: true
    - job: build-authz-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/authz-repo-service:${CI_COMMIT_REF_SLUG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-opa:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: deploy
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-opa
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/opa:${CI_COMMIT_REF_SLUG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/opa:$REVISION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "staging" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker buildx imagetools create $CI_REGISTRY_IMAGE/opa:$REVISION --tag $CI_REGISTRY_IMAGE/opa:$CI_COMMIT_BRANCH
      fi

deploy-authz:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: deploy
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-authz
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/authz-repo-service:${CI_COMMIT_REF_SLUG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/authz-repo-service:$REVISION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "staging" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker buildx imagetools create $CI_REGISTRY_IMAGE/authz-repo-service:$REVISION --tag $CI_REGISTRY_IMAGE/authz-repo-service:$CI_COMMIT_BRANCH
      fi

sbom-opa-image:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: report
  needs:
    - job: setup-version
      artifacts: true
    - job: deploy-opa
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd authz/repository
    - mkdir -p target
    - syft registry:$CI_REGISTRY_IMAGE/opa:$REVISION -o cyclonedx-json > target/opa-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - authz/repository/target/opa-image.cdx.json
    # TODO: https://gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/-/issues/728
    # Fix license name resolution
    # reports:
    #   cyclonedx: authz/repository/target/opa-image.cdx.json

sbom-authz-image:
  extends: .only-authz-changes
  image: docker:27-dind
  stage: report
  needs:
    - job: setup-version
      artifacts: true
    - job: deploy-authz
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd authz/repository
    - mkdir -p target
    - syft registry:$CI_REGISTRY_IMAGE/authz-repo-service:$REVISION -o cyclonedx-json > target/authz-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - authz/repository/target/authz-image.cdx.json
    # TODO: https://gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/-/issues/728
    # Fix license name resolution
    # reports:
    #   cyclonedx: authz/repository/target/authz-image.cdx.json
