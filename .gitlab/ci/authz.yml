# GitLab CI jobs for AuthZ (OPA Rego policies)
# Runs linting, type checking, unit tests, and bundle builds

# Hidden job that defines rules for authz changes
# All authz jobs should extend this
.only-authz-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when authz files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - authz/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/authz.yml

# Common OPA configuration
# Uses alpine + OPA binary because the static image has no shell,
# which GitLab CI requires to execute script commands.
.opa-common:
  image: alpine:latest
  variables:
    OPA_VERSION: "1.4.2"
  before_script:
    - wget -q -O /usr/local/bin/opa "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_$(uname -m | sed 's/x86_64/amd64/' | sed 's/aarch64/arm64/')_static"
    - chmod +x /usr/local/bin/opa

# =============================================================================
# Lint Stage
# =============================================================================

# Check Rego formatting
lint-authz:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: lint
  needs: []
  script:
    - cd authz/rego
    - opa fmt --fail --diff policy lib providers

# =============================================================================
# QA Stage
# =============================================================================

# Check Rego types (strict mode)
check-authz:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: qa
  needs: []
  script:
    - cd authz/rego
    - opa check --strict policy lib providers

# =============================================================================
# Test Stage
# =============================================================================

# Run Rego unit tests
# backends data lives under data/backends/ so OPA resolves data.backends.* directly
test-authz:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: test
  needs: []
  script:
    - cd authz/rego
    - opa test policy lib providers test data -v

# =============================================================================
# Build Stage
# =============================================================================

# Build OPA bundle
bundle-authz:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: build
  needs:
    - job: test-authz
      optional: true
    - job: setup-version
      optional: true
  script:
    - cd authz/rego
    - echo "Building OPA bundle (revision ${REVISION:-$CI_COMMIT_SHORT_SHA})..."
    # Create bundle directory structure
    - mkdir -p /tmp/bundle/data
    - cp -r policy lib providers /tmp/bundle/
    - cp -r data/backends /tmp/bundle/data/
    # Create manifest with revision
    - |
      cat > /tmp/bundle/.manifest << EOF
      {
        "revision": "${REVISION:-$CI_COMMIT_SHORT_SHA}",
        "roots": ["civitas", "backends"]
      }
      EOF
    # Build bundle
    - opa build -b /tmp/bundle -o bundle.tar.gz
    - echo "Bundle built successfully"
    - tar -tzf bundle.tar.gz | head -20
  artifacts:
    expire_in: 1 week
    paths:
      - authz/rego/bundle.tar.gz
