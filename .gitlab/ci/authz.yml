# GitLab CI jobs for AuthZ (OPA Rego policies)
# Runs linting, type checking, unit tests, and bundle builds

# Hidden job that defines rules for authz changes
# All authz jobs should extend this
.only-authz-changes:
  rules:
    - !reference [.rules-protected, rules]
    - !reference [.rules-mr-always, rules] # TODO: testing, every job runs on every merge request. Remove this line to bring the changes: filter below back
    # Run on MR only when authz files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - authz/**/*
        - portal-model/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/authz.yml


# Common OPA configuration for CI jobs (lint, test, qa, bundle)
# which GitLab CI requires to execute script commands.
.opa-common:
  image: registry.gitlab.com/civitas-connect/civitas-core/docker-images/cicd:2.0.0-beta

# =============================================================================
# Rego: format, strict type check, unit tests and the OPA bundle in one job
# =============================================================================

# The four steps are short, so they share one container. All of them run, so one pipeline shows every
# result; the job fails if any failed. The bundle is built only when all checks passed.
# Rego unit tests: backends data lives under data/backends/ so OPA resolves data.backends.* directly.
test-authz-rego:
  extends:
    - .only-authz-changes
    - .opa-common
  stage: test
  needs:
    - job: setup-version
      artifacts: true
      optional: true
  script:
    - cd authz/rego
    - opa fmt --fail --diff policy lib providers || FAILED=1
    - opa check --strict policy lib providers || FAILED=1
    - opa test policy lib providers test data -v || FAILED=1
    - test -z "$FAILED"
    - echo "Building OPA bundle (revision ${REVISION:-$CI_COMMIT_SHORT_SHA})..."
    # Create bundle directory structure at /bundle (not /tmp/bundle) so that
    # opa build embeds "bundle/" as prefix — matching the Dockerfile COPY paths.
    # Note: backends go at /bundle/backends/ (not data/backends/) because
    # OPA bundles treat data/ as a special prefix that conflicts with manifest roots
    - mkdir -p /bundle/backends
    - cp -r policy lib providers /bundle/
    - cp -r data/backends/* /bundle/backends/
    # Create manifest with revision
    - |
      cat > /bundle/.manifest << EOF
      {
        "revision": "${REVISION:-$CI_COMMIT_SHORT_SHA}",
        "roots": ["civitas", "backends", "system"]
      }
      EOF
    # Build bundle
    - chmod -R 0755 /bundle
    - opa build -b /bundle -o bundle.tar.gz
    - echo "Bundle built successfully"
    - tar -tzf bundle.tar.gz | head -20
  artifacts:
    expire_in: 1 week
    paths:
      - authz/rego/bundle.tar.gz

# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-authz:
  extends: .maven-authz
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: lint
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd authz/repository
    # Only generate dependency tree, no compilation needed
    - mvn -B dependency:tree -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - authz/repository/maven.graph.json

test-authz:
  extends:
    - .only-authz-changes
    - .maven-authz
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: test
  needs:
    - job: build-authz
      artifacts: true
    - job: setup-version
      artifacts: true
    - job: build-portal-model
      artifacts: true
  cache:
    policy: pull-push
    when: always
  after_script:
    # This job pushes the cache. It must not carry the portal-model of this pipeline into it.
    - rm -rf $CI_PROJECT_DIR/.m2/repository/de/civitascore
  script:
    - cd authz/repository
    # portal-model comes from the artifact of build-portal-model (this pipeline), not from the registry
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent surefire:test jacoco:report -Dportal-model.version=$PORTAL_MODEL_VERSION
    # To print coverage, picked up by coverage regex
    - cat target/site/jacoco/index.html| grep -o '<tfoot>.*</tfoot>'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - authz/repository/target/surefire-reports/
      - authz/repository/target/site/jacoco/
    reports:
      junit: authz/repository/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: authz/repository/target/site/jacoco/jacoco.xml

# The jar is needed by the API test and by test-authz and build-authz-image (rules of authz and
# portal-model), so the job runs wherever any of them runs.
.build-authz-changes:
  rules:
    - !reference [.api-test-stack-changes, rules]
    - !reference [.only-authz-changes, rules]

# Format check, build, and the dependency check. portal-model comes from the artifact of
# build-portal-model (this pipeline), not from the registry.
build-authz:
  extends:
    - .build-authz-changes
    - .maven-authz
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: build
  needs:
    - job: setup-version
      artifacts: true
    - job: build-portal-model
      artifacts: true
  script:
    - cd authz/repository
    - mvn -B spotless:check package -DskipTests -Dportal-model.version=$PORTAL_MODEL_VERSION
    # Unused or undeclared dependencies fail the job (this was the job dependency-prune-authz)
    - mvn $MAVEN_CLI_OPTS -B dependency:analyze -Dportal-model.version=$PORTAL_MODEL_VERSION -DfailOnWarning=true -DignoreNonCompile=false
  artifacts:
    when: on_success
    paths:
      - authz/repository/target/
    expire_in: 1 month

build-opa-image:
  extends:
    - .only-authz-changes
    - .docker-build
  stage: publish
  interruptible: false
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: test-authz-rego
      artifacts: true
    - job: test-authz
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/opa:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        --target opa \
        --file authz/Dockerfile .

build-authz-image:
  extends:
    - .only-authz-changes
    - .docker-build
  stage: publish
  interruptible: false
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-authz
      artifacts: true
    - job: test-authz
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/authz-repo-service:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        --target authz-repo-service \
        --file authz/Dockerfile .

container-scan-opa:
  extends:
    - .only-authz-changes
    - .container-scan
  needs:
    - job: setup-version
      artifacts: true
    - job: build-opa-image
  variables:
    IMAGE_NAME: opa
    SBOM_PATH: authz/repository/target/opa-image.cdx.json

container-scan-authz:
  extends:
    - .only-authz-changes
    - .container-scan
  needs:
    - job: setup-version
      artifacts: true
    - job: build-authz-image
  variables:
    IMAGE_NAME: authz-repo-service
    SBOM_PATH: authz/repository/target/authz-image.cdx.json

deploy-opa:
  extends:
    - .only-authz-changes
    - .deploy-image
  resource_group: deploy-opa-$CI_COMMIT_REF_SLUG
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-opa
    - job: api-test-backend
      optional: true
      artifacts: false
  variables:
    IMAGE_NAME: opa

deploy-authz:
  extends:
    - .only-authz-changes
    - .deploy-image
  resource_group: deploy-authz-$CI_COMMIT_REF_SLUG
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-authz
    - job: api-test-backend
      optional: true
      artifacts: false
  variables:
    IMAGE_NAME: authz-repo-service

# The authorization scenarios through the real gateway (dev-environment/authz/integration-test.sh):
# APISIX, OPA, the authz repository and the backend with Keycloak users in three roles. The script
# was never part of CI. It builds nothing here (--skip-build): the images are built by `docker
# compose up` from the jars of this pipeline.
# TODO: first runs: the port check needed lsof and ss; then the config-adapter of
# docker-compose.authz-e2e.yml (ADAPTERS=keycloak) refused to start without the saga handlers
# "frost" and "apisix"; it now gets their settings as in the API test stack. Open, whatever the
# next run shows:
#  - the script reaches the stack at localhost, a dind daemon is at `docker` (set below), and a
#    token issued under that host may not match the issuer the stack is configured with;
#  - other bind mounts of the stack (Keycloak realm import, APISIX and OPA config) only work if the
#    dind daemon sees the build directory; the Flyway step copies its files in with `docker cp`;
#  - the config-adapter, authz and portal-backend images are built from jars that must be in the
#    working tree, so build-authz, build-config-adapter and build-backend are needed.
# TODO: its seven scenarios are also covered by the Rego tests (decision_matrix_test.rego) and the
# Bruno `permissions` and `roles` folders. Once covered there, retire this script and authz/e2e
# (see TEST-CONSOLIDATION-PLAN.md, D7). authz/e2e (Playwright) is not run in CI either: its README
# names seed scripts that no longer exist, and it needs the frontend on localhost:3000.
integration-test-authz:
  extends:
    - .only-authz-changes
    - .docker-cli
    - .dind
  stage: test
  timeout: 1h
  allow_failure: true # TODO: remove when the job is stable
  needs:
    - job: build-backend
      artifacts: true
    - job: build-config-adapter
      artifacts: true
    - job: build-authz
      artifacts: true
  variables:
    APISIX_URL: http://docker:9080
    KEYCLOAK_URL: http://docker:8080
  before_script:
    # lsof and ss for the port check of the script: busybox's lsof is a stub that reports every port as in use
    - apk add --no-cache bash curl jq postgresql-client lsof iproute2 >/dev/null
  script:
    - bash dev-environment/authz/integration-test.sh --skip-build
  after_script:
    - docker compose -f dev-environment/authz/docker-compose.authz-e2e.yml down -v 2>/dev/null || true
