# The NiFi extensions the platform installs into its NiFi deployment.
#
# The NAR is released on its own line, not with the config-adapter: it is compiled against the NiFi
# extension API (Java 21, not the Java of the rest of the repository), and it must be in the NiFi
# installation before the adapter deploys a flow that uses it. A shared version would tie the two
# together in the wrong order.

.only-nifi-extensions-changes:
  rules:
    # Always run on the nightly scheduled pipeline so the full build/scan runs
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IS_NIGHTLY == "true"
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when the extensions change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - nifi-extensions/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/nifi-extensions.yml

.nifi-extensions-maven:
  image: maven:3.9-eclipse-temurin-25-alpine
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: nifi-extensions-maven
      files:
        - nifi-extensions/pom.xml
    paths:
      - .m2/repository

# Version from the pom's revision property, with the same branch suffixes the other components use.
setup-version-nifi-extensions:
  extends: .nifi-extensions-maven
  stage: .pre
  script:
    - cd nifi-extensions
    - BASE_VERSION=$(mvn help:evaluate -Dexpression=revision -q -DforceStdout)
    - echo "Base version from pom.xml - $BASE_VERSION"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ -n "$CI_COMMIT_TAG" ]; then
        NIFI_EXTENSIONS_VERSION="$BASE_VERSION"
      elif [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        NIFI_EXTENSIONS_VERSION="${BASE_VERSION}-SNAPSHOT"
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        NIFI_EXTENSIONS_VERSION="${BASE_VERSION}-MR-${CI_MERGE_REQUEST_IID}-SNAPSHOT"
      else
        NIFI_EXTENSIONS_VERSION="${BASE_VERSION}-${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "NIFI_EXTENSIONS_VERSION=$NIFI_EXTENSIONS_VERSION" > ../nifi-extensions-version.env
    - echo "Setting NIFI_EXTENSIONS_VERSION=$NIFI_EXTENSIONS_VERSION"
  artifacts:
    reports:
      dotenv: nifi-extensions-version.env

# Runs on every MR pipeline so that dependency scanning has the graph even where the build is
# skipped for want of changes.
generate-graph-nifi-extensions:
  extends: .nifi-extensions-maven
  stage: lint
  needs:
    - job: setup-version-nifi-extensions
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IS_NIGHTLY == "true"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd nifi-extensions
    - mvn -B dependency:tree -Drevision=$NIFI_EXTENSIONS_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - nifi-extensions/maven.graph.json

lint-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  stage: lint
  needs:
    - job: setup-version-nifi-extensions
  script:
    - cd nifi-extensions
    - mvn spotless:check -Drevision=$NIFI_EXTENSIONS_VERSION

# The unit tests, the static analysis and the NAR. The integration test needs a Docker daemon, so it
# has its own job below and is skipped here; PMD, CPD and SpotBugs are bound at verify.
build-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  image: maven:3.9-eclipse-temurin-25
  stage: build-package
  needs:
    - job: setup-version-nifi-extensions
    - job: lint-nifi-extensions
  script:
    - cd nifi-extensions
    - mvn -B verify install:install -DskipITs -Drevision=$NIFI_EXTENSIONS_VERSION
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - nifi-extensions/*/target/*.nar
      - nifi-extensions/*/target/nifi-extensions.json
      - nifi-extensions/*/target/surefire-reports/
      - nifi-extensions/*/target/site/jacoco/
    reports:
      junit:
        - nifi-extensions/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: nifi-extensions/*/target/site/jacoco/jacoco.xml

# Writes with each port against a real FROST-Server. The test brings the server up itself through
# Testcontainers, so this job carries no endpoint and no credential of an installation and needs no
# CI secret: there is nothing here that could reach production data.
integration-test-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  image: maven:3.9-eclipse-temurin-25
  stage: test
  needs:
    - job: setup-version-nifi-extensions
    - job: build-nifi-extensions
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - cd nifi-extensions
    # Explicit goals keep package, spotless and spotbugs out of this job.
    - mvn -B -pl nifi-frost-processors test-compile failsafe:integration-test failsafe:verify -Drevision=$NIFI_EXTENSIONS_VERSION
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - nifi-extensions/*/target/failsafe-reports/
    reports:
      junit:
        - nifi-extensions/*/target/failsafe-reports/TEST-*.xml

# The NAR goes to the GitLab Maven repository, where the NiFi image of the deployment project reads
# it from.
publish-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  stage: deploy-package
  needs:
    - job: setup-version-nifi-extensions
    - job: build-nifi-extensions
  script:
    - cd nifi-extensions
    - |
      mvn deploy -DskipTests -Drevision=$NIFI_EXTENSIONS_VERSION \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml

# The NARs travel into an installation inside an image of their own, because a NiFi image of our own
# would put the whole Apache distribution into our registry and into our container scanning for a
# file of two megabytes. The deployment copies them out of an init container.
#
# The image carries the NAR version, not the version of the repository: a flow names the bundle
# version of the processor it uses, and NiFi resolves a component by that coordinate.
build-nifi-extensions-image:
  extends:
    - .only-nifi-extensions-changes
  image: docker:27-dind
  stage: publish
  needs:
    - job: setup-version-nifi-extensions
    - job: build-nifi-extensions
      artifacts: true
    - job: integration-test-nifi-extensions
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - |
      cat > /tmp/buildkitd.toml <<'TOML'
      [registry."docker.io"]
        mirrors = ["docker-mirror01.extern.frachtwerk.de"]
      TOML
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch --config /tmp/buildkitd.toml buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd nifi-extensions
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/nifi-extensions:${CI_COMMIT_REF_SLUG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-nifi-extensions:
  extends: .only-nifi-extensions-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: build-nifi-extensions-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/nifi-extensions:${CI_COMMIT_REF_SLUG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-nifi-extensions-image:
  extends: .only-nifi-extensions-changes
  image: docker:27-dind
  stage: deploy
  needs:
    - job: setup-version-nifi-extensions
    - job: container-scan-nifi-extensions
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/nifi-extensions:${CI_COMMIT_REF_SLUG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/nifi-extensions:$NIFI_EXTENSIONS_VERSION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker buildx imagetools create $CI_REGISTRY_IMAGE/nifi-extensions:$NIFI_EXTENSIONS_VERSION --tag $CI_REGISTRY_IMAGE/nifi-extensions:$CI_COMMIT_BRANCH
      fi

sbom-nifi-extensions-image:
  extends: .only-nifi-extensions-changes
  image: docker:27-dind
  stage: report
  needs:
    - job: setup-version-nifi-extensions
    - job: deploy-nifi-extensions-image
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - mkdir -p nifi-extensions/target
    - syft registry:$CI_REGISTRY_IMAGE/nifi-extensions:$NIFI_EXTENSIONS_VERSION -o cyclonedx-json > nifi-extensions/target/nifi-extensions-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - nifi-extensions/target/nifi-extensions-image.cdx.json
