# The NiFi extensions the platform installs into its NiFi deployment.
#
# The NAR is released on its own line, not with the config-adapter: it is compiled against the NiFi
# extension API (Java 21, not the Java of the rest of the repository), and it must be in the NiFi
# installation before the adapter deploys a flow that uses it. A shared version would tie the two
# together in the wrong order.

.only-nifi-extensions-changes:
  rules:
    - !reference [.rules-protected, rules]
    # Run on MR only when the extensions change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - nifi-extensions/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/nifi-extensions.yml
        - model-forge/model-forge-runtime/src/main/java/de/civitascore/modelforge/validation/CoreJsonSchemaFactory.java
        - model-forge/model-forge-runtime/src/main/resources/geojson/**/*
        - portal-backend/src/main/java/de/civitascore/portal/model/connector/HttpConnectorConfiguration.java

.nifi-extensions-maven:
  extends: .maven-nifi-extensions
  image: maven:3.9.16-eclipse-temurin-25-alpine@sha256:781f1da87cd3d142e66e47cc149c4582a652fb7f574648206d1e956170c0dc90

# Runs on every MR pipeline so that dependency scanning has the graph even where the build is
# skipped for want of changes.
generate-graph-nifi-extensions:
  extends: .nifi-extensions-maven
  stage: lint
  needs:
    - job: setup-version
      artifacts: true
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd nifi-extensions
    - mvn $MAVEN_CLI_OPTS dependency:tree -Drevision=$NIFI_EXTENSIONS_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - nifi-extensions/maven.graph.json

# Every NAR of the extensions (FROST, HTTP) for the NiFi of the API test and the config-adapter NiFi
# ITs: the saga collections and the ITs deploy Pipelines that use PutFrostRecord and GetHttpApiCall.
# It runs on the rules of the API test stack, not of this lane, so those consumers never miss a NAR.
# No tests or static analysis.
build-nifi-nars:
  extends:
    - .api-test-stack-changes
    - .nifi-extensions-maven
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: build-package
  needs: []
  script:
    - mvn $MAVEN_CLI_OPTS -f nifi-extensions/pom.xml package -DskipTests -DskipITs -Dspotless.check.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotbugs.skip=true -Djacoco.skip=true
  artifacts:
    expire_in: 1 day
    paths:
      - nifi-extensions/nifi-*-nar/target/*.nar

# Spotless, PMD, CPD and SpotBugs are bound to verify. They run here, beside the build and the tests.
# (The format check was the job lint-nifi-extensions.)
static-analysis-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  script:
    - cd nifi-extensions
    - mvn $MAVEN_CLI_OPTS verify -DskipTests -DskipITs -Drevision=$NIFI_EXTENSIONS_VERSION -Djacoco.skip=true

# The unit tests and the NAR. The integration test needs a Docker daemon, so it has its own job
# below and is skipped here. The static analysis is in static-analysis-nifi-extensions.
build-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  cache:
    policy: pull-push
    when: always
  script:
    - cd nifi-extensions
    - mvn $MAVEN_CLI_OPTS verify install:install -DskipITs -Drevision=$NIFI_EXTENSIONS_VERSION -Dspotless.check.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotbugs.skip=true
    - |
      awk -F, \
      'NR>1 {missed+=$4; covered+=$5} \
       END { if ((missed+covered)>0) \
       printf "Total Coverage: %.2f%%\n", 100*covered/(missed+covered); \
       else print "Total Coverage: 0.00%" }' \
      */target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]{2})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - nifi-extensions/*/target/*.nar
      - nifi-extensions/*/target/nifi-extensions.json
      - nifi-extensions/*/target/surefire-reports/
      - nifi-extensions/*/target/site/jacoco/
    reports:
      junit:
        - nifi-extensions/*/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: nifi-extensions/*/target/site/jacoco/jacoco.xml

# Writes with each port against a real FROST-Server. The test brings the server up itself through
# Testcontainers, so this job carries no endpoint and no credential of an installation and needs no
# CI secret: there is nothing here that could reach production data.
integration-test-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .nifi-extensions-maven
    - .dind
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: test
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-nifi-extensions
  script:
    - cd nifi-extensions
    # Explicit goals keep package, spotless and spotbugs out of this job.
    - mvn $MAVEN_CLI_OPTS -pl nifi-frost-processors test-compile failsafe:integration-test failsafe:verify -Drevision=$NIFI_EXTENSIONS_VERSION
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - nifi-extensions/*/target/failsafe-reports/
    reports:
      junit:
        - nifi-extensions/*/target/failsafe-reports/TEST-*.xml

# The NAR goes to the GitLab Maven repository, where the NiFi image of the deployment project reads
# it from.
publish-nifi-extensions:
  extends:
    - .rules-protected
    - .nifi-extensions-maven
  stage: publish
  interruptible: false
  needs:
    - job: setup-version
      artifacts: true
    - job: build-nifi-extensions
    - job: static-analysis-nifi-extensions
      artifacts: false
    - job: integration-test-nifi-extensions
      artifacts: false
  script:
    - cd nifi-extensions
    - |
      mvn $MAVEN_CLI_OPTS deploy -DskipTests -DskipITs -Drevision=$NIFI_EXTENSIONS_VERSION \
        -Dspotless.check.skip=true -Dpmd.skip=true -Dcpd.skip=true -Dspotbugs.skip=true -Djacoco.skip=true \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml

# The NARs travel into an installation inside an image of their own, because a NiFi image of our own
# would put the whole Apache distribution into our registry and into our container scanning for a
# file of two megabytes. The deployment copies them out of an init container.
#
# The image carries the version of the repository, like the other platform images. The NAR version
# that a flow names is inside the NAR, not in the image tag.
build-nifi-extensions-image:
  extends:
    - .only-nifi-extensions-changes
    - .docker-build
  stage: publish
  interruptible: false
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-nifi-extensions
      artifacts: true
    - job: integration-test-nifi-extensions
    - job: static-analysis-nifi-extensions
  script:
    - cd nifi-extensions
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/nifi-extensions:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        .

container-scan-nifi-extensions:
  extends:
    - .only-nifi-extensions-changes
    - .container-scan
  needs:
    - job: build-nifi-extensions-image
  variables:
    IMAGE_NAME: nifi-extensions
    SBOM_PATH: nifi-extensions/target/nifi-extensions-image.cdx.json

deploy-nifi-extensions-image:
  extends:
    - .only-nifi-extensions-changes
    - .deploy-image
  resource_group: deploy-nifi-extensions-$CI_COMMIT_REF_SLUG
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-nifi-extensions
  variables:
    IMAGE_NAME: nifi-extensions
