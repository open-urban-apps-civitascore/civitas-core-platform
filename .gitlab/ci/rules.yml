# Rules shared by the component files.

# Always run on the nightly schedule, tags, and main, staging and develop.
.rules-protected:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IS_NIGHTLY == "true"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "develop"

# Every pipeline: the above, and merge requests whatever they change.
.rules-all:
  rules:
    - !reference [.rules-protected, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The nightly schedule only (the scheduled pipeline has IS_NIGHTLY=true). For the end-to-end suites that
# are too slow for a merge request.
.rules-nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IS_NIGHTLY == "true"
