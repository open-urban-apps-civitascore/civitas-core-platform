# Rules shared by the component files.

# Always run on the nightly schedule, tags, and main, staging and develop.
.rules-protected:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $IS_NIGHTLY == "true"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "develop"

# Every pipeline: the above, and merge requests whatever they change.
.rules-all:
  rules:
    - !reference [.rules-protected, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# TEST MODE: every job runs on every merge request pipeline, whatever the merge request changes.
# TODO: remove this block and every `!reference [.rules-mr-always, rules]` line (grep for it) to
# bring the `changes:` filters back; merge requests then run only the components they touch.
.rules-mr-always:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The release gate of the Maven registry: protected branches only.
# TODO: testing only: merge requests publish their -MR-<iid>-SNAPSHOT versions too, so that
# publish-* runs. Switch the publish-* jobs back to .rules-protected (grep for .rules-publish).
.rules-publish:
  rules:
    - !reference [.rules-protected, rules]
    - !reference [.rules-mr-always, rules]
