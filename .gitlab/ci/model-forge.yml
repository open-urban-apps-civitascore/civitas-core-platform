# CIVITAS/CORE Model Forge — CI jobs for the mono-repo.
#
# Ported from the former standalone model-forge/.gitlab-ci.yml. Model Forge is a set of
# embedded Java libraries (model-forge-contract / -runtime / -spring-boot-starter, plus the
# model-forge-admin-ui demo host). It builds like portal-model / config-adapter: build + test
# the Maven reactor, then publish the Maven artifacts to the project registry so consumers
# (portal-backend) can resolve them. This reactor no longer ships an npm types module; the
# TypeScript/Zod CORE types are generated in portal-frontend from the CORE JSON Schemas.
#
# Not ported (handled elsewhere or obsolete in the mono-repo):
#   - Security templates (SAST / Secret-Detection / Dependency-Scanning): included globally in .gitlab-ci.yml
#   - renovate:            covered by .gitlab/ci/renovate.yml
#   - commitlint:          repo-wide concern, not run per module here
#   - pages (Docusaurus):  the docs live in the separate documentation repo, not this mono-repo
#   - semantic-release:    the mono-repo has its own release process
#   - validate-schemas docs-drift guard: the docs schema copies moved to the documentation repo,
#                          so only the JSON Schema metaschema validation is kept below
#
# NOTE on versioning: Model Forge uses the same ${revision} pattern as portal-model and
# config-adapter — main/tags publish the bare version, develop publishes -SNAPSHOT, and each
# merge request publishes its own -MR-<iid>-SNAPSHOT. portal-backend, its only consumer, is
# built against the version this pipeline published, so it always resolves its own branch's
# Model Forge rather than whatever last wrote a shared coordinate.

# Hidden job that defines rules for model-forge changes. All model-forge jobs extend this.
.only-model-forge-changes:
  rules:
    - !reference [.rules-protected, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - model-forge/**/*
        - portal-backend/**/*
        - portal-model/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/model-forge.yml
        - .gitlab/ci/backend.yml
        - .gitlab/ci/portal-model.yml

# Generate the maven dependency graph JSON for license/dependency scanning.
# Always runs (own rules, no `changes`) so the scanner has the graph even when the
# build job is skipped because nothing changed.
generate-graph-model-forge:
  extends: .maven-model-forge
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: lint
  needs:
    - job: setup-version
      artifacts: true
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd model-forge
    # Reactor build: writes one maven.graph.json per module (and the aggregator pom).
    - mvn -B dependency:tree -Drevision=$MODEL_FORGE_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - model-forge/maven.graph.json
      - model-forge/*/maven.graph.json

# Validate the CORE-IR JSON Schemas against the JSON Schema metaschema, and every document in
# the model-forge/schemas catalogue against the CORE schema it declares. Nothing in the Maven
# build consumes that catalogue, so without the second step a demo/use-case document can drift
# out of the CORE contract unnoticed and only fail when a host imports it.
# (The docs-drift half of the original job is dropped — the docs schema copies now live
#  in the documentation repo.)
validate-schemas-model-forge:
  extends: .only-model-forge-changes
  image: python:3.12.15-slim
  stage: lint
  needs: []
  script:
    - pip install --quiet check-jsonschema==$CHECK_JSONSCHEMA_VERSION
    - |
      CORE_DIR=model-forge/model-forge-runtime/src/main/resources
      CATALOGUE=model-forge/schemas
      FAILED=0

      # 1. The CORE-IR meta-schemas themselves must be well-formed JSON Schema 2020-12 documents.
      for f in "$CORE_DIR"/*.schema.json; do
        [ -f "$f" ] || continue
        echo "Validating $f ..."
        check-jsonschema --check-metaschema "$f" || FAILED=1
      done

      # 2. Resolve each catalogue document to the CORE schema its own "$schema" declares. Emits
      #    "<core schema file> <document>" per line; "METASCHEMA" for plain JSON Schema element
      #    documents, "PARSE_ERROR" for malformed JSON. Documents without a "$schema" (fixture
      #    seed data) are not emitted and therefore not validated.
      cat > /tmp/resolve-core-schema.py <<'PY'
      import json
      import sys
      from pathlib import Path

      CORE_MAP = {
          "https://civitasconnect.digital/core/datasource/v1": "datasource.schema.json",
          "https://civitasconnect.digital/core-dataset/v1#/$defs/DataSource": "datasource.schema.json",
          "https://civitasconnect.digital/core/datasink/v1": "datasink.schema.json",
          "https://civitasconnect.digital/core-dataset/v1#/$defs/DataSink": "datasink.schema.json",
          "https://civitasconnect.digital/core/mapping/v1": "mapping.schema.json",
          "https://civitasconnect.digital/core-dataset/v1#/$defs/Mapping": "mapping.schema.json",
          "https://civitasconnect.digital/core/pipeline/v1": "pipeline.schema.json",
          "https://civitasconnect.digital/core-dataset/v1#/$defs/Pipeline": "pipeline.schema.json",
          "https://civitasconnect.digital/core-dataset/v1": "dataset.schema.json",
          "https://civitasconnect.digital/core-datastructure/v1": "datastructure.schema.json",
          "https://civitasconnect.digital/core/artifact-envelope/v1": "artifact-envelope.schema.json",
      }
      METASCHEMAS = {
          "https://json-schema.org/draft/2020-12/schema",
          "http://json-schema.org/draft/2020-12/schema",
      }

      for path in sorted(Path(sys.argv[1]).rglob("*.json")):
          try:
              document = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError:
              print(f"PARSE_ERROR {path}")
              continue
          declared = document.get("$schema") if isinstance(document, dict) else None
          if declared in CORE_MAP:
              print(f"{CORE_MAP[declared]} {path}")
          elif declared in METASCHEMAS:
              print(f"METASCHEMA {path}")
      PY

      # 3. Validate every resolved document. The directory check keeps the job green if the
      #    catalogue is ever moved, and the per-file check keeps a stale manifest entry from
      #    being handed to the validator as a filename.
      if [ -d "$CATALOGUE" ]; then
        python3 /tmp/resolve-core-schema.py "$CATALOGUE" > /tmp/core-documents.txt
        while read -r schema doc; do
          [ -f "$doc" ] || continue
          case "$schema" in
            PARSE_ERROR)
              echo "Not valid JSON: $doc"
              FAILED=1
              ;;
            METASCHEMA)
              echo "Validating $doc ..."
              check-jsonschema --check-metaschema "$doc" || FAILED=1
              ;;
            *)
              echo "Validating $doc against $schema ..."
              check-jsonschema --schemafile "$CORE_DIR/$schema" "$doc" || FAILED=1
              ;;
          esac
        done < /tmp/core-documents.txt
      else
        echo "No $CATALOGUE directory — skipping catalogue validation."
      fi

      exit $FAILED

# The quality gates bound to verify: spotless format check and spotbugs. They run here, beside the tests.
static-analysis-model-forge:
  extends:
    - .only-model-forge-changes
    - .maven-model-forge
  image: maven:3.9.16-eclipse-temurin-25
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  script:
    - cd model-forge
    - mvn $MAVEN_CLI_OPTS verify -DskipTests -Drevision=$MODEL_FORGE_VERSION -Djacoco.skip=true

# The Maven artifacts of this pipeline, for portal-backend. No tests and no checks: they run in
# test-model-forge and static-analysis-model-forge, and the release gate is publish-model-forge.
# portal-backend compiles against the artifact of this job and not against a copy from the registry.
build-model-forge:
  extends:
    - .only-model-forge-changes
    - .maven-model-forge
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  script:
    - cd model-forge
    - mvn -B install -DskipTests -Drevision=$MODEL_FORGE_VERSION -Dspotless.check.skip=true -Dspotbugs.skip=true -Djacoco.skip=true
  artifacts:
    expire_in: 1 month
    paths:
      - .m2/repository/de/civitascore/core-model-forge-*/$MODEL_FORGE_VERSION/

# Build + test the whole reactor. Needs Docker-in-Docker for the Testcontainers-based tests
# (admin-ui boot test against a real PostgreSQL). Spotless and spotbugs are in static-analysis-model-forge.
test-model-forge:
  extends:
    - .only-model-forge-changes
    - .dind
    - .maven-model-forge
  image: maven:3.9.16-eclipse-temurin-25
  stage: build-package
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
  cache:
    policy: pull-push
    when: always
  script:
    - cd model-forge
    - mvn $MAVEN_CLI_OPTS verify -Drevision=$MODEL_FORGE_VERSION -Dspotless.check.skip=true -Dspotbugs.skip=true
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - model-forge/*/target/*.jar
      - model-forge/*/target/surefire-reports/
      - model-forge/*/target/site/jacoco/
    reports:
      junit:
        - model-forge/*/target/surefire-reports/TEST-*.xml
      # TODO: new, so that every module reports coverage the same way (TEST-CONSOLIDATION-PLAN.md,
      # section 4). Check that the report is written (-Djacoco.skip is not set here); GitLab merges
      # the glob. Add a coverage: regex when a console total is printed.
      coverage_report:
        coverage_format: jacoco
        path: model-forge/*/target/site/jacoco/jacoco.xml

# Publish the Maven artifacts to this project's GitLab Maven registry. This is the release gate:
# only a commit on a protected branch whose tests and static analysis passed is published. Merge
# requests do not publish; portal-backend uses the artifact of build-model-forge there.
# Skips tests/quality (already run in test-model-forge and static-analysis-model-forge).
# The admin UI sets maven.deploy.skip, so the console is not published.
publish-model-forge:
  extends:
    - .rules-protected
    - .maven-model-forge
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: deploy-package
  interruptible: false
  needs:
    - job: setup-version
      artifacts: true
    - job: test-model-forge
      artifacts: false
    - job: static-analysis-model-forge
      artifacts: false
  script:
    - cd model-forge
    - |
      mvn deploy -DskipTests -Drevision=$MODEL_FORGE_VERSION \
        -Dspotless.check.skip=true \
        -Dspotbugs.skip=true \
        -Djacoco.skip=true \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml
