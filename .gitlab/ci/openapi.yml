# Exports the OpenAPI description the backend serves, lints it, and keeps the committed copy in
# api/portal-backend/openapi.yaml in sync with it.

# Boots the backend jar against PostgreSQL only, the one service it cannot start without, so the
# spec is available shortly after build-backend instead of after the API test stack.
export-openapi-spec:
  extends: .only-backend-changes
  image: maven:3.9.16-eclipse-temurin-25-alpine@sha256:781f1da87cd3d142e66e47cc149c4582a652fb7f574648206d1e956170c0dc90
  stage: test
  needs:
    - job: build-backend
      artifacts: true
  services:
    - name: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
      alias: postgres
  variables:
    GIT_STRATEGY: none
    POSTGRES_DB: portal_backend
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: admin
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal_backend
    # The `local` profile permits /api-docs.yaml without a token
    SPRING_PROFILES_ACTIVE: local
    # The spec is hosted as documentation, where the Keycloak host of a stack points nowhere.
    # example.org is reserved for examples (RFC 2606), so these URLs are obviously not real.
    OPENAPI_OAUTH_SERVER_URL: https://auth.example.org
  script:
    - java -jar portal-backend/target/portal-backend-*.jar > portal-backend.log 2>&1 &
    - BACKEND_PID=$!
    - |
      for attempt in $(seq 90); do
        curl -sf http://localhost:8089/v1/api-docs.yaml -o openapi.generated.yaml && break
        kill -0 "$BACKEND_PID" 2>/dev/null || break
        sleep 2
      done
      if [ ! -s openapi.generated.yaml ]; then
        echo "The backend stopped or did not serve the spec within 3 minutes. End of portal-backend.log:"
        tail -n 50 portal-backend.log
        exit 1
      fi
    # Fail when the override did not reach the backend, instead of committing a Keycloak host
    - grep -q "$OPENAPI_OAUTH_SERVER_URL/realms/" openapi.generated.yaml
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - openapi.generated.yaml
      - portal-backend.log

lint-openapi-spec:
  extends: .only-backend-changes
  image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  stage: test
  needs:
    - job: export-openapi-spec
      artifacts: true
  # The script exits 3 only when Spectral reported findings, so a failed install or a crash fails the job
  allow_failure:
    exit_codes: 3
  variables:
    GIT_DEPTH: 1
  script:
    # --ignore-scripts skips the telemetry install script of @scarf/scarf, among others
    - npm ci --ignore-scripts --no-audit --no-fund --loglevel=error --prefix api/portal-backend
    - api/portal-backend/node_modules/.bin/spectral lint openapi.generated.yaml
      --ruleset api/portal-backend/.spectral.yaml
      --fail-severity warn
      -f text -o.text spectral-report.txt
      -f gitlab -o.gitlab gl-code-quality-report.json
      || SPECTRAL_EXIT=$?
    # The gitlab formatter of Spectral writes zero-based lines; Code Quality expects one-based lines
    - |
      [ -s gl-code-quality-report.json ] && node -e '
        const fs = require("fs"); const file = "gl-code-quality-report.json"
        const issues = JSON.parse(fs.readFileSync(file))
        for (const { location } of issues) { location.positions.begin.line++; location.positions.end.line++ }
        fs.writeFileSync(file, JSON.stringify(issues))'
      if [ -n "$SPECTRAL_EXIT" ]; then
        cat spectral-report.txt || true
        [ "$SPECTRAL_EXIT" = 1 ] && [ -s gl-code-quality-report.json ] && exit 3
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - spectral-report.txt
    reports:
      codequality: gl-code-quality-report.json

# Compares the export with the committed file and, on a difference, opens or refreshes a merge
# request from a bot branch, the way Renovate does. See .gitlab/ci/scripts/update-openapi-spec.mjs.
#
# Requires OPENAPI_BOT_TOKEN: a Project Access Token of its own with the api and write_repository
# scopes and the Developer role, stored as a masked and protected CI/CD variable that is scoped to
# the environment openapi-spec-update, so that no other job receives it. The job fails
# when the variable is not set, also when the spec has not changed, so a missing token shows up
# on the first develop pipeline and not only on the next API change.
update-openapi-spec:
  image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  stage: report
  interruptible: false
  # Two develop pipelines must not force-push the bot branch at the same time
  resource_group: openapi-spec-update
  environment:
    name: openapi-spec-update
    action: access
  needs:
    - job: export-openapi-spec
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    GIT_DEPTH: 1
  before_script:
    - apk add --no-cache git
  script:
    - node .gitlab/ci/scripts/update-openapi-spec.mjs
