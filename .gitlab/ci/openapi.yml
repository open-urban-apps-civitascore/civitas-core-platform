# Keeps api/portal-backend/openapi.yaml in sync with the description the running backend serves.
#
# The export is made by api-test-backend (artifact openapi.generated.yaml), from the stack that the
# Bruno tests run against. It was the job export-openapi-spec, which started a second stack.

# Compares the export with the committed file and, on a difference, opens or refreshes a merge
# request from a bot branch, the way Renovate does. See .gitlab/ci/scripts/update-openapi-spec.mjs.
#
# Requires OPENAPI_BOT_TOKEN: a Project Access Token of its own with the api and write_repository
# scopes and the Developer role, stored as a masked and protected CI/CD variable. The job fails
# when the variable is not set, also when the spec has not changed, so a missing token shows up
# on the first develop pipeline and not only on the next API change.
update-openapi-spec:
  image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  stage: report
  interruptible: false
  # Two develop pipelines must not force-push the bot branch at the same time
  resource_group: openapi-spec-update
  needs:
    - job: api-test-backend
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    # TODO: testing: the job is available on merge requests but manual, because it pushes the bot
    # branch ci/openapi-spec-update and opens or refreshes a merge request against develop from
    # whatever the checkout holds. Remove this rule to restore the develop-only behaviour.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    GIT_DEPTH: 1
  before_script:
    - apk add --no-cache git
  script:
    - node .gitlab/ci/scripts/update-openapi-spec.mjs
