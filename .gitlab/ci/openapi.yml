# Keeps api/portal-backend/openapi.yaml in sync with the description the running backend serves.

# Starts the portal-backend with only the services it needs to boot (postgres-portal, Kafka,
# Keycloak) and exports the springdoc description as the artifact openapi.generated.yaml.
# This job is separate from api-test-backend, so the export does not wait for the Bruno run,
# a failed Bruno test does not stop the export, and a failed export does not stop the tests.
export-openapi-spec:
  rules:
    - !reference [.only-backend-changes, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/openapi.yml
  image: docker:27
  stage: test
  needs:
    - job: build-backend
      artifacts: true
      optional: true
  services:
    - name: docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    # The spec is hosted as documentation, where the CI-internal Keycloak host points nowhere.
    # example.org is reserved for examples (RFC 2606), so these URLs are obviously not real.
    OPENAPI_OAUTH_SERVER_URL: https://auth.example.org
  script:
    - export COMPOSE_FILES="-f dev-environment/ci/docker-compose.api-test.yml"
    - |
      if ls portal-backend/target/*.jar >/dev/null 2>&1; then
        echo "Portal-backend JAR found — building from source"
        export COMPOSE_FILES="$COMPOSE_FILES -f dev-environment/ci/docker-compose.api-test.build-portal.yml"
      else
        echo "Portal-backend JAR not available — using registry image"
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
      fi
    # Naming the service starts it with its depends_on chain only, not the full api-test stack
    - |
      docker compose -p openapi-export $COMPOSE_FILES up -d --build --wait --wait-timeout 600 portal-backend || {
        docker compose -p openapi-export $COMPOSE_FILES ps -a
        docker compose -p openapi-export $COMPOSE_FILES logs --tail=100 --no-color portal-backend
        exit 1
      }
    # The `local` profile of the stack permits /api-docs.yaml without a token
    - docker compose -p openapi-export $COMPOSE_FILES exec -T portal-backend curl -sf http://localhost:8089/v1/api-docs.yaml > openapi.generated.yaml
    # Fail when the override did not reach the backend, instead of committing the internal host
    - grep -q "$OPENAPI_OAUTH_SERVER_URL/realms/" openapi.generated.yaml
  artifacts:
    when: on_success
    paths:
      - openapi.generated.yaml
    expire_in: 30 days

# Compares the export with the committed file. Direct pushes to develop are not allowed, so it
# works the way Renovate does: on a difference it pushes the new file to a bot branch and opens
# a merge request against develop, or refreshes the one already open.
#
# Requires OPENAPI_BOT_TOKEN: a Project Access Token of its own with the api and write_repository
# scopes and the Developer role, stored as a masked and protected CI/CD variable. The job fails
# when the variable is not set, also when the spec has not changed, so a missing token shows up
# on the first develop pipeline and not only on the next API change.
update-openapi-spec:
  image: alpine:3
  stage: report
  # Two develop pipelines must not force-push the bot branch at the same time
  resource_group: openapi-spec-update
  needs:
    - job: export-openapi-spec
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    GIT_DEPTH: 1
    SPEC_PATH: api/portal-backend/openapi.yaml
    BOT_BRANCH: ci/openapi-spec-update
  before_script:
    - apk add --no-cache git curl jq >/dev/null
  script:
    - |
      if [ -z "$OPENAPI_BOT_TOKEN" ]; then
        echo "OPENAPI_BOT_TOKEN is not set — cannot push the bot branch or open a merge request."
        exit 1
      fi
      TOKEN="$OPENAPI_BOT_TOKEN"
      if [ ! -s openapi.generated.yaml ]; then
        echo "openapi.generated.yaml is missing or empty — export-openapi-spec did not export the spec."
        exit 1
      fi
      if [ -f "$SPEC_PATH" ] && cmp -s "$SPEC_PATH" openapi.generated.yaml; then
        echo "$SPEC_PATH matches the running backend — nothing to do."
        exit 0
      fi
      REPO_URL="https://oauth2:${TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      MR_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"

      # Skip the push when the bot branch already carries exactly this spec, so a develop pipeline
      # that changes nothing about the API does not add a commit to the open merge request.
      if git fetch --depth 1 "$REPO_URL" "refs/heads/$BOT_BRANCH" 2>/dev/null \
         && git show "FETCH_HEAD:$SPEC_PATH" 2>/dev/null | cmp -s - openapi.generated.yaml; then
        echo "Bot branch $BOT_BRANCH already carries this spec."
      else
        cp openapi.generated.yaml "$SPEC_PATH"
        git config user.name "CIVITAS CI"
        git config user.email "noreply@${CI_SERVER_HOST}"
        git checkout -q -B "$BOT_BRANCH"
        git add "$SPEC_PATH"
        git commit -q -m "chore(api): sync openapi.yaml with the backend on develop

      Exported by pipeline $CI_PIPELINE_ID from $CI_COMMIT_SHORT_SHA."
        git push -q --force "$REPO_URL" "HEAD:refs/heads/$BOT_BRANCH"
        echo "Pushed $BOT_BRANCH."
      fi

      # Open a merge request unless one for the bot branch is already open (it picks up the push).
      OPEN_COUNT=$(curl -sSf --header "PRIVATE-TOKEN: $TOKEN" \
        "$MR_API?state=opened&source_branch=$BOT_BRANCH&target_branch=develop" | jq length)
      if [ "${OPEN_COUNT:-0}" -gt 0 ]; then
        echo "Merge request for $BOT_BRANCH is already open — branch updated."
        exit 0
      fi
      DESCRIPTION="Automated update of \`$SPEC_PATH\`.

      The file is the OpenAPI description exported from the backend built in pipeline $CI_PIPELINE_URL (develop @ $CI_COMMIT_SHORT_SHA) and differs from the committed copy. Do not edit it by hand — merge to bring the repository in line with the running code, or fix the backend and let the next develop pipeline refresh this merge request."
      curl -sSf --header "PRIVATE-TOKEN: $TOKEN" -X POST "$MR_API" \
        --data-urlencode "source_branch=$BOT_BRANCH" \
        --data-urlencode "target_branch=develop" \
        --data-urlencode "title=chore(api): sync openapi.yaml with the backend" \
        --data-urlencode "description=$DESCRIPTION" \
        --data "remove_source_branch=true" \
        | jq -r '"Opened merge request " + .web_url'
