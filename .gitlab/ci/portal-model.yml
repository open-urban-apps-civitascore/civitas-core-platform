# Hidden job that defines rules for portal-model changes
# All portal-model jobs should extend this
#
# authz and portal-backend compile against the artifact of build-portal-model, so the job has to exist
# in every pipeline where one of its consumers exists: these rules are the union of the rules of
# the consumers (the API test stack, portal-backend, authz, model-forge) and of portal-model itself.
.only-portal-model-changes:
  rules:
    - !reference [.api-test-stack-changes, rules]
    - !reference [.only-backend-changes, rules]
    - !reference [.only-authz-changes, rules]
    - !reference [.only-model-forge-changes, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-model/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/portal-model.yml

# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-portal-model:
  extends: .maven-portal-model
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: lint
  needs:
    - job: setup-version
      artifacts: true
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd portal-model
    # Only generate dependency tree, no compilation needed
    - mvn $MAVEN_CLI_OPTS dependency:tree -Drevision=$PORTAL_MODEL_VERSION -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - portal-model/maven.graph.json

# Format check, build, unit tests and the dependency check in one job. The artifact carries the
# installed portal-model, so authz and portal-backend compile against the portal-model of this
# pipeline and not against a copy from the registry. The release gate is in publish-portal-model.
build-portal-model:
  extends:
    - .only-portal-model-changes
    - .maven-portal-model
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: build-package
  needs:
    - job: setup-version
      artifacts: true
  cache:
    policy: pull-push
    when: always
  before_script:
    # Keeps the cache from carrying every version ever built; the module is reinstalled below
    - rm -rf $CI_PROJECT_DIR/.m2/repository/de/civitascore
  script:
    - cd portal-model
    - mvn $MAVEN_CLI_OPTS spotless:check install -Drevision=$PORTAL_MODEL_VERSION || BUILD_FAILED=1
    # Unused or undeclared dependencies. It runs after a failed test too, so one pipeline shows both
    # results; the job fails if either failed.
    - mvn $MAVEN_CLI_OPTS dependency:analyze -Drevision=$PORTAL_MODEL_VERSION -DfailOnWarning=true -DignoreNonCompile=false || DEPENDENCIES_FAILED=1
    - test -z "$BUILD_FAILED$DEPENDENCIES_FAILED"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-model/target/surefire-reports/
      # authz and portal-backend resolve portal-model from here
      - .m2/repository/de/civitascore/portal-model/$PORTAL_MODEL_VERSION/
    reports:
      junit: portal-model/target/surefire-reports/TEST-*.xml

# The release gate: the Maven registry gets portal-model only from a commit on a protected branch
# whose build and tests passed. Merge requests do not publish; their consumers use the artifact of
# build-portal-model.
publish-portal-model:
  extends:
    - .rules-protected
    - .maven-portal-model
  image: maven:3.9.16-eclipse-temurin-25-alpine
  stage: deploy-package
  interruptible: false
  needs:
    - job: setup-version
      artifacts: true
    - job: build-portal-model
      artifacts: false
  script:
    - cd portal-model
    - |
      mvn $MAVEN_CLI_OPTS deploy -DskipTests -DskipITs -Drevision=$PORTAL_MODEL_VERSION \
        -Dspotless.check.skip=true \
        -DaltDeploymentRepository=gitlab-maven::default::${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven \
        -s ci_settings.xml
