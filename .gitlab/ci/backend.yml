# Hidden job that defines rules for backend changes
# All backend jobs should extend this
.only-backend-changes:
  rules:
    - !reference [.rules-protected, rules]
    # Run on MR only when backend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-backend/**/*
        - portal-model/**/* # Backend depends on portal-model, so run when model changes too
        - model-forge/**/* # Backend depends on model-forge, so run when it changes too
        - authz/rego/data/backends/portal_backend/data.json # The backend route parity test reads it
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/backend.yml
        - .gitlab/ci/portal-model.yml # Also run when portal-model changes since backend depends on it
        - .gitlab/ci/model-forge.yml # Also run when model-forge changes since backend depends on it
        - .gitlab/ci/openapi.yml
        - api/portal-backend/.spectral.yaml
        - api/portal-backend/package*.json

# portal-backend compiles against portal-model, model-forge and config-adapter as they are built in
# this pipeline: the jobs below need the artifacts of build-portal-model, build-model-forge and
# build-config-adapter (the installed Maven artifacts, see those jobs) and resolve them from the
# local repository. No Maven settings with the registry are used, so a job neither waits for a
# publish job nor for the registry (it had stalls of over 2 minutes on maven-metadata.xml).
# A release version is published only from a protected branch, by the publish-* jobs after the
# tests of the component passed; build-backend-image waits for those tests too.
.backend-dependencies:
  needs:
    - job: setup-version
      artifacts: true
    - job: build-portal-model
      artifacts: true
    - job: build-model-forge
      artifacts: true
    - job: build-config-adapter
      artifacts: true
  before_script:
    - export MVN_VERSIONS="-Dportal-model.version=$PORTAL_MODEL_VERSION -Dmodel-forge.version=$MODEL_FORGE_VERSION -Dconfig-adapter.version=$CONFIG_ADAPTER_VERSION"
    - cd portal-backend


# Generate maven dependency graph JSON for license scanning
# This must always run (needs: []) to ensure dependency scanning has the graph
# even when the build job is skipped due to no changes
generate-graph-backend:
  extends: .maven-backend
  image: maven:3.9.16-eclipse-temurin-25-alpine@sha256:781f1da87cd3d142e66e47cc149c4582a652fb7f574648206d1e956170c0dc90
  stage: lint
  needs: []
  rules:
    - !reference [.rules-all, rules]
  script:
    - cd portal-backend
    # Only generate dependency tree, no compilation needed
    - mvn $MAVEN_CLI_OPTS dependency:tree -DoutputType=json -DoutputFile=maven.graph.json -DappendOutput=false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - portal-backend/maven.graph.json

check-migrations-backend:
  rules:
    - !reference [.only-backend-changes, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/check-migrations.mjs
  image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  stage: lint
  needs: []
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --quiet --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        node .gitlab/ci/scripts/check-migrations.mjs FETCH_HEAD
      else
        node .gitlab/ci/scripts/check-migrations.mjs
      fi

test-backend:
  extends:
    - .only-backend-changes
    - .maven-backend
  image: maven:3.9.16-eclipse-temurin-25-alpine@sha256:781f1da87cd3d142e66e47cc149c4582a652fb7f574648206d1e956170c0dc90
  stage: test
  needs:
    - !reference [.backend-dependencies, needs]
    - job: build-backend
      artifacts: true
  cache:
    policy: pull-push
    when: always
  before_script:
    - !reference [.backend-dependencies, before_script]
  after_script:
    # This job pushes the cache. It must not carry the components of this pipeline into it.
    - rm -rf $CI_PROJECT_DIR/.m2/repository/de/civitascore $CI_PROJECT_DIR/.m2/repository/de/civitas-core
  script:
    # The classes and test classes come from build-backend; this job only runs the tests
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent surefire:test jacoco:report $MVN_VERSIONS || TESTS_FAILED=1
    # Unused or undeclared dependencies (this was the job dependency-prune-backend). It runs after a failed
    # test too, so one pipeline shows both results; the job fails if either failed.
    - mvn $MAVEN_CLI_OPTS dependency:analyze-only $MVN_VERSIONS -DfailOnWarning=true -DignoreNonCompile=false || DEPENDENCIES_FAILED=1
    - test -z "$TESTS_FAILED$DEPENDENCIES_FAILED"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/classes/
      - portal-backend/target/surefire-reports/
      - portal-backend/target/site/jacoco/
      - portal-backend/target/jacoco.exec
    reports:
      junit: portal-backend/target/surefire-reports/TEST-*.xml

integration-test-backend:
  extends:
    - .only-backend-changes
    - .dind
    - .maven-backend
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: test
  timeout: 1h
  needs:
    - !reference [.backend-dependencies, needs]
    - job: build-backend
      artifacts: true
  before_script:
    - !reference [.backend-dependencies, before_script]
  script:
    # The classes come from build-backend. Run integration tests only. Saga-tagged tests are excluded via pom.xml (run in saga-e2e-test-backend)
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent-integration failsafe:integration-test failsafe:verify jacoco:report-integration -Dspotless.skip=true $MVN_VERSIONS
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/failsafe-reports/
      - portal-backend/target/site/jacoco-it/
      - portal-backend/target/jacoco-it.exec
      - portal-backend/target/undocumented-answers.txt
    reports:
      junit: portal-backend/target/failsafe-reports/TEST-*.xml

# Saga E2E integration tests — cross-module tests validating the full dataset saga workflow
# (portal-backend + Flowable saga engine in-process, with real FROST, Kafka, Redpanda Connect —
#  pipeline-engine migration to NiFi still pending, see WI 1622).
saga-e2e-test-backend:
  extends:
    - .dind
    - .maven-backend
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: test
  timeout: 1h
  needs:
    - !reference [.backend-dependencies, needs]
    - job: build-backend
      artifacts: true
  rules:
    - !reference [.rules-protected, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-backend/**/*
        - portal-model/**/*
        - model-forge/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/docker.yml
        - .gitlab/ci/maven.yml
        - .gitlab/ci/rules.yml
        - .gitlab/ci/scripts/api-test-stack.sh
        - .gitlab/ci/backend.yml

  before_script:
    - !reference [.backend-dependencies, before_script]
  script:
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:prepare-agent-integration failsafe:integration-test failsafe:verify jacoco:report-integration -Dspotless.skip=true $MVN_VERSIONS -Psaga -Dfailsafe.rerunFailingTestsCount=1 -Djacoco.destFile=target/jacoco-saga.exec
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/failsafe-reports/
      - portal-backend/target/jacoco-saga.exec
    reports:
      junit: portal-backend/target/failsafe-reports/TEST-*.xml

# Bruno API tests: start a real backend stack (PostgreSQL, Keycloak, Kafka, APISIX, OPA, NiFi, FROST,
# GeoServer stub, portal-backend, config-adapter, authz) with Docker Compose and run the full Bruno
# CLI collection against it. Validates the HTTP API contract from the outside, complementing the
# Maven-based unit and integration tests. The stack comes from .gitlab/ci/scripts/api-test-stack.sh,
# which e2e-test-frontend uses as well.
api-test-backend:
  tags:
    - saas-linux-medium-amd64 # 4 cores, 16 GB memory
  extends:
    - .api-test-stack-changes
    - .docker-cli
    - .dind
  stage: test # runs after build jobs provide JAR artifacts
  timeout: 1h
  needs:
    - job: build-backend
      artifacts: true
      optional: true
    - job: build-config-adapter
      artifacts: true
      optional: true
    - job: build-authz
      artifacts: true
      optional: true
    - job: build-nifi-nars
      artifacts: true
  script:
    - . .gitlab/ci/scripts/api-test-stack.sh
    - api_test_up
    # Run Bruno API tests from a container on the same Compose network
    - docker run -d --name bruno-runner --network $API_TEST_NETWORK node:22.23.3-alpine sleep infinity
    - docker cp api/portal-backend/bruno-api/. bruno-runner:/tests/
    # The NiFi + GeoServer adapters are wired into the CI stack, so the dataset-saga Bruno
    # lifecycles run as the end-to-end acceptance gate.
    # TODO: bake the Bruno CLI into an image instead of installing it on every run, and run the
    # folders that share no state in parallel (see TEST-CONSOLIDATION-PLAN.md, C6).
    - |
      set +e
      docker exec bruno-runner sh -c '
        npm install -g @usebruno/cli@'"$BRUNO_CLI_VERSION"' 2>/dev/null
        cd /tests
        npx @usebruno/cli run --env ci --exclude-tags payload-example > /tests/bruno-output.txt 2>&1
        RESULT=$?
        cat /tests/bruno-output.txt
        exit $RESULT
      '
      BRUNO_EXIT=$?
      set -e
      docker cp bruno-runner:/tests/bruno-output.txt bruno-results.txt || true
      # On bruno failure, dump service logs so we can diagnose 500s etc.
      if [ "$BRUNO_EXIT" != "0" ]; then
        api_test_collect_logs
      fi
      exit ${BRUNO_EXIT:-0}
  after_script:
    - docker rm -f bruno-runner 2>/dev/null || true
    - . .gitlab/ci/scripts/api-test-stack.sh
    - api_test_down
  artifacts:
    when: always
    paths:
      - bruno-results.txt
      - portal-backend-logs.txt
      - config-adapter-logs.txt
      - connection-tester-logs.txt
      - keycloak-logs.txt
      - kafka-logs.txt
      - apisix-logs.txt
      - frost-logs.txt
      - nifi-logs.txt
      - wiremock-logs.txt
    expire_in: 30 days

report-test-backend:
  extends:
    - .only-backend-changes
    - .maven-backend
  image: maven:3.9.16-eclipse-temurin-25@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
  stage: test
  # The execution data and target/classes of the test jobs are all that the merge and the report need.
  # The saga job is optional because its rules are narrower than the rules of this job.
  needs:
    - job: test-backend
    - job: integration-test-backend
    - job: saga-e2e-test-backend
      optional: true
  before_script:
    - cd portal-backend
  script:
    - mvn $MAVEN_CLI_OPTS jacoco:merge jacoco:report
    - cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' || true
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/site/jacoco/
    reports:
      coverage_report:
        coverage_format: jacoco
        path: portal-backend/target/site/jacoco/jacoco.xml

build-backend:
  extends:
    - .maven-backend
  # The API test stack runs the jar of this pipeline, so it is built wherever that stack runs.
  rules:
    - !reference [.api-test-stack-changes, rules]
    - !reference [.only-backend-changes, rules]
  image: maven:3.9.16-eclipse-temurin-25-alpine@sha256:781f1da87cd3d142e66e47cc149c4582a652fb7f574648206d1e956170c0dc90
  stage: build
  needs: !reference [.backend-dependencies, needs]
  before_script:
    - !reference [.backend-dependencies, before_script]
  script:
    # Format check (this was the job lint-backend), then the jar
    - |
      mvn $MAVEN_CLI_OPTS spotless:check package -DskipTests $MVN_VERSIONS
  artifacts:
    when: on_success
    paths:
      - portal-backend/target/*.jar
      # The test jobs run on these and do not compile again
      - portal-backend/target/classes/
      - portal-backend/target/test-classes/
    expire_in: 1 month

build-backend-image:
  extends:
    - .only-backend-changes
    - .docker-build
  stage: publish
  interruptible: false
  timeout: 1h
  needs:
    - job: setup-version
      artifacts: true
    - job: build-backend
      artifacts: true
    - job: test-backend
    - job: integration-test-backend
    # The jar carries portal-model, model-forge and config-adapter. Where this pipeline tests them,
    # the image waits for those tests and checks, as the publish jobs do.
    - job: build-portal-model
      artifacts: false
    - job: test-model-forge
      artifacts: false
      optional: true
    - job: static-analysis-model-forge
      artifacts: false
      optional: true
    - job: test-config-adapter
      artifacts: false
      optional: true
    - job: static-analysis-config-adapter
      artifacts: false
      optional: true
    - job: integration-test-config-adapter
      artifacts: false
      optional: true
  script:
    - cd portal-backend
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/backend-portal:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --provenance=false \
        --push \
        .

container-scan-backend:
  extends:
    - .only-backend-changes
    - .container-scan
  needs:
    - job: setup-version
      artifacts: true
    - job: build-backend-image
  variables:
    IMAGE_NAME: backend-portal
    SBOM_PATH: portal-backend/target/portal-backend-image.cdx.json

deploy-backend:
  extends:
    - .only-backend-changes
    - .deploy-image
  resource_group: deploy-backend-$CI_COMMIT_REF_SLUG
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-backend
    - job: api-test-backend
      optional: true
      artifacts: false
  variables:
    IMAGE_NAME: backend-portal
