# Hidden job that defines rules for backend changes
# All backend jobs should extend this
.only-backend-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when backend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-backend/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/backend.yml

lint-backend:
  extends: .only-backend-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: backend-maven
      files:
        - portal-backend/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-backend
    - mvn spotless:check

dependency-prune-backend:
  extends: .only-backend-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: lint
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: backend-maven
      files:
        - portal-backend/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-backend
    - mvn $MAVEN_CLI_OPTS -B dependency:analyze -DfailOnWarning=true -DignoreNonCompile=false -DignoredDependencies=org.springframework.boot:*,org.springframework.security:*,org.springframework:*,jakarta.*,org.springdoc:*,org.slf4j:*
  allow_failure:
    exit_codes:
      - 1

test-backend:
  extends: .only-backend-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: test
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: backend-maven
      files:
        - portal-backend/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-backend
    # Unit tests use Maven cache, no need for published artifacts yet
    - mvn $MAVEN_CLI_OPTS clean org.jacoco:jacoco-maven-plugin:prepare-agent test jacoco:report -s ci_settings.xml
    # To print coverage, picked up by coverage regex
    - cat target/site/jacoco/index.html| grep -o '<tfoot>.*</tfoot>'
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/surefire-reports/
      - portal-backend/target/site/jacoco/
    reports:
      junit: portal-backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: portal-backend/target/site/jacoco/jacoco.xml

sbom-backend:
  extends: .only-backend-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: qa
  needs: []
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: backend-maven
      files:
        - portal-backend/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-backend
    - mvn $MAVEN_CLI_OPTS -B cyclonedx:makeAggregateBom -DskipTests
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-backend/target/portal-backend.cdx.json
    reports:
      cyclonedx: portal-backend/target/portal-backend.cdx.json

build-backend:
  extends: .only-backend-changes
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: build
  needs:
    - job: 'lint-backend'
    - job: 'dependency-prune-backend'
    - job: 'test-backend'
    - job: 'secret_detection'
    - job: 'gitlab-advanced-sast'
    - job: 'dependency-scanning'
    - job: 'publish-config-adapter'
      optional: true  # Optional because config-adapter might not have changed
  variables:
    MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository'
  cache:
    key:
      prefix: backend-maven
      files:
        - portal-backend/pom.xml
    paths:
      - .m2/repository
  script:
    - cd portal-backend
    # Use GitLab Maven repository for config-adapter dependencies
    - |
      mvn package -DskipTests -s ci_settings.xml
  artifacts:
    when: on_success
    paths:
      - portal-backend/target/*.jar
    expire_in: 1 month

build-backend-image:
  extends: .only-backend-changes
  image: docker:27-dind
  stage: build
  needs: ['build-backend']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-backend
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/backend-portal:${IMAGE_TAG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-backend:
  extends: .only-backend-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: [""]
  stage: container-qa
  needs: ['build-backend-image']
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export IMAGE_TAG=$(git describe --tags --always)
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/backend-portal:${IMAGE_TAG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-backend:
  extends: .only-backend-changes
  image: docker:27-dind
  stage: deploy
  needs: ['container-scan-backend']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export IMAGE_TAG=$(git describe --tags --always)
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/backend-portal:${IMAGE_TAG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/backend-portal:$IMAGE_TAG
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true

sbom-backend-image:
  extends: .only-backend-changes
  image: docker:27-dind
  stage: report
  needs: ['deploy-backend']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-backend
    - mkdir -p target
    - export IMAGE_TAG=$(git describe --tags --always)
    - syft registry:$CI_REGISTRY_IMAGE/backend-portal:$IMAGE_TAG -o cyclonedx-json > target/portal-backend-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
    - portal-backend/target/portal-backend-image.cdx.json
    reports:
      cyclonedx: portal-backend/target/portal-backend-image.cdx.json
