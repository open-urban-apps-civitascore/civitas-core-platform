# Hidden job that defines rules for frontend changes
# All frontend jobs should extend this
.only-frontend-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when frontend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-frontend/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/frontend.yml

lint-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: lint
  needs: []
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
    # Required because pipeline is included into main pipeline
    # See https://gitlab.com/remcohaszing/eslint-formatter-gitlab/-/issues/13
    ESLINT_CODE_QUALITY_REPORT: $CI_PROJECT_DIR/portal-frontend/eslint-report.json
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - echo "[]" > eslint-report.json

    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile

    - |
      pnpm eslint . \
        --max-warnings=0 \
        --format gitlab
  artifacts:
    when: always
    paths: [$ESLINT_CODE_QUALITY_REPORT]
    expire_in: 1 month
    reports:
      codequality: $ESLINT_CODE_QUALITY_REPORT

test-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: test
  needs: []
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm run test:coverage
  coverage: '/All files(?:[^|]*\|){4}\s*(\S+)/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/coverage/
      - portal-frontend/test-results/
    reports:
      junit: portal-frontend/test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: portal-frontend/coverage/cobertura-coverage.xml

build-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: build
  needs: ['lint-frontend', 'test-frontend', 'secret_detection', 'gitlab-advanced-sast', 'dependency-scanning']
  variables:
    NODE_ENV: production
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    when: on_success
    paths:
      - portal-frontend/.next/
    expire_in: 1 month

deploy-frontend:
  extends: .only-frontend-changes
  image: docker:27-dind
  stage: deploy
  needs: ['build-frontend']
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-frontend
    - |
      export IMAGE_TAG=$(git describe --tags --always)
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $CI_REGISTRY_IMAGE/frontend-portal:$IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true
