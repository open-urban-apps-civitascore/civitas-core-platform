# Hidden job that defines rules for frontend changes
# All frontend jobs should extend this
.only-frontend-changes:
  rules:
    # Always run on tags
    - if: $CI_COMMIT_TAG
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR only when frontend files change
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - portal-frontend/**/*
        - .gitlab-ci.yml
        - .gitlab/ci/frontend.yml

lint-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: lint
  needs: []
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
    # Required because pipeline is included into main pipeline
    # See https://gitlab.com/remcohaszing/eslint-formatter-gitlab/-/issues/13
    ESLINT_CODE_QUALITY_REPORT: $CI_PROJECT_DIR/portal-frontend/eslint-report.json
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - echo "[]" > eslint-report.json

    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile

    - |
      pnpm eslint . \
        --max-warnings=0 \
        --format gitlab
  artifacts:
    when: always
    paths: [$ESLINT_CODE_QUALITY_REPORT]
    expire_in: 1 month
    reports:
      codequality: $ESLINT_CODE_QUALITY_REPORT

dependency-prune-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: lint
  needs: []
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm dlx depcheck --json --ignore-dev > depcheck-report.json || true
    - node scripts/check-dependencies.cjs depcheck-report.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/depcheck-report.json

test-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: test
  needs: []
  variables:
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm run test:coverage
  coverage: '/All files(?:[^|]*\|){4}\s*(\S+)/'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/coverage/
      - portal-frontend/test-results/
    reports:
      junit: portal-frontend/test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: portal-frontend/coverage/cobertura-coverage.xml

build-frontend:
  extends: .only-frontend-changes
  image: node:22
  stage: build
  needs: ['lint-frontend', 'dependency-prune-frontend']
  variables:
    NODE_ENV: production
    PNPM_STORE_DIR: $CI_PROJECT_DIR/portal-frontend/.pnpm-store
  cache:
    key:
      prefix: frontend-pnpm
      files:
        - portal-frontend/pnpm-lock.yaml
    paths:
      - portal-frontend/.pnpm-store
  script:
    - cd portal-frontend
    - set -euo pipefail
    - corepack enable >/dev/null 2>&1 || true
    - pnpm config set store-dir $PNPM_STORE_DIR
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    when: on_success
    paths:
      - portal-frontend/.next/
    expire_in: 1 month

build-frontend-image:
  extends: .only-frontend-changes
  image: docker:27-dind
  stage: publish
  needs:
    - job: setup-version
      artifacts: true
    - job: build-frontend
    - job: test-frontend
  services:
    - name: docker:27-dind
      command: ['--registry-mirror', 'https://docker-mirror01.extern.frachtwerk.de']
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - |
      cat > /tmp/buildkitd.toml <<'EOF'
      [registry."docker.io"]
        mirrors = ["docker-mirror01.extern.frachtwerk.de"]
      EOF
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch --config /tmp/buildkitd.toml buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-frontend
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/frontend-portal:${CI_COMMIT_REF_SLUG}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        .
  after_script:
    - docker buildx rm multiarch || true

container-scan-frontend:
  extends: .only-frontend-changes
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: setup-version
      artifacts: true
    - job: build-frontend-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/frontend-portal:${CI_COMMIT_REF_SLUG}-scan
    - trivy image --scanners vuln --format template --template "@gitlab.tpl" --output gl-container-scanning-report.json $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-frontend:
  extends: .only-frontend-changes
  image: docker:27-dind
  stage: deploy
  needs:
    - job: setup-version
      artifacts: true
    - job: container-scan-frontend
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/frontend-portal:${CI_COMMIT_REF_SLUG}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/frontend-portal:$REVISION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "staging" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        docker buildx imagetools create $CI_REGISTRY_IMAGE/frontend-portal:$REVISION --tag $CI_REGISTRY_IMAGE/frontend-portal:$CI_COMMIT_BRANCH
      fi

sbom-frontend-image:
  extends: .only-frontend-changes
  image: docker:27-dind
  stage: report
  needs:
    - job: setup-version
      artifacts: true
    - job: deploy-frontend
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd portal-frontend
    - mkdir -p sbom
    - syft registry:$CI_REGISTRY_IMAGE/frontend-portal:$REVISION -o cyclonedx-json > sbom/portal-frontend-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - portal-frontend/sbom/portal-frontend-image.cdx.json
    # TODO: https://gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/-/issues/728
    # Fix license name resolution
    # reports:
    #   cyclonedx: portal-frontend/sbom/portal-frontend-image.cdx.json
