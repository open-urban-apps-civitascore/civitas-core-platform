# Renovate bot configuration validation
# Ensures renovate.json is valid before merging changes

validate-renovate-config:
  image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  stage: lint
  needs: []
  rules:
    # Always run on main and develop branch
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Run on MR when renovate config changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - renovate.json
        - .gitlab-ci.yml
        - .gitlab/ci/renovate.yml
  script:
    - npx --yes --package renovate -- renovate-config-validator
  allow_failure: false

# Renovate bot execution job
# Runs on schedule to check for dependency updates
# Requires:
#   1. RENOVATE_TOKEN variable (Project Access Token or Personal Access Token)
#      - Scopes needed: api, read_repository, write_repository
#      - Role needed: Developer or higher
#   2. Schedule variable: RENOVATE_ENABLED=true (set when creating the schedule)
renovate:
  image: renovate/renovate:39@sha256:f2209c61a9c3c8c74ac58eecb5f15ec43651f1ba694aa33493ff2062b90ff4d3
  stage: deploy
  needs: []
  rules:
    # Only run when explicitly enabled via schedule variable
    - if: $RENOVATE_ENABLED == "true"
  variables:
    RENOVATE_CONFIG_FILE: renovate.json
    LOG_LEVEL: info
  script:
    - renovate --platform gitlab --endpoint $CI_SERVER_URL/api/v4 $CI_PROJECT_PATH
  allow_failure: true
