name: frost_allinone
services:
  web:
    image: fraunhoferiosb/frost-server-http:2.7.3
    mem_limit: 1g
    platform: linux/amd64
    container_name: civitas-frost
    hostname: civitas-frost
    environment:
      # For all settings see: https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      - JAVA_TOOL_OPTIONS=-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60
      - serviceRootUrl=http://localhost:9080/FROST-Server/
      # Projects data model (project-scoped Things, Users, Roles) — ships in core since 2.7.0,
      # replacing the hylkevds/frost-http-projects fork. The plugin loads its bundled model
      # through the modelLoader plugin, which must be enabled too. Default fine-grained access
      # rules stay off — the dev stack runs FROST without authentication.
      - plugins_projects_enable=true
      - plugins_projects_enableDefaultRules=false
      - plugins_modelLoader_enable=true
      - plugins_multiDatastream_enable=false
      - plugins_actuation_enable=false
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://postgis-dev-env:5432/${FROST_DB_NAME:-sensorthings}
      - persistence_db_username=sensorthings
      - persistence_db_password=${FROST_DB_PASSWORD:-changeme-generate-a-strong-password}
      - persistence_autoUpdateDatabase=true
    expose:
      - "8080"
    ports:
      - 1883:1883
      - 8085:8080
    healthcheck:
      # FROST creates its schema during startup. Gate scoped-view creation on the API being ready.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/FROST-Server/v1.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - civitas-network


  # Create the scoped views and least-privilege role used by Trino's frost catalog.
  frost-migrations:
    image: postgres:18.1-alpine
    mem_limit: 256m
    container_name: civitas-frost-migrations
    restart: "no"
    environment:
      - FROST_DB_PASSWORD=${FROST_DB_PASSWORD:-changeme-generate-a-strong-password}
      - FROST_DB_NAME=${FROST_DB_NAME:-sensorthings}
      - FROST_TRINO_READER_PASSWORD=${FROST_TRINO_READER_PASSWORD:-dev-only-frost-trino-reader-password}
      - FROST_DB_MIGRATION_USER=${FROST_DB_MIGRATION_USER:-admin}
      - FROST_DB_MIGRATION_PASSWORD=${FROST_DB_MIGRATION_PASSWORD:-admin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        attempt=0
        until PGPASSWORD="$$FROST_DB_MIGRATION_PASSWORD" psql -v ON_ERROR_STOP=1 \
            -h postgis-dev-env -U "$$FROST_DB_MIGRATION_USER" -d "$$FROST_DB_NAME" \
            -v frost_trino_reader_password="$$FROST_TRINO_READER_PASSWORD" \
            -f /migrations/01-create-scoped-views.sql; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 10 ]; then
            echo "frost-migrations: giving up after $$attempt attempts" >&2
            exit 1
          fi
          echo "frost-migrations: attempt $$attempt failed, retrying in 3s..." >&2
          sleep 3
        done
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - civitas-network

networks:
  civitas-network:
    name: civitas-network
    external: true
