name: frost_allinone
services:
  web:
    #    image: fraunhoferiosb/frost-server:latest
    image: hylkevds/frost-http-projects:latest
    platform: linux/amd64
    container_name: civitas-frost
    hostname: civitas-frost
    environment:
      # For all settings see: https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      - serviceRootUrl=http://localhost:9080/FROST-Server/
      - plugins_modelLoader_enable=true
      - plugins_multiDatastream_enable=false
      - plugins_actuation_enable=false
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://database:5432/sensorthings
      - persistence_db_username=sensorthings
      - persistence_db_password=${FROST_DB_PASSWORD}
      - persistence_autoUpdateDatabase=true
      - plugins_modelLoader_securityPath=
    expose:
      - "8080"
    ports:
      - 1883:1883
      - 8085:8080
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frost-network
      - civitas-network

  database:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    container_name: civitas-frost-db
    environment:
      - POSTGRES_DB=sensorthings
      - POSTGRES_USER=sensorthings
      - POSTGRES_PASSWORD=${FROST_DB_PASSWORD}
    volumes:
      - postgis_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sensorthings -U sensorthings "]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - frost-network

volumes:
    postgis_volume:

networks:
  frost-network:
    driver: bridge
  civitas-network:
    name: civitas-network
    external: true
