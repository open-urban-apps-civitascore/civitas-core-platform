services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.6
    container_name: civitas-etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - civitas-network

  apisix:
    image: apache/apisix:3.14.0-debian
    container_name: civitas-apisix
    restart: always
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9180:9180"
      - "9443:9443"
    networks:
      - civitas-network

networks:
  civitas-network:
    name: civitas-network
    driver: bridge
