# APISIX Routes with OPA Authorization
# M5: Full AuthZ integration - APISIX -> OPA -> AuthZ Repository
#
# Architecture:
#   - Plugin Config: Reusable auth+authz plugin bundle (openid-connect + opa)
#   - Services: Backend definitions with upstream config (portal-backend)
#   - Routes: Map URIs to services, reference plugin config for protection
#
# Request flow (protected routes):
#   1. openid-connect: Validates JWT, sets X-Userinfo header (base64 claims)
#   2. opa: Calls OPA for authorization decision (with_service=true sends service
#      metadata to OPA, so OPA knows which backend's permission mappings to use)
#   3. Request forwarded to backend if allowed (403 if denied)
#
# =============================================================================
# JWT VALIDATION NOTES
# =============================================================================
# APISIX discovers Keycloak via Docker DNS (civitas-keycloak:8080). Keycloak is
# configured with KC_HOSTNAME=localhost + KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true,
# so the discovery response reports issuer=localhost (matching browser tokens)
# but jwks_uri=civitas-keycloak (reachable from Docker). No /etc/hosts needed.

# =============================================================================
# SERVICES - Backend upstream definitions
# =============================================================================
# Each service represents a backend. The service name is the canonical backend
# identifier used by OPA for permission mapping dispatch.
#
# Convention: service name matches the permission mappings directory name
# (with dashes, OPA converts to underscores for data file lookup).
#   portal-backend -> data.backends.portal_backend.endpoints

services:
  - id: svc-portal-backend
    name: portal-backend
    desc: "Portal Backend API Service"
    upstream:
      type: roundrobin
      nodes:
        "portal-backend:8089": 1
      timeout:
        connect: 6
        send: 6
        read: 6

# =============================================================================
# PLUGIN CONFIGS - Reusable plugin bundles
# =============================================================================
# Every dataset route attaches plugin_config_id — routes are always protected (OIDC + OPA).
# Open data is an OPA per-request decision, not a route variant; there are no "public" routes.

plugin_configs:
  - id: 1
    desc: "Standard auth + authz (openid-connect + OPA)"
    plugins:
      # 0. Strip client-supplied identity headers BEFORE openid-connect runs. With
      # unauth_action: "pass", anonymous requests now reach OPA, and OPA's trust model keys
      # off X-Userinfo. Without this, a client could forge X-Userinfo (an arbitrary `sub`) and
      # impersonate a user. serverless-pre-function (priority 10000) runs in the rewrite phase
      # BEFORE openid-connect (priority 2599), so the forged headers are cleared first; openid-
      # connect then re-sets the real X-Userinfo for a validly authenticated request.
      serverless-pre-function:
        phase: rewrite
        functions:
          - "return function(conf, ctx) ngx.req.clear_header('X-Userinfo'); ngx.req.clear_header('X-Access-Token'); ngx.req.clear_header('X-Id-Token') end"

      # 1. JWT validation - validates a present token and sets X-Userinfo header.
      # unauth_action: "pass" lets ANONYMOUS requests continue to OPA instead of being
      # rejected with 401 here. OPA is the sole authorization gate: it denies protected
      # resources for anonymous callers (401/403) and allows reads of open-data datasets
      # (ABAC). A present bearer token is still validated via JWKS and its claims forwarded.
      #
      # NOTE: unauth_action: "pass" requires bearer_only: false (APISIX rejects
      # bearer_only: true + pass — it keeps blocking anonymous). bearer_only: false in turn
      # makes APISIX require a session.secret (schema), and the bearer token must be read
      # from the Authorization header (access_token_in_authorization_header). The session.secret
      # is NOT inert under bearer_only: false — it is a real authentication credential; see the
      # SECURITY note on the `secret` field below.
      openid-connect:
        client_id: "apisix-validator"
        client_secret: "unused-for-jwks-validation"
        discovery: "http://civitas-keycloak:8080/realms/civitas-core/.well-known/openid-configuration"
        bearer_only: false
        unauth_action: "pass"
        access_token_in_authorization_header: true
        session:
          # ⚠️ SECURITY: With bearer_only=false, openid-connect processes session cookies, so this is
          # a REAL authentication credential — anyone who knows it can mint trusted session state.
          # Therefore NO secret is committed: it is read from the OIDC_SESSION_SECRET environment
          # variable, with NO default. If the variable is unset, APISIX fails to start (it cannot
          # resolve ${{...}}) — secure-by-default, so this standalone config can never run with a
          # known/placeholder key. Inject a strong, non-shared value (CI seeds a per-run random one
          # via seed-routes.sh; production injects from a secret in civitas-core-deployment).
          secret: ${{OIDC_SESSION_SECRET}}
        use_jwks: true
        # DEV-ONLY: ssl_verify disabled for local HTTP Keycloak.
        # PRODUCTION MUST use ssl_verify: true — see the "Gateway Trust Model"
        # section in portal-backend/DEPLOYMENT.md (prod ssl_verify + F1 header
        # forward/strip + F2 backend NetworkPolicy isolation).
        ssl_verify: false
        # Pass decoded JWT claims to OPA via X-Userinfo header
        set_userinfo_header: true

      # 2. OPA authorization - calls OPA for permission decision
      # M5.5: send_headers_upstream passes OPA response headers to backend.
      # OPA returns X-Allowed-Scope-Ids for collection filtering and
      # X-Allowed-Pool-Ids for dataset datapool-union filtering (Epic 1).
      opa:
        host: "http://civitas-opa:8181"
        policy: "civitas/authz/decision"
        with_route: true
        with_service: true
        with_consumer: false
        send_headers_upstream:
          - "X-Allowed-Scope-Ids"
          - "X-Allowed-Pool-Ids"

      # 3. Strip client-supplied scope headers before OPA sets them.
      # APISIX forwards all client headers by default — without this, a
      # malicious client could send X-Allowed-Scope-Ids/X-Allowed-Pool-Ids and
      # bypass collection-level authorization filtering in the backend.
      #
      # NOTE: Saga-created dataset routes (managed by the APISIX adapter) define their own
      # route-level proxy-rewrite for path rewriting + FROST upstream auth. Per APISIX
      # plugin merging precedence (Route > PluginConfig), the route-level proxy-rewrite
      # fully overrides this one. The saga adapter mirrors the same strip list via the
      # APISIX_PROXY_REWRITE_HEADERS_REMOVE env var to preserve this behaviour on those
      # routes — keep the two lists in sync if you add headers here.
      proxy-rewrite:
        headers:
          remove:
            - "X-Allowed-Scope-Ids"
            - "X-Allowed-Pool-Ids"

      # 4. Request ID for tracing
      request-id:
        include_in_response: true

# =============================================================================
# ROUTES
# =============================================================================
#
# Routing (issue #1368):
#   - /v1/*                              → portal-backend management API catch-all
#                                           (static, below; host-agnostic — the frontend
#                                           reaches it on localhost:9080)
#   - api.<host>/v1/datasets/{id}/{slug} → FROST-Server (one route per named API, created
#                                           dynamically by the APISIX saga handler into etcd;
#                                           bound to the API vhost, more specific URI wins over /v1/*)
#
# For local dev add to /etc/hosts:
#   127.0.0.1  api.localhost
# (Chrome/Firefox resolve *.localhost automatically, curl/JDK-HttpClient need the entry.)

routes:
  # Protected management API catch-all - requires valid JWT and OPA authorization.
  # Host-agnostic: the frontend reaches it on localhost; on the API vhost the more
  # specific dynamic /v1/datasets/{id}/{slug} per-named-API routes take precedence.
  - id: portal-backend-api
    name: "Portal Backend API (AuthZ)"
    uri: /v1/*
    service_id: svc-portal-backend
    plugin_config_id: 1

#END
