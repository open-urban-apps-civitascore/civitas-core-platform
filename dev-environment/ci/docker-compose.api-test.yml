# ============================================================
# CIVITAS CORE Platform — CI: Bruno API Test Stack
# ============================================================
# Full, self-contained stack for running Bruno API tests
# in GitLab CI (Docker-in-Docker). No external network needed.
#
# Includes the complete APISIX gateway chain:
#   APISIX → openid-connect → OPA → proxy-rewrite → FROST
#
# Usage (from project root):
#   docker compose -p api-test -f dev-environment/ci/docker-compose.api-test.yml up -d --wait --wait-timeout 600
#   docker compose -p api-test -f dev-environment/ci/docker-compose.api-test.yml run --rm apisix-seed
#   <run Bruno tests>
# ============================================================

services:
  # ── Databases ──────────────────────────────────────────────

  postgres-portal:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18.1-alpine
        RUN echo "CREATE DATABASE flowable OWNER admin;" > /docker-entrypoint-initdb.d/20-flowable.sql
    environment:
      POSTGRES_DB: portal_backend
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d portal_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-keycloak:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-frost:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: sensorthings
      POSTGRES_USER: sensorthings
      POSTGRES_PASSWORD: frost-ci-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sensorthings -U sensorthings"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Dedicated PostGIS sink for the NiFi pipeline adapter (mirrors the dev `civitas-geoserver-db`).
  # The PostGIS saga handler provisions the typed sink table here; the deployed NiFi flow's
  # PutDatabaseRecord writes rows into it. The postgis image auto-creates the PostGIS extension in
  # the default database, so geometry columns work out of the box.
  postgres-sink:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: geosink
      POSTGRES_USER: geosink
      POSTGRES_PASSWORD: geosink
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d geosink -U geosink"]
      interval: 2s
      timeout: 2s
      retries: 10

  # ── Identity ───────────────────────────────────────────────

  keycloak:
    build:
      context: ../keycloak
      dockerfile_inline: |
        FROM quay.io/keycloak/keycloak:latest
        COPY realm-export.json /opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      default:
        aliases:
          - civitas-keycloak
    healthcheck:
      # Not just a TCP probe: require the civitas-core realm's discovery endpoint to return 200, so
      # 'depends_on: service_healthy' means the realm import has finished. Otherwise NiFi (which
      # fetches OIDC discovery at boot) can start against a not-yet-imported realm and 404. Uses only
      # shell builtins (/dev/tcp, read, case) — the Keycloak image has no curl/wget.
      test:
        - "CMD-SHELL"
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
          printf 'GET /realms/civitas-core/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r line <&3
          case "$$line" in *" 200"*) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ── Messaging ──────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── API Gateway ──────────────────────────────────────────

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_DATA_DIR: /etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  apisix:
    build:
      context: ../apisix/apisix_conf
      dockerfile_inline: |
        FROM apache/apisix:3.14.0-debian
        COPY config.yaml /usr/local/apisix/conf/config.yaml
        USER root
        RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
        USER apisix
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      default:
        aliases:
          # So containers in this network can resolve http://api.localhost:9080 natively and
          # the Host header matches the saga-provisioned route's hosts filter (issue #1368).
          - api.localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9180/apisix/admin/routes -H 'X-API-KEY: edd1c9f034335f136f87ad84b625c8f1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Authorization ────────────────────────────────────────

  authz-repository:
    # Default: pull from registry. Override with docker-compose.api-test.build.yml
    # to build from source when JAR artifacts are available.
    image: ${CI_REGISTRY_IMAGE}/authz-repo-service:${IMAGE_TAG:-develop}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-portal:5432/portal_backend
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: admin
      SERVER_PORT: 8091
    depends_on:
      postgres-portal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opa:
    build:
      # Build context = authz/rego so we can COPY policy files
      # (bind mounts don't work in DinD)
      context: ../../authz/rego
      dockerfile_inline: |
        FROM alpine:3 AS prep
        COPY policy /staging/policies
        COPY lib /staging/helpers
        COPY providers /staging/providers
        COPY data/backends /staging/data/backends
        # Null out all permission values for allow-all mode (CI only)
        RUN find /staging/data/backends -name '*.json' \
            -exec sed -i 's/: *"[A-Z][A-Z_]*"/: null/g; s/: *\[.*\]/: null/g' {} +
        RUN mkdir -p /staging/data/config && \
            printf '{"authz_repository_url":"http://authz-repository:8091/api/v1/user-context","dataset_pool_membership_url":"http://authz-repository:8091/api/v1/dataset-pool","authz_cache_duration_seconds":0}\n'\
            > /staging/data/config/config.json
        FROM openpolicyagent/opa:1.14.0-static
        COPY --from=prep /staging/policies /policies
        COPY --from=prep /staging/helpers /helpers
        COPY --from=prep /staging/providers /providers
        COPY --from=prep /staging/data /data
    environment:
      API_HOST: ${API_HOST:-api.localhost}
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--log-format=json"
      - "--set=decision_logs.console=true"
      - "/policies"
      - "/helpers"
      - "/providers"
      - "/data"
    depends_on:
      authz-repository:
        condition: service_healthy
    networks:
      default:
        aliases:
          - civitas-opa
    healthcheck:
      test: ["CMD", "/opa", "eval", "-f", "pretty", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── FROST SensorThings API ──────────────────────────────

  frost:
    image: hylkevds/frost-http-projects:latest
    platform: linux/amd64
    hostname: civitas-frost
    environment:
      - serviceRootUrl=http://apisix:9080/FROST-Server/
      - plugins_modelLoader_enable=true
      - plugins_multiDatastream_enable=false
      - plugins_actuation_enable=false
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://postgres-frost:5432/sensorthings
      - persistence_db_username=sensorthings
      - persistence_db_password=frost-ci-password
      - persistence_autoUpdateDatabase=true
      - plugins_modelLoader_securityPath=
    depends_on:
      postgres-frost:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/FROST-Server/v1.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Model Atlas ─────────────────────────────────────────

  apicurio-registry:
    image: apicurio/apicurio-registry:3.0.15
    environment:
      APICURIO_REST_DELETION_GROUP_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      APICURIO_REST_DELETION_ARTIFACT-VERSION_ENABLED: "true"
      APICURIO_REST_MUTABILITY_ARTIFACT_VERSION_CONTENT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/apis/registry/v3/system/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Data Pipelines ──────────────────────────────────────

  nifi:
    # Bake the PostgreSQL JDBC driver into the path the DBCP fragment loads it from
    # (/opt/nifi/drivers/postgresql.jar) so PostGIS-sink pipelines can deploy. Dev bind-mounts
    # ./drivers, but CI runs in Docker-in-Docker where host bind mounts don't work, so it is baked
    # into the image instead.
    build:
      context: ../nifi
      dockerfile_inline: |
        FROM apache/nifi:2.9.0
        USER root
        RUN mkdir -p /opt/nifi/drivers \
          && curl -fsSL -o /opt/nifi/drivers/postgresql.jar \
               https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar \
          && chown -R nifi:nifi /opt/nifi/drivers
        # AUTH=oidc needs an explicit keystore/truststore (single-user's auto-generation is gone).
        # Bake a throwaway self-signed pair; the config-adapter trusts all certs (NIFI_TLS_INSECURE).
        RUN mkdir -p /opt/nifi/certs \
          && keytool -genkeypair -alias nifi -keyalg RSA -keysize 2048 -validity 3650 \
               -dname CN=nifi -storetype PKCS12 -keystore /opt/nifi/certs/keystore.p12 \
               -storepass changeit -keypass changeit -ext SAN=dns:nifi,dns:localhost \
          && keytool -exportcert -alias nifi -keystore /opt/nifi/certs/keystore.p12 \
               -storepass changeit -rfc -file /opt/nifi/certs/nifi.crt \
          && keytool -importcert -alias nifi -keystore /opt/nifi/certs/truststore.p12 \
               -storetype PKCS12 -storepass changeit -noprompt -file /opt/nifi/certs/nifi.crt \
          && chown -R nifi:nifi /opt/nifi/certs
        USER nifi
    env_file:
     - ../nifi/.env.example
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      AUTH: "oidc"
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "nifi:8443"
      NIFI_SECURITY_USER_OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/civitas-core/.well-known/openid-configuration"
      NIFI_SECURITY_USER_OIDC_CLIENT_ID: "nifi"
      NIFI_SECURITY_USER_OIDC_CLIENT_SECRET: "${NIFI_OIDC_CLIENT_SECRET:-nifi-dev-secret}"
      # NiFi identifies a bearer token by its 'sub' claim (the service account's pinned Keycloak user
      # id), so the initial admin is that id; the config-adapter self-provisions root policies later.
      INITIAL_ADMIN_IDENTITY: "a11ce55a-0000-4000-8000-000000001838"
      KEYSTORE_PATH: "/opt/nifi/certs/keystore.p12"
      KEYSTORE_TYPE: "PKCS12"
      KEYSTORE_PASSWORD: "changeit"
      KEY_PASSWORD: "changeit"
      TRUSTSTORE_PATH: "/opt/nifi/certs/truststore.p12"
      TRUSTSTORE_TYPE: "PKCS12"
      TRUSTSTORE_PASSWORD: "changeit"
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          TOKEN=$$(curl -sf -X POST \
            -d "grant_type=client_credentials" \
            -d "client_id=nifi" \
            -d "client_secret=$$NIFI_SECURITY_USER_OIDC_CLIENT_SECRET" \
            http://keycloak:8080/realms/civitas-core/protocol/openid-connect/token \
            | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p') \
          && curl -k -sf -o /dev/null -H 'Host: nifi:8443' \
            -H "Authorization: Bearer $$TOKEN" \
            https://$$HOSTNAME:8443/nifi-api/flow/current-user
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s

  # ── Email (SMTP sink for Keycloak verification emails) ──

  mailpit:
    image: axllent/mailpit:v1.28
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8025/api/v1/messages"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── GeoServer Cloud (minimal: catalog REST for the PostGIS-sink saga) ─────
  # A POSTGIS sink triggers the saga's CREATE_WORKSPACE/CREATE_DATASTORE (GeoServer REST). Minimal
  # set for those catalog ops (rest needs no wfs/wms): geoserverdb (pgconfig) + rabbitmq + config +
  # discovery + gateway + restconfig. Mirrors dev-environment/geoserver/docker-compose.yaml,
  # single-network/ephemeral. Service names config/discovery/rabbitmq are load-bearing (images
  # resolve them by bare hostname); each image has a built-in :8081 healthcheck for `up --wait`.

  # pgconfig catalog DB for GeoServer Cloud — separate from postgres-sink (the DATA db the
  # datastore reads). The postgis image auto-creates the PostGIS extension.
  geoserverdb:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: geoserver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoserver -d geoserver"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.3-alpine
    tmpfs:
      - /var/lib/rabbitmq:size=256m,mode=1777
    healthcheck:
      test: rabbitmq-diagnostics is_running
      start_period: 10s
      interval: 15s
      timeout: 30s
      retries: 3

  config:
    image: geoservercloud/geoserver-cloud-config:2.28.3.0
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: v2.28.3.0
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_HOST: geoserverdb
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_PORT: 5432
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_DATABASE: geoserver
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_USERNAME: geoserver
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_PASSWORD: geoserver
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_SCHEMA: pgconfig
      SPRING_CLOUD_CONFIG_SERVER_OVERRIDES_PGCONFIG_INITIALIZE: "true"

  discovery:
    image: geoservercloud/geoserver-cloud-discovery:2.28.3.0
    depends_on:
      - config

  gateway:
    image: geoservercloud/geoserver-cloud-gateway:2.28.3.0
    environment:
      GEOSERVER_BASE_PATH: /geoserver
    depends_on:
      discovery:
        condition: service_healthy
    networks:
      default:
        aliases:
          - civitas-geoserver

  restconfig:
    image: geoservercloud/geoserver-cloud-rest:2.28.3.0
    environment:
      SPRING_PROFILES_ACTIVE: pgconfig
      GEOWEBCACHE_CACHE_DIR: /data/geowebcache
      PGCONFIG_HOST: geoserverdb
      PGCONFIG_PORT: 5432
      PGCONFIG_DATABASE: geoserver
      PGCONFIG_USERNAME: geoserver
      PGCONFIG_PASSWORD: geoserver
      PGCONFIG_SCHEMA: pgconfig
      PGCONFIG_INITIALIZE: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      geoserverdb:
        condition: service_healthy

  # ── Application ──────────────────────────────────────────

  portal-backend:
    # Default: pull from registry. Override with docker-compose.api-test.build-portal.yml
    # to build from source when JAR artifacts are available.
    image: ${CI_REGISTRY_IMAGE}/backend-portal:${IMAGE_TAG:-develop}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-portal:5432/portal_backend
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080
      KEYCLOAK_REALM: civitas-core
      KEYCLOAK_TARGET_REALM: civitas-core
      APP_URL: http://portal-backend:8089
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: local,postgres,init
      SPRING_KAFKA_PRODUCER_PROPERTIES_COMPRESSION_TYPE: lz4
    depends_on:
      postgres-portal:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/v1/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  config-adapter:
    # Default: pull from registry. Override with docker-compose.api-test.build.yml
    # to build from source when JAR artifacts are available.
    image: ${CI_REGISTRY_IMAGE}/config-adapter:${IMAGE_TAG:-develop}
    environment:
      HEALTHCHECK_PORT: 8088
      ADAPTERS: keycloak,apisix,frost
      EVENTHANDLER_NAME: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: config-adapter-group
      KAFKA_RETRY_MAX_ATTEMPTS: 3
      KAFKA_RETRY_INITIAL_BACKOFF_MS: 1000
      KAFKA_DLQ_TOPIC: de.civitascore.idm.dlq
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_USERNAME: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_TOPICS: de.civitascore.idm.user.created,de.civitascore.idm.user.updated,de.civitascore.idm.user.deleted,de.civitascore.idm.group.created,de.civitascore.idm.group.updated,de.civitascore.idm.group.deleted
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1
      # Public API host (issue #1368). The saga handler binds every dataset route to this
      # virtual host and reports the resulting publicUrl back to the portal-backend. The
      # APISIX service has `api.localhost` as a network alias so containers resolve the
      # publicUrl natively and its Host header matches the route's `hosts` filter.
      APISIX_API_HOST: api.localhost
      APISIX_API_PUBLIC_URL: http://api.localhost:9080
      APISIX_PLUGIN_CONFIG_ID: "1"
      APISIX_SERVICE_ID: svc-frost-server
      # Upstream for OWS (GeoServer) named-API routes. Points at a lightweight HTTP echo stub so an
      # anonymous OWS payload request can be proven to traverse APISIX → OIDC → OPA → OWS upstream
      # end-to-end (no real GeoServer needed; the OWS named API does not provision a workspace).
      APISIX_GEOSERVER_URL: http://geoserver-mock:8080/geoserver
      # Headers the saga's route-level proxy-rewrite must strip in lieu of plugin_config 1
      # (Route-over-PluginConfig precedence overrides plugin_config's proxy-rewrite).
      APISIX_PROXY_REWRITE_HEADERS_REMOVE: X-Allowed-Scope-Ids,X-Allowed-Pool-Ids
      # FROST upstream auth that APISIX forwards to private projects (mirrors FROST_* below).
      APISIX_FROST_API_KEY: dev-frost-api-key
      APISIX_FROST_API_KEY_HEADER: X-API-Key
      APISIX_TOPICS: de.civitascore.api.backend.created,de.civitascore.api.backend.updated,de.civitascore.api.backend.deleted
      FROST_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_PUBLIC_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_API_KEY: dev-frost-api-key
      FROST_API_KEY_HEADER: X-API-Key
      FROST_TOPICS: de.civitascore.data.thing.created,de.civitascore.data.thing.updated,de.civitascore.data.thing.deleted,de.civitascore.data.location.created,de.civitascore.data.location.updated,de.civitascore.data.location.deleted,de.civitascore.data.sensor.created,de.civitascore.data.sensor.updated,de.civitascore.data.sensor.deleted,de.civitascore.data.observedproperty.created,de.civitascore.data.observedproperty.updated,de.civitascore.data.observedproperty.deleted,de.civitascore.data.datastream.created,de.civitascore.data.datastream.updated,de.civitascore.data.datastream.deleted
      NIFI_URL: https://nifi:8443
      # config-adapter authenticates to NiFi via the OIDC client-credentials grant (Keycloak).
      NIFI_OIDC_TOKEN_URI: http://keycloak:8080/realms/civitas-core/protocol/openid-connect/token
      NIFI_OIDC_CLIENT_ID: nifi
      NIFI_OIDC_CLIENT_SECRET: ${NIFI_OIDC_CLIENT_SECRET:-nifi-dev-secret}
      NIFI_TLS_INSECURE: "true"
      # Master key for decrypting datasource credentials (e.g. a SQL source DB password). Must match
      # the portal-backend key (application-local.yaml, loaded via SPRING_PROFILES_ACTIVE=local).
      CIVITAS_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # FROST SensorThings base URL the NiFi pipeline adapter posts observations to.
      NIFI_FROST_URL: http://civitas-frost:8080/FROST-Server/v1.1
      NIFI_TOPICS: de.civitascore.data.pipeline.created,de.civitascore.data.pipeline.updated,de.civitascore.data.pipeline.deleted
      # PostGIS sink (mirrors dev): the NiFi adapter's platform DBCP (PutDatabaseRecord target) and
      # the PostGIS saga handler's DDL connection both point at the dedicated geo sink DB.
      NIFI_POSTGIS_URL: jdbc:postgresql://postgres-sink:5432/geosink
      NIFI_POSTGIS_USER: geosink
      NIFI_POSTGIS_PASSWORD: geosink
      POSTGIS_JDBC_URL: jdbc:postgresql://postgres-sink:5432/geosink
      POSTGIS_JDBC_USER: geosink
      POSTGIS_JDBC_PASSWORD: geosink
      FLOWABLE_JDBC_URL: jdbc:postgresql://postgres-portal:5432/flowable
      FLOWABLE_JDBC_USERNAME: admin
      FLOWABLE_JDBC_PASSWORD: admin
      # GeoServer Cloud REST (via the gateway): the dataset saga runs CREATE_WORKSPACE /
      # CREATE_DATASTORE for any POSTGIS sink. The datastore points GeoServer at the
      # postgres-sink data DB (the same DB the NiFi flow writes to).
      GEOSERVER_URL: http://civitas-geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_POSTGIS_HOST: postgres-sink
      GEOSERVER_POSTGIS_PORT: 5432
      GEOSERVER_POSTGIS_DATABASE: geosink
      GEOSERVER_POSTGIS_USER: geosink
      GEOSERVER_POSTGIS_PASSWORD: geosink
    depends_on:
      # Flowable's JDBC URL targets postgres-portal — wait until it is healthy before boot.
      postgres-portal:
        condition: service_healthy
      # The PostGIS saga handler opens its DDL connection at init — wait for the sink DB.
      postgres-sink:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # The saga's GeoServer steps hit the gateway → rest service; wait for both healthy.
      gateway:
        condition: service_healthy
      restconfig:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── OWS upstream stub: stands in for GeoServer so an OWS named-API route has a reachable upstream.
  # Echoes any request with 200, which is all the anonymous-OWS open-data e2e (9g4) needs to prove the
  # request traverses APISIX → OIDC → OPA → OWS upstream. Not a real GeoServer (none is provisioned by
  # an OWS named API; workspace provisioning is tied to GeoSinks, not named-API routing).
  geoserver-mock:
    image: mendhak/http-https-echo:34
    environment:
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── APISIX Route Seeding (one-shot, run via: docker compose run --rm apisix-seed)
  apisix-seed:
    profiles: [seed]
    build:
      context: ../apisix
      dockerfile_inline: |
        FROM alpine:3
        RUN apk add --no-cache curl bash
        COPY seed-routes.sh /seed-routes.sh
        RUN chmod +x /seed-routes.sh
    entrypoint: ["bash", "/seed-routes.sh", "--allowall"]
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1

networks:
  default:
    name: api-test-net
