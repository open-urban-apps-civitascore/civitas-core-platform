# Build override: config-adapter and the connection test (built from source)
services:
  config-adapter:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
    environment:
      FLOWABLE_JDBC_URL: jdbc:postgresql://postgis-dev-env:5432/flowable
      FLOWABLE_JDBC_USERNAME: admin
      FLOWABLE_JDBC_PASSWORD: admin
  connection-tester:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
