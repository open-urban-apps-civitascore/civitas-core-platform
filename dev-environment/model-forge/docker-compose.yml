services:
  postgres:
    image: postgres:15
    container_name: model-forge-admin-postgres
    environment:
      POSTGRES_DB: model_forge_admin
      POSTGRES_USER: model_forge
      POSTGRES_PASSWORD: model_forge
    ports:
      # Host port 5433, not 5432: the main dev-environment Postgres (portal-backend's
      # database, see ../postgres/docker-compose.yml) already binds 5432. This compose is
      # meant to run alongside that stack for the combined local demo (see local-demo.md),
      # so the admin-ui's own Postgres gets a distinct host port. Point the admin-ui at it
      # via SPRING_DATASOURCE_URL — see local-demo.md.
      - "5433:5432"
    volumes:
      - model_forge_admin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_forge -d model_forge_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  model_forge_admin_data:
