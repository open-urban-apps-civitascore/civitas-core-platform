name: geoserver

x-variables:
  environment: &common_env
    SPRING_PROFILES_ACTIVE: "standalone,pgconfig"
    GEOWEBCACHE_CACHE_DIR: /data/geowebcache
    # pgconfig catalog backend — every service reads it directly, which is what the
    # standalone profile means: no service discovery and no config server
    PGCONFIG_HOST: geoserverdb
    PGCONFIG_PORT: 5432
    PGCONFIG_DATABASE: geoserver
    PGCONFIG_USERNAME: geoserver
    PGCONFIG_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
    PGCONFIG_SCHEMA: pgconfig
    PGCONFIG_INITIALIZE: true
    # RabbitMQ — Spring Cloud Bus for catalog-change event propagation between
    # microservices (restconfig → wfs/wms/etc. cache invalidation)
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: guest
    SPRING_RABBITMQ_PASSWORD: guest
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: guest
    RABBITMQ_PASSWORD: guest

x-gs-dependencies: &gs-dependencies
  rabbitmq:
    condition: service_healthy
  geoserverdb:
    condition: service_started

volumes:
  geowebcache_data:
  geoserverdb_data:

services:
  geoserverdb:
    image: imresamu/postgis:17-3.5
    container_name: civitas-geoserver-db
    hostname: civitas-geoserver-db
    shm_size: 2g
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - geoserverdb_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    networks:
      - geoserver-internal
      # The NiFi PostGIS sink (PutDatabaseRecord in deployed pipelines) writes into this
      # database and reaches it by container name over civitas-network.
      - civitas-network

  rabbitmq:
    image: rabbitmq:4.1.3-alpine
    user: "1000:1000"
    restart: unless-stopped
    tmpfs:
      - /var/lib/rabbitmq:size=512m,mode=1777
    healthcheck:
      test: rabbitmq-diagnostics is_running
      start_period: 10s
      interval: 15s
      timeout: 30s
      retries: 3
    networks:
      - geoserver-internal

  # Single entry point routing to all GeoServer microservices.
  # Named civitas-geoserver so APISIX can reach it via Docker network
  # at civitas-geoserver:8080 (see setup-apisix-route.sh).
  gateway:
    image: geoservercloud/geoserver-cloud-gateway:3.0.1.1
    user: "1000:1000"
    container_name: civitas-geoserver
    hostname: civitas-geoserver
    # Carries the shared configuration, so it waits for the same services every other one does.
    depends_on: *gs-dependencies
    environment:
      <<: *common_env
      GEOSERVER_BASE_PATH: /geoserver
    ports:
      - "8082:8080"
    networks:
      - geoserver-internal
      - civitas-network

  # Base template for all GeoServer microservices (replicas: 0 = not started directly)
  geoserver_template:
    image: geoservercloud/geoserver-cloud-webui:3.0.1.1
    user: "1000:1000"
    environment:
      <<: *common_env
    volumes:
      - geowebcache_data:/data/geowebcache
    deploy:
      mode: replicated
      replicas: 0
    networks:
      - geoserver-internal

  wfs:
    image: geoservercloud/geoserver-cloud-wfs:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wms:
    image: geoservercloud/geoserver-cloud-wms:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wcs:
    image: geoservercloud/geoserver-cloud-wcs:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wps:
    image: geoservercloud/geoserver-cloud-wps:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  restconfig:
    image: geoservercloud/geoserver-cloud-rest:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  webui:
    image: geoservercloud/geoserver-cloud-webui:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  gwc:
    image: geoservercloud/geoserver-cloud-gwc:3.0.1.1
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

networks:
  geoserver-internal:
    driver: bridge
  civitas-network:
    name: civitas-network
    external: true
