name: geoserver

x-variables:
  environment: &common_env
    SPRING_PROFILES_ACTIVE: "standalone,pgconfig"
    GEOWEBCACHE_CACHE_DIR: /data/geowebcache
    # pgconfig catalog backend — every service reads it directly, which is what the
    # standalone profile means: no service discovery and no config server
    PGCONFIG_HOST: geoserverdb
    PGCONFIG_PORT: 5432
    PGCONFIG_DATABASE: geoserver
    PGCONFIG_USERNAME: geoserver
    PGCONFIG_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
    PGCONFIG_SCHEMA: pgconfig
    PGCONFIG_INITIALIZE: true
    # RabbitMQ — Spring Cloud Bus for catalog-change event propagation between
    # microservices (restconfig → wfs/wms/etc. cache invalidation). RABBITMQ_HOST/USER/PASSWORD
    # feed the same settings one level up and would be redundant beside these
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: guest
    SPRING_RABBITMQ_PASSWORD: guest
    # Diagnostics — the images ship every endpoint exposed and their values unmasked, which
    # publishes the catalog and broker passwords to anything that can reach the service
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_EXCLUDE: "env,configprops,shutdown,heapdump"
    MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES: NEVER
    MANAGEMENT_ENDPOINT_CONFIGPROPS_SHOW_VALUES: NEVER
    # Concurrent-request caps, matching what the wms service applies to itself by default. The
    # doubled $$ keeps the placeholder for the image to resolve instead of compose consuming it
    GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_WMS: "$${cpu.cores} * 8"
    GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_WMS_GETMAP: "$${cpu.cores} * 4"

x-gs-dependencies: &gs-dependencies
  rabbitmq:
    condition: service_healthy
  geoserverdb:
    # Healthy, not started — every service opens its catalog connection during startup
    condition: service_healthy

volumes:
  geowebcache_data:
  geoserverdb_data:

services:
  geoserverdb:
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    container_name: civitas-geoserver-db
    hostname: civitas-geoserver-db
    shm_size: 2g
    environment:
      POSTGRES_DB: geoserver
      POSTGRES_USER: geoserver
      POSTGRES_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - geoserverdb_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    networks:
      - geoserver-internal
      # The NiFi PostGIS sink (PutDatabaseRecord in deployed pipelines) writes into this
      # database and reaches it by container name over civitas-network.
      - civitas-network

  rabbitmq:
    image: rabbitmq:4.1.3-alpine
    user: "1000:1000"
    restart: unless-stopped
    tmpfs:
      - /var/lib/rabbitmq:size=512m,mode=1777
    healthcheck:
      test: rabbitmq-diagnostics is_running
      start_period: 10s
      interval: 15s
      timeout: 30s
      retries: 3
    networks:
      - geoserver-internal

  # Single entry point routing to all GeoServer microservices.
  # Named civitas-geoserver so APISIX can reach it via Docker network
  # at civitas-geoserver:8080 (see setup-apisix-route.sh).
  gateway:
    image: geoservercloud/geoserver-cloud-gateway:3.0.1.1@sha256:de0b20bd2a4393bac7b9923e63f6e03611648bd749834434f170e9bfc9c0e47d
    user: "1000:1000"
    container_name: civitas-geoserver
    hostname: civitas-geoserver
    # Carries the shared configuration, so it waits for the same services every other one does.
    depends_on: *gs-dependencies
    environment:
      <<: *common_env
      GEOSERVER_BASE_PATH: /geoserver
    ports:
      - "8082:8080"
    networks:
      - geoserver-internal
      - civitas-network

  # Base template for all GeoServer microservices (replicas: 0 = not started directly)
  geoserver_template:
    image: geoservercloud/geoserver-cloud-webui:3.0.1.1@sha256:4f91e3048ac894a476a1e84c2a018d2fb8e9d933fb88d1a6556386bdc2bf1bde
    user: "1000:1000"
    environment:
      <<: *common_env
    volumes:
      - geowebcache_data:/data/geowebcache
    deploy:
      mode: replicated
      replicas: 0
    networks:
      - geoserver-internal

  wfs:
    image: geoservercloud/geoserver-cloud-wfs:3.0.1.1@sha256:299f0d6232d1aa7a94afce0394fa8d5465e03b3f890b445c7876a62d55259ddc
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wms:
    image: geoservercloud/geoserver-cloud-wms:3.0.1.1@sha256:5164f687ce4d853690802e304022ce540e4f0144a08e88d63112fa2da84fa1f7
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wcs:
    image: geoservercloud/geoserver-cloud-wcs:3.0.1.1@sha256:4f077124f59154ba60b110466776cd4bd2aafabf7738a26e958b8c92d4af376d
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wps:
    image: geoservercloud/geoserver-cloud-wps:3.0.1.1@sha256:0b41bd2c9a76cc0bc9e7f21294472026597c41dd1a0b1bac1aa758b9c6ed53fb
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  restconfig:
    image: geoservercloud/geoserver-cloud-rest:3.0.1.1@sha256:318254b52f967de74ffbef8efcf1f7d8cf81035e6b8145ea5d42d6e8a65fd301
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  webui:
    image: geoservercloud/geoserver-cloud-webui:3.0.1.1@sha256:4f91e3048ac894a476a1e84c2a018d2fb8e9d933fb88d1a6556386bdc2bf1bde
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    environment:
      <<: *common_env
      # The image switches request throttling off on this service, on the assumption that it
      # serves no map requests — it does answer them, so the caps above need it back on. Setting
      # the caps alone does not re-enable it.
      GEOSERVER_EXTENSION_CONTROLFLOW_ENABLED: true
    deploy:
      replicas: 1

  gwc:
    image: geoservercloud/geoserver-cloud-gwc:3.0.1.1@sha256:b04ed89b5d2b0ce41cc50dabe0250dcdf1368b6c65f9ad81bc239695700fe794
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

networks:
  geoserver-internal:
    driver: bridge
  civitas-network:
    name: civitas-network
    external: true
