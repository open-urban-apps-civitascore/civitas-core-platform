name: geoserver

x-variables:
  environment: &common_env
    SPRING_PROFILES_ACTIVE: "standalone,pgconfig"
    GEOWEBCACHE_CACHE_DIR: /data/geowebcache
    # pgconfig catalog backend — every service reads it directly, which is what the
    # standalone profile means: no service discovery and no config server
    PGCONFIG_HOST: postgis-dev-env
    PGCONFIG_PORT: 5432
    PGCONFIG_DATABASE: ${GEOSERVER_DB_NAME:-geoserver}
    PGCONFIG_USERNAME: geoserver
    PGCONFIG_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
    PGCONFIG_SCHEMA: pgconfig
    PGCONFIG_INITIALIZE: true
    # RabbitMQ — Spring Cloud Bus for catalog-change event propagation between
    # microservices (restconfig → wfs/wms/etc. cache invalidation). RABBITMQ_HOST/USER/PASSWORD
    # feed the same settings one level up and would be redundant beside these
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: 5672
    SPRING_RABBITMQ_USERNAME: guest
    SPRING_RABBITMQ_PASSWORD: guest
    # Diagnostics — the images ship every endpoint exposed and their values unmasked, which
    # publishes the catalog and broker passwords to anything that can reach the service
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_EXCLUDE: "env,configprops,shutdown,heapdump"
    MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES: NEVER
    MANAGEMENT_ENDPOINT_CONFIGPROPS_SHOW_VALUES: NEVER
    # Concurrent-request caps, matching what the wms service applies to itself by default. The
    # doubled $$ keeps the placeholder for the image to resolve instead of compose consuming it
    GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_WMS: "$${cpu.cores} * 8"
    GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_WMS_GETMAP: "$${cpu.cores} * 4"
    # GeoServer Cloud 3.0.1.1 includes preview classes compiled for Java 25.
    JAVA_TOOL_OPTIONS: "--enable-preview -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60"

x-gs-dependencies: &gs-dependencies
  rabbitmq:
    condition: service_healthy

volumes:
  geowebcache_data:

services:
  rabbitmq:
    image: rabbitmq:4.4.0-alpine@sha256:42a204b8f401d2c19583db83bbad250273954d216a1e5c0e6a0f6b0185bc0b03
    mem_limit: 512m
    user: "1000:1000"
    restart: unless-stopped
    tmpfs:
      - /var/lib/rabbitmq:size=512m,mode=1777
    healthcheck:
      test: rabbitmq-diagnostics is_running
      start_period: 10s
      interval: 15s
      timeout: 30s
      retries: 3
    networks:
      - geoserver-internal
      - civitas-network

  # Single entry point routing to all GeoServer microservices.
  # Named civitas-geoserver so APISIX can reach it via Docker network
  # at civitas-geoserver:8080 (see setup-apisix-route.sh).
  gateway:
    image: geoservercloud/geoserver-cloud-gateway:3.0.2.1@sha256:eb13f3bf2a43cb4a0a3b21351b1ceacedd45034694e8ac8a5f99df6aa777611f
    mem_limit: 512m
    user: "1000:1000"
    container_name: civitas-geoserver
    hostname: civitas-geoserver
    # Carries the shared configuration, so it waits for the same services every other one does.
    depends_on: *gs-dependencies
    environment:
      <<: *common_env
      GEOSERVER_BASE_PATH: /geoserver
    ports:
      - "8082:8080"
    networks:
      - geoserver-internal
      - civitas-network

  # Base template for all GeoServer microservices (replicas: 0 = not started directly)
  geoserver_template:
    image: geoservercloud/geoserver-cloud-webui:3.0.2.1@sha256:ca00ed6b2a58cbc34dc13a0a05ff1c827a0f1d1fe5f1881fdd36d9a69d17fd4f
    mem_limit: 512m
    user: "1000:1000"
    environment:
      <<: *common_env
    volumes:
      - geowebcache_data:/data/geowebcache
    deploy:
      mode: replicated
      replicas: 0
    networks:
      - geoserver-internal
      - civitas-network

  wfs:
    image: geoservercloud/geoserver-cloud-wfs:3.0.2.1@sha256:fa5d12a62d005f36d3bb7ab1c69aa4d4b148752ebcd88ac74fe0cece02a20c56
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wms:
    image: geoservercloud/geoserver-cloud-wms:3.0.2.1@sha256:d26a39865de3dc433be20cf495aa95e45f9e55840f1c3bfed7df470533fb3ac2
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wcs:
    image: geoservercloud/geoserver-cloud-wcs:3.0.2.1@sha256:8bd37fa2ab54858c5e84ce6a51c65aa0e62086fc2921be5cee4beb374a65c856
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  wps:
    image: geoservercloud/geoserver-cloud-wps:3.0.2.1@sha256:d781d8bd1285243e27cb55a39fdda1b780df5888a47cce5bbee0f5c532a1a55d
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  restconfig:
    image: geoservercloud/geoserver-cloud-rest:3.0.2.1@sha256:65500566571f16af5f2cc0e7b0bb97fcff64af284cf8f6638496d67c55f47025
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

  webui:
    image: geoservercloud/geoserver-cloud-webui:3.0.2.1@sha256:ca00ed6b2a58cbc34dc13a0a05ff1c827a0f1d1fe5f1881fdd36d9a69d17fd4f
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    environment:
      <<: *common_env
      # The image switches request throttling off on this service, on the assumption that it
      # serves no map requests — it does answer them, so the caps above need it back on. Setting
      # the caps alone does not re-enable it.
      GEOSERVER_EXTENSION_CONTROLFLOW_ENABLED: true
    deploy:
      replicas: 1

  gwc:
    image: geoservercloud/geoserver-cloud-gwc:3.0.2.1@sha256:f551d1e0dcae9ab57f13eb5aed5dc77d830fe8f8e2ac2696c1f86b6d82cb02db
    extends:
      service: geoserver_template
    depends_on: *gs-dependencies
    deploy:
      replicas: 1

networks:
  geoserver-internal:
    driver: bridge
  civitas-network:
    name: civitas-network
    external: true
