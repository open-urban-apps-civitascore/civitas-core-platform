services:
  postgres-keycloak:
    image: postgres:18.1-alpine
    container_name: civitas-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: civitas-keycloak
    hostname: civitas-keycloak.local
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
      # Force issuer to localhost so browser-issued JWTs match what APISIX expects.
      # Without this, Keycloak mirrors the request hostname into the issuer claim,
      # causing a mismatch between browser (localhost) and APISIX (civitas-keycloak).
      # Override KC_HOSTNAME for VM/remote access: export KC_HOSTNAME=http://<vm-ip>:8080
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Local SMTP sink for Keycloak email verification.
  # When a user is created via the portal, Keycloak sends an action email
  # (verify email + set password). Mailpit catches these emails locally
  # so they can be inspected at http://localhost:8025.
  # The realm-export.json configures Keycloak SMTP to point to mailpit:1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: civitas-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - civitas-network

volumes:
  postgres_keycloak_data:
  keycloak_data:

networks:
  civitas-network:
    name: civitas-network
    external: true
