# ============================================================
# CIVITAS CORE Platform - Application Services (Dev Mode)
# ============================================================
# Builds and runs config-adapter and portal-backend as Docker
# containers for the "auto" startup mode in start-portal-dev.sh.
#
# These services connect to the infrastructure already running
# on civitas-network (Kafka, PostgreSQL, Keycloak, APISIX, etc.)
# ============================================================

services:
  config-adapter:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
    mem_limit: 640m
    container_name: civitas-config-adapter
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65"
      SERVER_PORT: 8088
      HEALTHCHECK_PORT: 8088
      ADAPTERS: keycloak,apisix,frost
      EVENTHANDLER_NAME: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: config-adapter-group
      KAFKA_RETRY_MAX_ATTEMPTS: 3
      KAFKA_RETRY_INITIAL_BACKOFF_MS: 1000
      KAFKA_DLQ_TOPIC: de.civitascore.idm.dlq
      # Flowable saga engine — dedicated database on the portal PostgreSQL
      # (provisioned by dev-environment/postgres/docker-compose.yml).
      FLOWABLE_JDBC_URL: jdbc:postgresql://postgis-dev-env:5432/flowable
      FLOWABLE_JDBC_USERNAME: admin
      FLOWABLE_JDBC_PASSWORD: admin
      KEYCLOAK_URL: http://civitas-keycloak:8080
      KEYCLOAK_REALM: master
      KEYCLOAK_USERNAME: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_CLIENT_ID: admin-cli
      KEYCLOAK_TOPICS: de.civitascore.idm.user.created,de.civitascore.idm.user.updated,de.civitascore.idm.user.deleted,de.civitascore.idm.group.created,de.civitascore.idm.group.updated,de.civitascore.idm.group.deleted
      KEYCLOAK_INVITATION_CLIENT_ID: portal-frontend
      KEYCLOAK_INVITATION_REDIRECT_URI: http://localhost:3000/
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1
      APISIX_GATEWAY_URL: http://apisix:9080
      # Required (issue #1368). api.localhost needs an /etc/hosts entry on the host.
      APISIX_API_HOST: api.localhost
      APISIX_API_PUBLIC_URL: http://api.localhost:9080
      APISIX_PLUGIN_CONFIG_ID: "1"
      APISIX_SERVICE_ID: svc-frost-server
      # Headers the saga's route-level proxy-rewrite must strip in lieu of plugin_config 1
      # (Route-over-PluginConfig precedence overrides plugin_config's proxy-rewrite).
      APISIX_PROXY_REWRITE_HEADERS_REMOVE: X-Allowed-Scope-Ids,X-Allowed-Pool-Ids
      # FROST upstream auth APISIX injects when proxying private dataset routes.
      APISIX_FROST_API_KEY: dev-frost-api-key
      APISIX_FROST_API_KEY_HEADER: X-API-Key
      # Gateway-reachable GeoServer base for OWS (map services) named-API routes.
      APISIX_GEOSERVER_URL: http://civitas-geoserver:8080/geoserver
      APISIX_TOPICS: de.civitascore.api.backend.created,de.civitascore.api.backend.updated,de.civitascore.api.backend.deleted
      FROST_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_PUBLIC_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_API_KEY: dev-frost-api-key
      FROST_API_KEY_HEADER: X-API-Key
      FROST_TOPICS: de.civitascore.data.thing.created,de.civitascore.data.thing.updated,de.civitascore.data.thing.deleted,de.civitascore.data.location.created,de.civitascore.data.location.updated,de.civitascore.data.location.deleted,de.civitascore.data.sensor.created,de.civitascore.data.sensor.updated,de.civitascore.data.sensor.deleted,de.civitascore.data.observedproperty.created,de.civitascore.data.observedproperty.updated,de.civitascore.data.observedproperty.deleted,de.civitascore.data.datastream.created,de.civitascore.data.datastream.updated,de.civitascore.data.datastream.deleted
      NIFI_URL: https://civitas-nifi:8443
      # config-adapter authenticates to NiFi via the OIDC client-credentials grant (Keycloak).
      NIFI_OIDC_TOKEN_URI: http://civitas-keycloak:8080/realms/civitas-core/protocol/openid-connect/token
      NIFI_OIDC_CLIENT_ID: nifi
      NIFI_OIDC_CLIENT_SECRET: ${NIFI_OIDC_CLIENT_SECRET:-nifi-dev-secret}
      NIFI_TLS_INSECURE: "true"
      NIFI_FROST_URL: http://civitas-frost:8080/FROST-Server/v1.1
      # PostGIS sink connection (read by bindPlatformDbcp); points at the same DB GeoServer/PostGIS use
      NIFI_POSTGIS_URL: jdbc:postgresql://postgis-dev-env:5432/geoserver
      NIFI_POSTGIS_USER: geoserver
      NIFI_POSTGIS_PASSWORD: geoserver
      GEOSERVER_URL: http://civitas-geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_POSTGIS_HOST: postgis-dev-env
      GEOSERVER_POSTGIS_PORT: 5432
      GEOSERVER_POSTGIS_DATABASE: geoserver
      GEOSERVER_POSTGIS_USER: geoserver
      GEOSERVER_POSTGIS_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
      # PostGIS adapter DDL connection — same database the GeoServer datastore reads
      POSTGIS_JDBC_URL: jdbc:postgresql://postgis-dev-env:5432/geoserver
      POSTGIS_JDBC_USER: geoserver
      POSTGIS_TRINO_READER_ROLE: ${GEOSERVER_POSTGIS_USER:-geoserver}
      POSTGIS_JDBC_PASSWORD: ${GEOSERVER_DB_PASSWORD:-geoserver}
      # Use Superset's container address. localhost:8088 is the adapter itself in this service.
      SUPERSET_URL: http://civitas-superset:8088
      # Use the dedicated local Superset service account for saga API calls. Superset forwards
      # the authenticated username to Trino, where OPA allows this identity for provisioning.
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_SERVICE_USERNAME:-civitas-config-adapter}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-dev-only-civitas-superset-service-password}
      # The Superset adapter owns the CORE database connection. It reconciles it by name
      # and resolves the Superset ID instead of relying on a generated numeric ID.
      SUPERSET_TRINO_DATABASE_NAME: ${SUPERSET_TRINO_DATABASE_NAME:-CORE}
      SUPERSET_TRINO_URL: ${SUPERSET_TRINO_URL:-https://civitas-trino:8446}
      SUPERSET_TRINO_USERNAME: ${TRINO_SUPERSET_SERVICE_USER:-superset_trino}
      SUPERSET_TRINO_PASSWORD: ${TRINO_SUPERSET_SERVICE_PASSWORD:-dev-only-civitas-trino-superset-password}
      SUPERSET_TRINO_CATALOG: ${SUPERSET_TRINO_CATALOG:-geodata}
      SUPERSET_TRINO_SCHEMA: ${SUPERSET_TRINO_SCHEMA:-information_schema}
      SUPERSET_TRINO_HTTP_SCHEME: ${SUPERSET_TRINO_HTTP_SCHEME:-https}
      SUPERSET_TRINO_TLS_VERIFY: ${SUPERSET_TRINO_TLS_VERIFY:-false}
      # Dev master key for decrypting ENC(...) credentials at deploy time; must match
      # portal-backend's civitas.master-key.
      CIVITAS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    networks:
      - civitas-network
      # geoserver-internal (the GeoServer stack's internal network) intentionally removed: it is NOT
      # created by the dev-environment stack (the GeoServer compose lives elsewhere), and declaring it
      # as external made `docker compose up` fail whenever GeoServer is not running — e.g. the modeling
      # subset. config-adapter reaches the shared PostGIS server over civitas-network in full mode; re-add
      # this network only if a PostGIS/GeoServer deploy proves it needs the GeoServer stack's own network.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # Data source connection test: the config-adapter image with its own main class.
  connection-tester:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
    container_name: civitas-connection-tester
    restart: unless-stopped
    command: ["sh", "-c", "exec java $$JAVA_OPTS -cp /civitas/config-adapter.jar de.civitascore.configadapter.application.ConnectionTestApplication"]
    environment:
      HEALTHCHECK_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Must match portal-backend's civitas.master-key.
      CIVITAS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  portal-backend:
    build:
      context: ../../portal-backend
      dockerfile: Dockerfile
    mem_limit: 1g
    container_name: civitas-portal-backend
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis-dev-env:5432/portal_backend
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://civitas-keycloak:8080
      KEYCLOAK_ISSUER_URI: ${KC_HOSTNAME:-http://localhost:8080}
      KEYCLOAK_REALM: civitas-core
      KEYCLOAK_TARGET_REALM: civitas-core
      # Disable enforced TOTP/OTP setup for local development
      KEYCLOAK_ENFORCE_OTP: "false"
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: local,postgres,init
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/v1/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Generous grace: on arm64 hosts the amd64-pinned base runs under emulation and
      # portal-backend (Spring Boot + Flowable) is slow to start. On amd64 it becomes
      # healthy quickly, so this upper bound has no effect there.
      start_period: 300s

  portal-frontend:
    build:
      context: ../../portal-frontend
      dockerfile: ../dev-environment/apps/Dockerfile.frontend
    mem_limit: 768m
    container_name: civitas-portal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:8092}
      # Auth.js (NextAuth v5) runs behind the container host; without trusting the host it
      # rejects the auth routes with "UntrustedHost" and renders the "Server error / problem
      # with the server configuration" page. Safe for local dev behind a known host.
      AUTH_TRUST_HOST: "true"
      # Server-side (container) can't reach Keycloak at localhost:8080 (that's the
      # container itself). Keycloak's discovery is backchannel-dynamic: fetched via this
      # internal URL it returns internal token/jwks endpoints but keeps issuer +
      # authorization on localhost:8080 (browser + iss stay correct). auth.ts points its
      # wellKnown here; tokenUtils.ts uses it for the refresh token endpoint.
      KEYCLOAK_INTERNAL_ISSUER: http://civitas-keycloak:8080/realms/civitas-core
      # Server-side BFF calls (serverFetch / the /api proxy) run inside the container, so
      # they must reach APISIX by its Docker network name — localhost:9080 (from .env.local)
      # is the container itself and refuses the connection (ECONNREFUSED).
      API_BASE_URL: http://civitas-apisix
      API_PORT: "9080"
    env_file:
      - path: ../../portal-frontend/.env.local
        required: false
    networks:
      - civitas-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Model Forge Admin UI — registry console (Wicket + Spring Boot). Standalone app (not embedded in
  # portal-backend); points at portal-backend's DB and creates/owns the model_forge schema there.
  # portal-backend does not write to that registry yet, so on a fresh stack the console is empty and
  # shows only what you create through its pages. Started by start-portal-dev.sh unless --no-admin-ui.
  model-forge-admin-ui:
    build:
      context: ../../model-forge/model-forge-admin-ui
      dockerfile: Dockerfile
    mem_limit: 640m
    container_name: civitas-model-forge-admin-ui
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65"
      SERVER_PORT: 8094
      # Host is the Docker service name (not localhost); read-WRITE console over the real registry.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis-dev-env:5432/portal_backend?sslmode=disable
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # pgAdmin — optional web DB console for the portal Postgres (schemas: public + model_forge).
  # Off by default; started by start-portal-dev.sh only with --pgadmin. The "CIVITAS Portal DB"
  # server is pre-registered via servers.json (enter password "admin" on first connect).
  pgadmin:
    image: dpage/pgadmin4:latest@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    mem_limit: 256m
    container_name: civitas-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@civitas.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - civitas-network

networks:
  civitas-network:
    name: civitas-network
    external: true
