# NiFi MVP demo — Mosquitto MQTT broker + PostGIS sink.
#
# Spun up manually (NOT wired into start-portal-dev.sh):
#   cd dev-environment/nifi/demo && docker compose up -d
#
# The broker joins civitas-network. The demo writes to the shared PostGIS database
# `nifi_demo` on postgis-dev-env, which must be running first.

services:
  mosquitto:
    image: eclipse-mosquitto:2.0@sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
    container_name: civitas-nifi-demo-mosquitto
    restart: unless-stopped
    # Host port only serves external MQTT clients; NiFi reaches the broker via
    # civitas-network. Override when 1883 is taken (FROST publishes its own MQTT there).
    ports:
      - "${MOSQUITTO_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - civitas-network

networks:
  civitas-network:
    name: civitas-network
    external: true
