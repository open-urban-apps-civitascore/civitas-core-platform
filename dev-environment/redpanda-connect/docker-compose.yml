# Redpanda Connect — Pipeline deployment engine
#
# Runs in "streams" mode: exposes REST API on port 4195 for
# dynamic pipeline CRUD by the config-adapter saga handler.
#
# FROST_BASE is the internal FROST URL used by pipeline output templates.

services:
  redpanda-connect:
    image: redpandadata/connect:4
    container_name: civitas-redpanda-connect
    restart: unless-stopped
    command: ["streams"]
    ports:
      - "4195:4195"
    environment:
      - FROST_BASE=http://civitas-frost:8080/FROST-Server/v1.1
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4195/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  civitas-network:
    name: civitas-network
    external: true
