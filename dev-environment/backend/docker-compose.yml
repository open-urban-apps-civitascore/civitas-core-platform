# ============================================================
# CIVITAS CORE Platform - Backend Services
# ============================================================
# This compose file orchestrates all backend services by
# including existing infrastructure service definitions
# to avoid configuration duplication.
# ============================================================

include:
  - path: ../kafka/docker-compose.yml
  - path: ../postgres/docker-compose.yml
  - path: ../keycloak/docker-compose.yml
  - path: ../apisix/docker-compose.authz.yml
  - path: ../apisix/docker-compose.yml

services:
  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  portal-backend:
    build:
      context: ../../portal-backend
      dockerfile: Dockerfile
    container_name: civitas-portal-backend
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-portal:5432/portal_backend
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://civitas-keycloak:8080
      KEYCLOAK_ISSUER_URI: http://civitas-keycloak:8080
      KEYCLOAK_REALM: civitas-core
      KEYCLOAK_TARGET_REALM: civitas-core
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: local,postgres,init
    depends_on:
      postgres-portal:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  config-adapter:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
    container_name: civitas-config-adapter
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      SERVER_PORT: 8088
      PORT: 8088
      KEYCLOAK_URL: http://keycloak:8080
      # Flowable saga engine — dedicated database on the portal PostgreSQL
      # (provisioned by dev-environment/postgres/docker-compose.yml). Without this the
      # container falls back to the localhost:5433 default and fails to boot.
      FLOWABLE_JDBC_URL: jdbc:postgresql://postgres-portal:5432/flowable
      FLOWABLE_JDBC_USERNAME: admin
      FLOWABLE_JDBC_PASSWORD: admin
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1
      # Required (issue #1368). api.localhost needs an /etc/hosts entry on the host.
      APISIX_API_HOST: api.localhost
      APISIX_API_PUBLIC_URL: http://api.localhost:9080
      APISIX_PLUGIN_CONFIG_ID: "1"
      APISIX_SERVICE_ID: svc-frost-server
      # Headers the saga's route-level proxy-rewrite must strip in lieu of plugin_config 1
      # (Route-over-PluginConfig precedence overrides plugin_config's proxy-rewrite).
      APISIX_PROXY_REWRITE_HEADERS_REMOVE: X-Allowed-Scope-Ids,X-Allowed-Pool-Ids
      # FROST upstream auth APISIX injects when proxying private dataset routes.
      APISIX_FROST_API_KEY: dev-frost-api-key
      APISIX_FROST_API_KEY_HEADER: X-API-Key
      # FROST adapter target (issue #1368). The application.properties default frost.url is
      # localhost:8085 — inside the container that is the config-adapter itself. Must point at the
      # FROST service on the shared external civitas-network instead, or release/update sagas
      # provision against the wrong address.
      FROST_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_PUBLIC_URL: http://civitas-frost:8080/FROST-Server/v1.1
      FROST_API_KEY: dev-frost-api-key
      FROST_API_KEY_HEADER: X-API-Key
    depends_on:
      # Flowable's JDBC URL targets postgres-portal — wait until it is healthy before boot.
      postgres-portal:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  civitas-network:
    name: civitas-network
    external: true

