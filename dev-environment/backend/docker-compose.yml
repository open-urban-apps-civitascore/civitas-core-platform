# ============================================================
# CIVITAS CORE Platform - Backend Services
# ============================================================
# This compose file orchestrates all backend services by
# including existing infrastructure service definitions
# to avoid configuration duplication.
# ============================================================

include:
  - path: ../kafka/docker-compose.yml
  - path: ../postgres/docker-compose.yml
  - path: ../keycloak/docker-compose.yml
  - path: ../modelatlas/docker-compose.yml
  - path: ../apisix/docker-compose.yml

services:
  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  portal-backend:
    build:
      context: ../../portal-backend
      dockerfile: Dockerfile
    container_name: civitas-portal-backend
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-portal:5432/portal_backend
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8080
      KEYCLOAK_REALM: civitas-core
      KEYCLOAK_TARGET_REALM: civitas-core
      APP_URL: http://localhost:8089
      SERVER_PORT: 8089
      SPRING_PROFILES_ACTIVE: local,postgres,local-init
    depends_on:
      postgres-portal:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  config-adapter:
    build:
      context: ../../config-adapter
      dockerfile: Dockerfile
    container_name: civitas-config-adapter
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      SERVER_PORT: 8088
      PORT: 8088
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - civitas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  civitas-network:
    name: civitas-network
    driver: bridge

