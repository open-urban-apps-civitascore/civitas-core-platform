# OPA (Open Policy Agent) for AuthZ
# M4: Policy evaluation service for authorization decisions
#
# Directory structure (M4.6):
#   - policy/: Core policy modules (main, permission_eval, resource_mapping)
#   - lib/: Shared library modules (genericrestmapper)
#   - providers/: Backend-specific providers (portal_backend, frost_server)
#   - backends/: Backend data files (endpoint mappings)

services:
  opa:
    image: openpolicyagent/opa:1.4.2-static
    container_name: civitas-opa
    restart: always
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "--log-format=json"
      - "--set=decision_logs.console=true"
      - "/policies"
      - "/lib"
      - "/providers"
      - "/data"
    volumes:
      - ../../authz/rego/policy:/policies:ro
      - ../../authz/rego/lib:/lib:ro
      - ../../authz/rego/providers:/providers:ro
      - ../../authz/rego/backends:/data/backends:ro
    ports:
      - "8181:8181"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - civitas-network
    healthcheck:
      # Note: -static image has no wget/curl/shell. Use OPA binary directly.
      # OPA's eval command returns 0 on success.
      test: ["CMD", "/opa", "eval", "-f", "pretty", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  civitas-network:
    name: civitas-network
    external: true
