# APISIX Routes with OPA Authorization
# M5: Full AuthZ integration - APISIX -> OPA -> AuthZ Repository
#
# Request flow:
#   1. proxy-rewrite: Sets X-Authz-Backend header for OPA
#   2. openid-connect: Validates JWT, sets X-Userinfo header (base64 claims)
#   3. opa: Calls OPA for authorization decision
#   4. Request forwarded to backend if allowed (403 if denied)
#
# =============================================================================
# JWT VALIDATION NOTES (see dev-environment/apisix/apisix_conf/apisix.yaml)
# =============================================================================
# We use a static public_key because Keycloak in dev mode returns localhost URLs
# in its discovery document, which APISIX (inside Docker) cannot reach.
# In production with HTTPS, use dynamic JWKS discovery instead.

routes:
  # Protected API routes - require valid JWT and OPA authorization
  - id: portal-backend-api
    name: "Portal Backend API (AuthZ)"
    uri: /v2/*
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:8089": 1
      timeout:
        connect: 6
        send: 6
        read: 6
    plugins:
      # 1. Backend identifier for OPA authorization
      # OPA uses this header to select the correct permission mappings file.
      proxy-rewrite:
        headers:
          set:
            X-Authz-Backend: portal-backend

      # 2. JWT validation - validates token and sets X-Userinfo header
      openid-connect:
        client_id: "apisix-validator"
        client_secret: "unused-for-jwks-validation"
        discovery: "http://civitas-keycloak:8080/realms/civitas-core/.well-known/openid-configuration"
        bearer_only: true
        ssl_verify: false
        public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoBMiel0QuEnffhFS7IUL
          T6IwUUOpNLjTjZtzNSRP4nAmsTJBdo/PA1MSOpTDHO2gCF+kKjMUYofBibk2U+ta
          YErB5JdxYgBBgqnl5F3KVae80n0XsrtIenkMit71McM6q1p5LpIf2cLzbdiYTzWY
          2Z4ED+BD1xllfmWwF1dbBX9sWcszdafFTZ55P6ZoiA+FXmOEhAqjAqHR1yaz2SjD
          f1F7fhLc6ADk249vw3MsD4RF5KYB6IHnUAXmjoSyayLSRw1f+wjU4vJv9xID1ioo
          E+aAtJh0BDQMi51xrIcpZVeJAXqNZu/ITx71Nk9rJQyj/WMpqyxSapPJOdpssiKv
          5wIDAQAB
          -----END PUBLIC KEY-----
        # Pass decoded JWT claims to OPA via X-Userinfo header
        set_userinfo_header: true

      # 3. OPA authorization - calls OPA for permission decision
      # OPA will:
      #   - Decode X-Userinfo to get external ID (sub claim)
      #   - Fetch user context from AuthZ Repository
      #   - Evaluate permission against endpoint mappings
      #   - Return allowed/denied decision
      #
      # NOTE: with_route=true so OPA can see the route ID to determine the backend.
      # The proxy-rewrite headers are for upstream, not visible to OPA.
      #
      # M5.5: send_headers_upstream passes OPA response headers to backend.
      # OPA returns X-Allowed-Scope-Ids for collection filtering.
      opa:
        host: "http://civitas-opa:8181"
        policy: "civitas/authz/decision"
        with_route: true
        with_service: false
        with_consumer: false
        send_headers_upstream:
          - "X-Allowed-Scope-Ids"

      # 4. Request ID for tracing
      request-id:
        include_in_response: true

  # Backend health check (public, no auth required)
  - id: backend-health
    name: "Backend Health Check"
    uri: /v2/actuator/health
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:8089": 1
    plugins: {}

#END
