  /permissions:
    get:
      tags:
      - Permissions
      summary: List all permissions
      description: "Returns a filterable, sorted list of permissions."
      operationId: listPermissions
      parameters:
      - name: sort
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Sort"
      - name: id
        in: query
        description: Filter by one or more IDs (comma-separated).
        schema:
          type: string
          example: "1,2,3"
        example: "1,2,3"
      - name: createdAtFrom
        in: query
        description: Filter by creation date greater than or equal to this value (ISO
          8601).
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - name: createdAtTo
        in: query
        description: Filter by creation date less than or equal to this value (ISO
          8601).
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - name: modifiedAtFrom
        in: query
        description: Filter by modification date greater than or equal to this value
          (ISO 8601).
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - name: modifiedAtTo
        in: query
        description: Filter by modification date less than or equal to this value
          (ISO 8601).
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - name: name
        in: query
        description: "Filter by name (partial match, case-insensitive)."
        schema:
          type: string
          example: read
      - name: description
        in: query
        description: "Filter by description (partial match, case-insensitive)."
        schema:
          type: string
          example: Allows read access
      - name: q
        in: query
        description: "Search in name or description (partial match, case-insensitive)."
        schema:
          type: string
          example: read
      - name: permissionType
        in: query
        description: Filter by permission type (exact match).
        schema:
          type: string
          enum:
          - SYSTEM
          - DATA
          - GOVERNANCE
      - name: category
        in: query
        description: Filter by category (exact match).
        schema:
          type: string
          enum:
          - TENANT_ADMINISTRATION
          - DATA
      - name: source
        in: query
        description: Filter by source (exact match).
        schema:
          type: string
          enum:
          - INTERNAL
      responses:
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
