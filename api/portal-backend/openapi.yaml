        in: query
        name: sort
        required: false
        schema:
          type: array
          default:
          - "createdAt,DESC"
          items:
            type: string
      - description: Filter by one or more IDs (comma-separated).
        example: "1,2,3"
        in: query
        name: id
        schema:
          type: string
          example: "1,2,3"
      - description: Filter by creation date greater than or equal to this value (ISO
          8601).
        in: query
        name: createdAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by creation date less than or equal to this value (ISO
          8601).
        in: query
        name: createdAtTo
        schema:
          type: string
          format: date-time
