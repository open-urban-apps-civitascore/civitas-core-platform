          readOnly: true
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        dataStructureVersionStatus:
          type: string
          enum:
          - DRAFT
          - AVAILABLE
        dataStructureVersionSource:
          type: string
          enum:
          - OWN
        description:
          type: string
        version:
          type: string
        dataStructureId:
          type: string
          format: uuid
