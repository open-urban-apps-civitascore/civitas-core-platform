                      the dataset is DRAFT. Unstage or unrelease the dataset first.
                    instance: /datapools
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:DATASET_NOT_EDITABLE
                invalid_input:
                  summary: invalid_input
                  value:
                    detail: "Validation failed: name must not be blank"
                    instance: /datapools
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:INVALID_INPUT
                malformed_request:
                  summary: malformed_request
                  value:
                    detail: Failed to read request body
                    instance: /datapools
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:MALFORMED_REQUEST
                model_member_unreachable:
                  summary: model_member_unreachable
                  value:
                    detail: "DataStructureVersion model has members that its root\
                      \ Element does not reach: Orphan"
                    instance: /datapools
                    memberNames:
                    - Orphan
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:MODEL_MEMBER_UNREACHABLE
                model_root_missing:
                  summary: model_root_missing
                  value:
                    detail: DataStructureVersion model must designate exactly one
                      root Element before releasing
                    instance: /datapools
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:MODEL_ROOT_MISSING
                validation_failed:
                  summary: validation_failed
                  value:
                    detail: Request body validation failed
                    instance: /datapools
                    status: 400
                    title: Bad Request
                    type: urn:civitas:error:VALIDATION_FAILED
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid input
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          content:
            application/problem+json:
              examples:
                foreign_key_violation:
                  summary: foreign_key_violation
                  value:
                    detail: Referenced entity does not exist
                    instance: /datapools
                    status: 409
                    title: Conflict
                    type: urn:civitas:error:FOREIGN_KEY_VIOLATION
                model_missing:
                  summary: model_missing
                  value:
                    detail: DataStructureVersion model is missing from the model registry
                    instance: /datapools
                    status: 409
                    title: Conflict
                    type: urn:civitas:error:MODEL_MISSING
                resource_in_use:
                  summary: resource_in_use
                  value:
                    detail: "Cannot delete: resource is referenced by other entities"
                    instance: /datapools
                    status: 409
                    title: Conflict
                    type: urn:civitas:error:RESOURCE_IN_USE
                saga_in_flight:
                  summary: saga_in_flight
                  value:
                    detail: "Cannot write while a saga is in-flight: CREATE"
                    instance: /datapools
                    pendingSagaType: CREATE
                    status: 409
                    title: Conflict
                    type: urn:civitas:error:SAGA_IN_FLIGHT
                unique_constraint:
