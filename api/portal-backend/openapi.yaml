          readOnly: true
        name:
          type: string
          example: Traffic Sensor MQTT
        description:
          type: string
          example: Real-time traffic sensor data via MQTT broker
        dataSourceStatus:
          type: string
          enum:
          - DRAFT
          - AVAILABLE
          example: ACTIVE
        connectorType:
          type: string
          description: "Type of connector (e.g. MQTT, SQL)"
          enum:
          - MQTT
          - SQL
          example: MQTT
        configuration:
          type: object
          additionalProperties: {}
          description: "The configuration object, structure depends on the connector\
            \ type"
          oneOf:
          - $ref: "#/components/schemas/MqttConnectorConfiguration"
          - $ref: "#/components/schemas/SqlConnectorConfiguration"
        dataStructureVersion:
          $ref: "#/components/schemas/DataStructureVersionSummaryDTO"
        inUse:
          type: boolean
          description: Whether this data source is currently referenced by a pipeline
          readOnly: true
    NamedApiDTO:
      type: object
      description: |
        A named, URL-slug-addressable API endpoint exposed by a dataset. Each
        named API declares an explicit API standard per ADR #1362. Authored at
        dataset level (not per pipeline) per concept #1379 and #1383.
      properties:
        name:
          type: string
          description: |
            Human-readable display label for this named API. Free-form text;
            not used in the URL. Required.
          example: Traffic Sensor Readings
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          maxLength: 32
          description: |
            URL slug used as the path segment in the public route:
            `/v1/datasets/{datasetId}/{slug}`. Lowercase alphanumeric with
            internal hyphens, max 32 characters, unique within the dataset.
            Immutable once the dataset reaches AVAILABLE.
          example: traffic
        standard:
          type: string
          enum: [WFS, WMS, STA, CUSTOM]
          description: |
            API standard per ADR #1362. `CUSTOM` allows free-form,
            non-standard APIs. Immutable once the dataset reaches AVAILABLE.
          example: STA
        version:
          type: string
          description: |
            Optional standard version (e.g. `"1.1"` for STA). Free-form
            string.
          example: "1.1"
        description:
          type: string
          maxLength: 150
          description: |
            Optional free-form description of the named API surfaced in the
            dataset form and discovery responses. Max 150 characters.
          example: Live traffic counter readings from city sensors.
        previewUrl:
          type: string
          format: uri
          readOnly: true
          description: |
            Predicted public URL once the dataset reaches AVAILABLE:
            `{civitas.api.base-url}/v1/datasets/{datasetId}/{slug}`.
            Built server-side from the configured data-plane base URL (per
            concept #1380 + ADR #1387). Absent before the dataset has been
            persisted.
          example: https://api.core.civitasconnect.digital/v1/datasets/b7c8b5d4-3d9c-4e3b-9a12-6b7c3f1d9e2a/traffic
      required:
      - name
      - slug
      - standard
    DataSetInputDTO:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentScopedInputDTO"
          uniqueItems: true
        name:
          type: string
          maxLength: 255
          minLength: 3
        description:
          type: string
        openDataAccess:
          type: boolean
          description: "Whether this dataset is publicly accessible, defaults to false"
        namedApis:
          type: array
          items:
            $ref: "#/components/schemas/NamedApiDTO"
          description: |
            Named API endpoints exposed by this dataset (per concepts #1379
            and #1383). Each entry produces one published distribution and
            one APISIX route after release. Slug uniqueness within the
            dataset is enforced at publish time (#1312).
      required:
