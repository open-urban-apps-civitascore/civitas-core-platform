        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          default:
          - "createdAt,DESC"
          items:
            type: string
      - description: Filter by one or more IDs (comma-separated).
        example: "1,2,3"
        in: query
        name: id
        schema:
          type: string
          example: "1,2,3"
      - description: Filter by creation date greater than or equal to this value (ISO
          8601).
        in: query
        name: createdAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by creation date less than or equal to this value (ISO
          8601).
        in: query
        name: createdAtTo
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - description: Filter by modification date greater than or equal to this value
          (ISO 8601).
        in: query
        name: modifiedAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by modification date less than or equal to this value
          (ISO 8601).
        in: query
        name: modifiedAtTo
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - description: "Filter by name (partial match, case-insensitive)."
        in: query
        name: name
        schema:
          type: string
          example: mobility
      - description: "Filter by description (partial match, case-insensitive)."
        in: query
        name: description
        schema:
          type: string
          example: governance
      - description: "Search in name or description (partial match, case-insensitive)."
        in: query
        name: q
        schema:
          type: string
          example: city
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDataPoolOutputDTO"
          description: Page of datapools returned successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: List all datapools
      tags:
      - DataPools
    post:
      description: Creates a new datapool and returns it with a Location header pointing
        to the new datapool URI.
      operationId: createDataPool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataPoolInputDTO"
        required: true
