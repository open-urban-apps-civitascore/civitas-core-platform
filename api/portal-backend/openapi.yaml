openapi: 3.1.0
info:
  title: Portal Backend API
  description: >-
    REST API for the CIVITAS CORE portal backend. Manages users, groups, roles,
    permissions, assignments, data sources, datasets, data structures, data spaces,
    pipelines, and catalogs.
  contact:
    name: CIVITAS CORE Team
  version: 2.0.0
servers:
- url: http://localhost:8089/v2
  description: Local development
tags:
- name: Users
  description: User management endpoints
- name: Data Structures
  description: Data structure management endpoints
- name: Authorities
  description: Authority management API (stub)
- name: Pipelines
  description: Pipeline management endpoints
- name: Assignments
  description: Role assignment management endpoints
- name: Data Structure Versions
  description: Data structure version management endpoints
- name: Groups
  description: Group management API
- name: Roles
  description: Role management endpoints
- name: Permissions
  description: Permission management endpoints
- name: DataSets
  description: Dataset management endpoints
- name: DataSources
  description: Data source management endpoints
paths:
