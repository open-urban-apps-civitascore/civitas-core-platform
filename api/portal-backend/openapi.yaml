  /groups/{groupId}/assignments:
    put:
      tags:
      - Groups
      summary: Replace group assignments
      description: Replaces all role assignments for a group using diff-based semantics.
      operationId: replaceGroupAssignments
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AssignmentGroupInputDTO"
              uniqueItems: true
        required: true
      responses:
        "404":
