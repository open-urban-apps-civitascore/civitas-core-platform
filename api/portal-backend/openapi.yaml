    DataSourceInputDTO:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentScopedInputDTO'
        name:
          type: string
          minLength: 1
        description:
          type: string
        connectorType:
          type: string
          enum:
          - MQTT
          - SQL
        configuration:
          type: object
          additionalProperties: {}
          description: Connector-specific configuration. Structure depends on connectorType.
          oneOf:
          - $ref: '#/components/schemas/MqttConnectorConfiguration'
          - $ref: '#/components/schemas/SqlConnectorConfiguration'
        dataStructureVersionId:
          type: string
          format: uuid
      required:
      - name
    MqttConnectorConfiguration:
      type: object
      properties:
        urls:
          type: array
          description: Broker URLs. Embedded credentials are stripped — use user/password
            instead.
          example:
          - tcp://broker:1883
          items:
            type: string
        topics:
          type: array
          description: MQTT topic filters.
          example:
          - sensor/#
          items:
            type: string
        qos:
          type: integer
          format: int32
          description: 'QoS level: 0 = at most once, 1 = at least once, 2 = exactly
            once.'
          example: 1
          maximum: 2
          minimum: 0
        keepalive:
          type: string
          description: Keepalive interval.
          example: 30s
        tls:
          $ref: '#/components/schemas/Tls'
          description: TLS configuration.
        user:
          type: string
          description: Broker username.
          example: mqttuser
        password:
          type: string
          description: Broker password. Write-only — returned as "********" in responses.
          example: secret
          writeOnly: true
        client_id:
          type: string
          description: MQTT client identifier.
          example: civitas-client-1
        connect_timeout:
          type: string
          description: Connection timeout duration.
          example: 5s
    SqlConnectorConfiguration:
      type: object
      properties:
        driver:
          type: string
          description: Database driver type.
          example: postgres
        dsn:
          type: string
          description: Connection URL. Embedded credentials are stripped — use user/password
            instead.
          example: postgres://localhost:5432/mydb
        table:
          type: string
          description: Target table name.
          example: sensor_readings
        columns:
          type: array
          description: Column names to select.
          example:
          - id
          - value
          - timestamp
          items:
            type: string
        prefix:
          type: string
          description: SQL prefix prepended to the query.
        suffix:
          type: string
          description: SQL suffix appended to the query.
        user:
          type: string
          description: Database username.
          example: dbuser
        password:
          type: string
          description: Database password. Write-only — returned as "********" in responses.
          example: secret
          writeOnly: true
        where:
          type: string
          description: SQL WHERE clause.
          example: id > :last_id
        init_statement:
          type: string
          description: SQL statement executed on connection init.
        conn_max_idle_time:
          type: string
          description: Maximum idle time per connection.
          example: 10m
        conn_max_life_time:
          type: string
          description: Maximum lifetime per connection.
          example: 1h
        conn_max_idle:
          type: integer
          format: int32
          description: 'Maximum number of idle connections. Default: 2.'
          example: 2
        conn_max_open:
          type: integer
          format: int32
          description: 'Maximum number of open connections. 0 = unlimited. Default:
            0.'
          example: 0
