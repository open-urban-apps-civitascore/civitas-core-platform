openapi: 3.1.0
info:
  title: CIVITAS/CORE Data Management API
  description: "REST API for the CIVITAS/CORE smart city data management platform.\
    \ Manages datasets, data sources, data structures, users, groups, roles, and permissions."
  contact:
    name: CIVITAS Connect
    url: https://civitasconnect.digital
  license:
    name: EUPL-1.2
    url: https://eupl.eu/1.2/en/
  version: 2.0.0
  summary: Smart city data management REST API
externalDocs:
  description: CIVITAS/CORE Developer Documentation
  url: https://docs.core.civitasconnect.digital/docs_v2/Development/intro
servers:
- url: /v1
security:
- oauth2: []
tags:
- name: Users
  description: User management endpoints
- name: Data Structures
  description: Data structure management endpoints
- name: Authorities
  description: Authority management API (stub)
- name: Pipelines
  description: Pipeline management endpoints
- name: Assignments
  description: Role assignment management endpoints
- name: Data Structure Versions
  description: Data structure version management endpoints
- name: Groups
  description: Group management API
- name: Roles
  description: Role management endpoints
- name: Permissions
  description: Permission management endpoints
- name: DataSets
  description: Dataset management endpoints
- name: DataSources
  description: Data source management endpoints
paths:
  /users/{id}:
    get:
      tags:
      - Users
      summary: Get user by ID
      description: Returns a single user identified by its UUID.
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: User returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutputDTO"
    put:
      tags:
      - Users
      summary: Replace a user
      description: Fully replaces an existing user with the provided input.
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInputDTO"
        required: true
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict (e.g. unique constraint violation)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutputDTO"
    delete:
      tags:
      - Users
      summary: Delete a user
      description: Permanently deletes a user by its UUID.
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict (user still in use)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "204":
          description: User deleted successfully
    patch:
      tags:
      - Users
      summary: Partially update a user
      description: Applies a partial JSON update to an existing user. Only provided
        fields are modified.
      operationId: patchUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserInputDTO"
        required: true
      responses:
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "400":
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Conflict (e.g. unique constraint violation)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: User patched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOutputDTO"
