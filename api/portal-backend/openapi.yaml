    MqttConnectorConfiguration:
      type: object
      properties:
        connect_timeout:
          type: string
          description: Connection timeout duration.
          example: 5s
        keepalive:
          type: string
          description: Keepalive interval.
          example: 30s
        password:
          type: string
          description: Broker password. Write-only — returned as "********" in responses.
          example: secret
          writeOnly: true
        protocol_version:
          type: string
          default: "3"
          description: MQTT major protocol version.
          enum:
          - "3"
          - "5"
          example: "3"
          pattern: 3|5
        qos:
          type: integer
          format: int32
          description: "QoS level: 0 = at most once, 1 = at least once, 2 = exactly\
            \ once."
          example: 1
          maximum: 2
          minimum: 0
        tls:
          $ref: "#/components/schemas/Tls"
          description: TLS configuration.
        topics:
          type: array
          description: "MQTT topic filter. Exactly one filter, which may use wildcards\
            \ (+ one level, # multiple) to match several topics."
          example:
          - sensor/#
          items:
            type: string
        urls:
          type: array
          description: Broker URLs. Embedded credentials are stripped — use user/password
            instead.
          example:
          - tcp://broker:1883
          items:
            type: string
        user:
          type: string
          description: Broker username.
          example: mqttuser
      required:
      - protocol_version
    NamedApiInputDTO:
      type: object
      properties:
        description:
          type: string
          description: Optional free-form description of the named API surfaced in
            the dataset form and discovery responses. Max 150 characters.
          example: Live traffic counter readings from city sensors.
          maxLength: 150
          minLength: 0
        name:
          type: string
          description: Human-readable display label for this named API. Max 255 characters.
          example: Traffic Sensor Readings
          maxLength: 255
          minLength: 0
        slug:
          type: string
          description: "URL slug used as the path segment in the public route /v1/datasets/{datasetId}/{slug}.\
            \ Lowercase alphanumeric with internal hyphens, max 32 characters, unique\
            \ within a dataset, not one of the reserved platform names (apis, usable-datasources,\
            \ api, v1, admin), immutable while AVAILABLE."
          example: traffic
          maxLength: 32
          minLength: 0
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        standard:
          type: string
          description: "API standard. CUSTOM allows free-form, non-standard APIs.\
            \ Immutable once the dataset reaches AVAILABLE."
          enum:
          - OWS
          - STA
          - CUSTOM
          example: STA
        version:
          type: string
          description: "Optional standard version (e.g. \"1.1\" for STA). Free-form\
            \ string, max 32 characters."
          example: "1.1"
          maxLength: 32
          minLength: 0
      required:
      - name
      - slug
      - standard
    NamedApiOutputDTO:
      type: object
      properties:
        description:
          type: string
          description: Optional free-form description of the named API. Max 150 characters.
          example: Live traffic counter readings from city sensors.
        name:
          type: string
          description: Human-readable display label for this named API.
          example: Traffic Sensor Readings
        previewUrl:
          type: string
          description: "Predicted public URL once the dataset reaches AVAILABLE: {publicUrl}/{slug},\
            \ where publicUrl is the base the saga provisioned the APISIX route under\
            \ (APISIX_API_PUBLIC_URL). Falls back to {civitas.api.base-url}/v1/datasets/{datasetId}/{slug}\
            \ for datasets provisioned before the saga set publicUrl. Server-populated;\
            \ absent before the dataset is persisted."
          example: https://api.core.civitasconnect.digital/v1/datasets/b7c8b5d4-3d9c-4e3b-9a12-6b7c3f1d9e2a/traffic
          readOnly: true
        slug:
          type: string
          description: "URL slug used as the path segment in the public route /v1/datasets/{datasetId}/{slug}."
          example: traffic
        standard:
          type: string
          description: API standard.
          enum:
          - OWS
          - STA
          - CUSTOM
          example: STA
        version:
          type: string
          description: Optional standard version (e.g. "1.1" for STA).
          example: "1.1"
