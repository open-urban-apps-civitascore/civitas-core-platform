  /users:
    get:
      tags:
      - Users
      operationId: getAll
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - createdAt,DESC
          items:
            type: string
      - name: id
        in: query
        description: Filter by one or more IDs (comma-separated).
        schema:
          type: string
          example: 1,2,3
        example: 1,2,3
      - name: createdAtFrom
        in: query
        description: Filter by creation date greater than or equal to this value (ISO
          8601).
        schema:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
      - name: createdAtTo
        in: query
        description: Filter by creation date less than or equal to this value (ISO
          8601).
        schema:
          type: string
          format: date-time
          example: '2024-12-31T23:59:59Z'
      - name: modifiedAtFrom
        in: query
        description: Filter by modification date greater than or equal to this value
          (ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
      - name: modifiedAtTo
        in: query
        description: Filter by modification date less than or equal to this value
          (ISO 8601).
        schema:
          type: string
          format: date-time
          example: '2024-12-31T23:59:59Z'
      - name: firstName
        in: query
        description: Filter by first name (partial match, case-insensitive).
        schema:
          type: string
          example: John
      - name: lastName
        in: query
        description: Filter by last name (partial match, case-insensitive).
        schema:
          type: string
          example: Doe
      - name: email
        in: query
        description: Filter by email (exact match, case-insensitive).
        schema:
          type: string
          example: john.doe@example.com
      - name: active
        in: query
        description: Filter by active status.
        schema:
          type: boolean
          example: true
      - name: externalId
        in: query
        description: Filter by external ID (exact match).
        schema:
          type: string
          example: ext-123
      - name: q
        in: query
        description: Search in full name, or email (partial match, case-insensitive).
        schema:
          type: string
          example: john doe, john@doe.com
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageUserOutputDTO'
    post:
      tags:
      - Users
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInputDTO'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
