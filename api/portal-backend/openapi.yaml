  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            expired_token:
              summary: expired_token
              value:
                type: urn:civitas:error:UNAUTHORIZED
                title: Unauthorized
                status: 401
                detail: Authentication required
                instance: /v1/datasets
            invalid_token:
              summary: invalid_token
              value:
                type: urn:civitas:error:INVALID_TOKEN
                title: Unauthorized
                status: 401
                detail: JWT validation failed
                instance: /v1/datasets
    Forbidden:
      description: Insufficient privileges
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            access_denied:
              summary: access_denied
              value:
                type: urn:civitas:error:ACCESS_DENIED
                title: Forbidden
                status: 403
                detail: Insufficient privileges
                instance: /v1/datasets
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            data_integrity_error:
              summary: data_integrity_error
              value:
                type: urn:civitas:error:DATA_INTEGRITY_ERROR
                title: Internal Server Error
                status: 500
                detail: A database constraint was violated
                instance: /v1/datasets
            persistence_error:
              summary: persistence_error
              value:
                type: urn:civitas:error:PERSISTENCE_ERROR
                title: Internal Server Error
                status: 500
                detail: An unexpected database error occurred
                instance: /v1/datasets
  securitySchemes:
    oauth2:
      type: oauth2
      description: Keycloak OAuth2 Authorization Code with PKCE
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/civitas-core/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/civitas-core/protocol/openid-connect/token
          scopes: {}
