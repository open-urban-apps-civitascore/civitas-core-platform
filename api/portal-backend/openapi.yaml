  /datastructures:
    get:
      description: "Returns a paginated, filterable list of data structures. Supports\
        \ sorting and specification-based filtering."
      operationId: listDataStructures
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          default:
          - "createdAt,DESC"
          items:
            type: string
      - description: Filter by one or more IDs (comma-separated).
        example: "1,2,3"
        in: query
        name: id
        schema:
          type: string
          example: "1,2,3"
      - description: Filter by creation date greater than or equal to this value (ISO
          8601).
        in: query
        name: createdAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by creation date less than or equal to this value (ISO
          8601).
        in: query
        name: createdAtTo
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - description: Filter by modification date greater than or equal to this value
          (ISO 8601).
        in: query
        name: modifiedAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
