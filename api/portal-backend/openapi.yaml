        name: id
        schema:
          type: string
          example: "1,2,3"
      - description: Filter by creation date greater than or equal to this value (ISO
          8601).
        in: query
        name: createdAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by creation date less than or equal to this value (ISO
          8601).
        in: query
        name: createdAtTo
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - description: Filter by modification date greater than or equal to this value
          (ISO 8601).
        in: query
        name: modifiedAtFrom
        schema:
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
      - description: Filter by modification date less than or equal to this value
          (ISO 8601).
        in: query
        name: modifiedAtTo
        schema:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z
      - description: "Filter by name (partial match, case-insensitive)."
        in: query
        name: name
        schema:
          type: string
          example: mqtt-sensor
      - description: "Filter by description (partial match, case-insensitive)."
