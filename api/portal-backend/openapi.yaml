  /datastructures/{dataStructureId}/versions/{versionId}/published/meta:
    put:
      tags:
      - Data Structure Versions
      summary: Update metadata of a published data structure version
      description: "Updates only the metadata (version, modelName, styles) of a published\
        \ data structure version (AVAILABLE status). Cannot modify modelAtlasUri or\
        \ model. For DRAFT versions, use PUT /datastructures/{dataStructureId}/versions/{versionId}\
        \ instead."
      operationId: updateDataStructureVersionPublishedMeta
      parameters:
      - name: dataStructureId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        required: true
        schema:
