    get:
      tags:
      - Users
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserOutputDTO'
    put:
      tags:
      - Users
      operationId: update
      parameters:
